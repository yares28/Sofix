<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="design-check" content="crowd: a player page shows Sorare's own numbers beside ours — that contrast is the point of the overlay">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay on sorare.com</title>
<style>
/* Sorare's page is dark and its own; this file mocks just enough of it to show the overlay in place.
   The Sofix look (white, calm) is deliberately not used here — S7 is the one page that lives on their site. */
:root {
  --page: #0e0e0e; --panel: #161618; --panel-2: #1d1d20; --line: #2a2a2e;
  --text: #ffffff; --text-2: #9a9aa2; --text-3: #7c7c85;
  --sofix: #5cc58d; --sofix-deep: #1f7a4f; --sofix-ink: #05130c;
  --gold: #f7c948; --violet: #6a48e8; /* their violet, a shade down so white on it is readable */
  --f-lim: linear-gradient(145deg, #fff3c4 0%, #f7c948 38%, #d99a0b 62%, #ffe08a 100%);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --ease: cubic-bezier(.3,.7,.2,1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--text); }
body { font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.page { max-width: 1120px; margin: 0 auto; padding: 0 18px 90px; }

/* their chrome, roughly */
.bar { display: flex; align-items: center; height: 56px; border-bottom: 1px solid var(--line); }
.url { padding: 7px 14px; border-radius: 999px; background: var(--panel-2); font-size: 12px; color: var(--text-2); }
.crumbs { display: flex; gap: 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 18px 0 10px; }

.hero { position: relative; border-radius: 14px; overflow: hidden; background: linear-gradient(115deg, #2a0f12 0%, #571b20 45%, #14090b 100%); padding: 26px 24px 20px; }
.hero h1 { margin: 0; font-size: 54px; line-height: .92; font-weight: 800; letter-spacing: -0.03em; text-transform: uppercase; }
.facts { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 16px; font-size: 12px; color: #d6d6dd; }
.facts span b { display: block; color: #fff; font-size: 13px; }

.tabs { display: flex; gap: 22px; margin: 18px 0 0; border-bottom: 1px solid var(--line); }
.tabs span { padding: 12px 0; font-size: 14px; color: var(--text-2); }
.tabs span.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--violet); }

.cols { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 20px; margin-top: 18px; align-items: start; }
.form { display: flex; gap: 12px; flex-wrap: wrap; }
.form .box { flex: 1; min-width: 150px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; }
.form .box i { font-style: normal; font-size: 12px; color: var(--text-2); }
.form .box b { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #111; }
.form .box s { text-decoration: none; margin-left: auto; font-size: 12px; color: var(--text-2); }

.bars { display: flex; align-items: flex-end; gap: 10px; height: 150px; margin-top: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; }
.bars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; }
.bars i { display: block; width: 100%; border-radius: 6px 6px 3px 3px; transform-origin: bottom; animation: rise .6s var(--ease) both; }
@keyframes rise { from { transform: scaleY(0); } }
.bars span { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.bars b { font-size: 11px; font-weight: 700; color: #111; border-radius: 4px; padding: 0 4px; }

.rail { display: flex; flex-direction: column; gap: 12px; }
.listing { border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.listing .art { width: 92px; aspect-ratio: 320/452; border-radius: 8px; overflow: hidden; margin: 0 auto 10px; position: relative; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.listing .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.listing .price { text-align: center; font-size: 19px; font-weight: 700; }
.listing .price s { text-decoration: none; display: block; font-size: 11px; color: var(--text-2); font-weight: 500; margin-top: 2px; }
.buy { display: block; width: 100%; margin-top: 10px; border: 0; border-radius: 10px; padding: 11px; background: var(--violet); color: #fff; font-weight: 650; font-size: 13px; cursor: pointer; }

/* ── everything below is Sofix's, injected by the extension ───────────── */
.sofix { position: relative; margin-top: 14px; border-radius: 14px; background: var(--panel); box-shadow: inset 0 0 0 1px rgba(92,197,141,.28), 0 10px 30px rgba(0,0,0,.45); overflow: hidden; }
.sofix::before { content: ""; position: absolute; inset: 0 0 auto auto; width: 360px; height: 200px; background: radial-gradient(60% 60% at 90% 0%, rgba(92,197,141,.16), transparent 70%); pointer-events: none; }
.sx-head { position: relative; display: flex; align-items: center; gap: 9px; padding: 13px 18px 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.sx-head i { width: 15px; height: 15px; border-radius: 5px; background: linear-gradient(135deg, var(--sofix-deep), var(--sofix)); }
.sx-head b { color: var(--text); letter-spacing: .04em; }
.sx-head s { text-decoration: none; margin-left: auto; font-size: 11px; color: var(--text-3); letter-spacing: 0; text-transform: none; }
.sx-body { position: relative; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 24px; padding: 6px 18px 16px; align-items: end; }
.sx-num { margin: 0; display: flex; align-items: baseline; gap: 10px; }
.sx-num b { font-size: 64px; line-height: .9; font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.sx-num i { font-style: normal; font-size: 14px; font-weight: 600; color: var(--text-2); }
.sx-sub { margin: 6px 0 0; font-size: 12px; color: var(--text-2); }
.sx-sub b { color: var(--text); font-weight: 650; }
.sx-range { position: relative; }
.sx-range h3 { margin: 0 0 6px; font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.sx-axis { position: relative; height: 46px; }
.sx-band { position: absolute; top: 12px; height: 22px; border-radius: 7px; background: linear-gradient(90deg, #303036, #45454e); transform-origin: left; animation: grow .7s var(--ease) both .15s; }
@keyframes grow { from { transform: scaleX(.02); opacity: .3; } }
.sx-us, .sx-them { position: absolute; top: 6px; width: 3px; height: 34px; border-radius: 2px; animation: appear .5s var(--ease) both .5s; }
.sx-us { background: var(--sofix); }
.sx-them { background: var(--gold); }
@keyframes appear { from { opacity: 0; } }
.sx-lbl { position: absolute; transform: translateX(-50%); font-size: 11px; font-weight: 650; white-space: nowrap; }
.sx-lbl.us { top: -8px; color: var(--sofix); }
.sx-lbl.them { top: 34px; color: var(--gold); }
.sx-scale { position: relative; height: 16px; border-top: 1px solid var(--line); }
.sx-scale span { position: absolute; top: 2px; transform: translateX(-50%); font-size: 10px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.sx-foot { position: relative; display: flex; gap: 8px; flex-wrap: wrap; padding: 0 18px 16px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; background: var(--panel-2); font-size: 12px; color: var(--text-2); }
.chip b { color: var(--text); font-weight: 650; }
.chip.own { background: rgba(92,197,141,.14); color: #a6e6c4; }
.chip.own b { color: #d6f6e5; }
.foil { display: inline-block; width: 11px; height: 15px; border-radius: 2px; background: var(--f-lim); }

/* the ribbon the extension puts on a card wherever one is drawn */
.rib { position: absolute; left: 5px; top: 5px; display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 7px; background: rgba(8,18,13,.88); box-shadow: inset 0 0 0 1px rgba(92,197,141,.5); font-size: 11px; font-weight: 750; color: #d6f6e5; }
.rib i { width: 8px; height: 8px; border-radius: 3px; background: linear-gradient(135deg, var(--sofix-deep), var(--sofix)); }

/* the drawer, on the edge of their page */
.tab { position: fixed; right: 0; top: 40%; z-index: 20; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 12px 0 0 12px; padding: 12px 14px; background: var(--panel); box-shadow: inset 0 0 0 1px rgba(92,197,141,.3), -6px 0 20px rgba(0,0,0,.5); color: var(--text); font-size: 12px; font-weight: 650; cursor: pointer; writing-mode: vertical-rl; }
.tab i { width: 12px; height: 12px; border-radius: 4px; background: linear-gradient(135deg, var(--sofix-deep), var(--sofix)); }
.drawer { position: fixed; right: 0; top: 0; bottom: 0; width: 340px; z-index: 21; background: var(--panel); box-shadow: -10px 0 40px rgba(0,0,0,.6); padding: 18px; display: flex; flex-direction: column; gap: 14px; transform: translateX(0); transition: transform .35s var(--ease); }
.drawer[hidden] { display: flex; transform: translateX(100%); }
.dr-head { display: flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.dr-head i { width: 15px; height: 15px; border-radius: 5px; background: linear-gradient(135deg, var(--sofix-deep), var(--sofix)); }
.dr-x { margin-left: auto; width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--panel-2); color: var(--text-2); cursor: pointer; }
.dr-num { margin: 0; display: flex; align-items: baseline; gap: 9px; }
.dr-num b { font-size: 46px; line-height: .9; font-weight: 700; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.dr-num i { font-style: normal; font-size: 13px; color: var(--text-2); font-weight: 600; }
.dr-line { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); padding: 10px 0; border-top: 1px solid var(--line); }
.dr-line b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
.dr-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.dr-cards span { aspect-ratio: 320/452; border-radius: 5px; overflow: hidden; background: #000; }
.dr-cards img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dr-go { margin-top: auto; border: 0; border-radius: 12px; padding: 13px; background: linear-gradient(135deg, var(--sofix-deep), var(--sofix)); color: var(--sofix-ink); font-weight: 700; font-size: 13px; cursor: pointer; }
.dr-note { font-size: 11px; color: var(--text-3); text-align: center; }

@media (max-width: 900px) {
  .cols { grid-template-columns: minmax(0,1fr); }
  .hero h1 { font-size: 36px; }
  .sx-body { grid-template-columns: minmax(0,1fr); gap: 14px; align-items: start; }
  .sx-num b { font-size: 52px; }
  .drawer { width: 100%; }
  .tab { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="page">
  <div class="bar"><span class="url">sorare.com/football/players/jan-oblak</span></div>
  <p class="crumbs"><span>Football</span><span>&rsaquo;</span><span>Players</span><span>&rsaquo;</span><span>Jan Oblak</span></p>
  <section class="hero" id="hero"></section>
  <nav class="tabs"><span class="on">Performance</span><span>Fixtures</span><span>History</span><span>Watchlists</span></nav>
  <div class="cols">
    <div>
      <div class="form" id="form"></div>
      <section class="sofix" id="sofix"></section>
      <div class="bars" id="bars"></div>
    </div>
    <aside class="rail" id="rail"></aside>
  </div>
</div>
<button class="tab" id="tab" type="button"><i></i>Sofix</button>
<aside class="drawer" id="drawer" hidden></aside>

<script>
const DATA = {"player":{"name":"Jan Oblak","slug":"jan-oblak","pos":"Goalkeeper","club":"Atlético Madrid","country":"Slovenia","age":33,"shirt":13},"sorare":{"last5":47,"last5Played":100,"last10":54,"last10Played":90,"last40":50,"last40Played":75,"newCard":55.99,"listing":46.5,"projection":53.0},"sofix":{"gw":17,"mu":53.0,"p":0.8857,"games":1,"history":[{"d":"2026-09-20","s":37.9,"played":true},{"d":"2026-09-16","s":63.2,"played":true},{"d":"2026-09-13","s":71.8,"played":true},{"d":"2026-09-09","s":37.3,"played":true},{"d":"2026-09-05","s":22.3,"played":true}],"value":43.97,"card":{"slug":"jan-oblak-2023-limited-344","rarity":"limited","level":7,"inSeason":false,"average":54.0,"pic":"https://assets.sorare.com/card/c0af94c9-927b-422e-ac4e-a051f16e72ae/picture/tinified-4e59e1794fe68061a586ff8ba74fd171.png"},"plan":{"lineups":1,"comp":"All Star","x":417,"pReturn":0.16,"essence":55,"cards":9,"of":87}},"lineup":["https://assets.sorare.com/card/e7524f8c-2531-4b10-9172-5a99cf7eec61/picture/tinified-dff1d4ffb9118c35d267983bcc51a3a0.png","https://assets.sorare.com/card/9f848b74-dbf2-48e4-8393-45450eee2ea6/picture/tinified-2d1f65cc66df9a3004dc9e814ee98b63.png","https://assets.sorare.com/card/b2c18133-4d2d-42e6-9d46-a5d6735ae19b/picture/tinified-2268e120f7432aecc7f31b593f330d5b.png","https://assets.sorare.com/card/5f62a121-98a4-4823-8803-7a905903e73c/picture/tinified-6bfab4a46d903378e2dadee57667d30b.png","https://assets.sorare.com/card/9f863723-5ec6-491d-b2eb-4b0a988f982d/picture/tinified-32581cc2349c960d8b4a97717ce7714c.png"]};
const $ = (s) => document.querySelector(s);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SD = 17.6;

function z(p) {
  const a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.3577518672690, -30.66479806614716, 2.506628277459239];
  const b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572];
  let q = p - 0.5, r = q * q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q / (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
const clamp = (v) => Math.max(0, Math.min(100, v));
const pct = (v) => clamp(v) + "%";

function countTo(el, target) {
  if (!el) return;
  if (reduced) { el.textContent = Math.round(target); return; }
  const start = performance.now();
  const step = (t) => {
    const k = Math.min(1, (t - start) / 700);
    el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// Sorare's own score colours: red at the bottom, green at the top.
function tone(score) {
  if (score >= 70) return "#3ec98a";
  if (score >= 55) return "#a8d24a";
  if (score >= 40) return "#f2c14e";
  if (score >= 25) return "#f08b4a";
  return "#e2574c";
}

const P = DATA.player, S = DATA.sorare, X = DATA.sofix;
const x = X.p * X.mu;
const bad = clamp(X.mu + z(0.25) * SD);
const good = clamp(X.mu + z(0.75) * SD);
const form = X.history.slice().reverse();

$("#hero").innerHTML =
  '<h1>' + P.name + '</h1>' +
  '<div class="facts">' +
    '<span><b>' + P.pos + '</b>position</span>' +
    '<span><b>' + P.club + '</b>club</span>' +
    '<span><b>' + P.country + '</b>country</span>' +
    '<span><b>' + P.age + '</b>years old</span>' +
    '<span><b>#' + P.shirt + '</b>shirt</span>' +
  '</div>';

$("#form").innerHTML = [["Last 5", S.last5, S.last5Played], ["Last 10", S.last10, S.last10Played], ["Last 40", S.last40, S.last40Played]]
  .map(function (row) {
    return '<div class="box"><b style="background:' + tone(row[1]) + '">' + row[1] + '</b><i>' + row[0] + '</i><s>' + row[2] + '% played</s></div>';
  }).join("");

$("#bars").innerHTML = form.map(function (h, i) {
  return '<div>' +
    '<b style="background:' + tone(h.s) + '">' + Math.round(h.s) + '</b>' +
    '<i style="height:' + Math.max(6, h.s) + '%; background:' + tone(h.s) + '; animation-delay:' + (i * 70) + 'ms"></i>' +
    '<span>' + h.d.slice(8) + '/' + h.d.slice(5, 7) + '</span>' +
  '</div>';
}).join("");

$("#rail").innerHTML =
  '<div class="listing">' +
    '<div class="art"><img src="' + X.card.pic + '" alt="" referrerpolicy="no-referrer">' +
      '<span class="rib"><i></i>' + Math.round(x) + '</span></div>' +
    '<p class="price">\u20ac' + S.listing.toFixed(2) + '<s>lowest listing \u00b7 \u20ac' + S.newCard.toFixed(2) + ' new</s></p>' +
    '<button class="buy" type="button">Buy now</button>' +
  '</div>';

$("#sofix").innerHTML =
  '<div class="sx-head"><i></i><b>Sofix</b> \u00b7 gameweek ' + X.gw + '<s>from your own app</s></div>' +
  '<div class="sx-body">' +
    '<div>' +
      '<p class="sx-num"><b id="sx-hero">0</b><i>xScore</i></p>' +
      '<p class="sx-sub"><b>' + Math.round(X.p * 100) + '%</b> plays \u00b7 <b>' + Math.round(X.mu) + '</b> if he does</p>' +
    '</div>' +
    '<div class="sx-range">' +
      '<h3>Score when he plays</h3>' +
      '<div class="sx-axis">' +
        '<span class="sx-band" style="left:' + pct(bad) + '; width:' + pct(good - bad) + '"></span>' +
        (Math.abs(X.mu - S.projection) < 2
          ? '<span class="sx-us" style="left:' + pct(X.mu) + '"></span>' +
            '<span class="sx-lbl us" style="left:' + pct(X.mu) + '">both say ' + Math.round(X.mu) + '</span>'
          : '<span class="sx-us" style="left:' + pct(X.mu) + '"></span>' +
            '<span class="sx-lbl us" style="left:' + pct(X.mu) + '">us ' + Math.round(X.mu) + '</span>' +
            '<span class="sx-them" style="left:' + pct(S.projection) + '"></span>' +
            '<span class="sx-lbl them" style="left:' + pct(S.projection) + '">Sorare ' + Math.round(S.projection) + '</span>') +
      '</div>' +
      '<div class="sx-scale">' + [0, 25, 50, 75, 100].map(function (v) { return '<span style="left:' + v + '%">' + v + '</span>'; }).join("") + '</div>' +
    '</div>' +
  '</div>' +
  '<div class="sx-foot">' +
    '<span class="chip own"><span class="foil"></span> You own <b>1</b> \u00b7 L' + X.card.level + ' ' + (X.card.inSeason ? "in season" : "2023") + '</span>' +
    '<span class="chip">Sofix values him at <b>\u20ac' + X.value.toFixed(2) + '</b></span>' +
    '<span class="chip">Lowest listing <b>\u20ac' + S.listing.toFixed(2) + '</b></span>' +
    '<span class="chip">Not in this week\u2019s plan</span>' +
  '</div>';

countTo($("#sx-hero"), x);

const plan = X.plan;
$("#drawer").innerHTML =
  '<div class="dr-head"><i></i>Your gameweek ' + X.gw +
    '<button class="dr-x" type="button" id="close" aria-label="Close">\u2715</button></div>' +
  '<p class="dr-num"><b>' + plan.x + '</b><i>xScore \u00b7 ' + plan.comp + '</i></p>' +
  '<div class="dr-cards">' + DATA.lineup.map(function (pic) {
    return '<span><img src="' + pic + '" alt="" referrerpolicy="no-referrer"></span>';
  }).join("") + '</div>' +
  '<div class="dr-line">Reward chance <b>' + Math.round(plan.pReturn * 100) + '%</b></div>' +
  '<div class="dr-line">Essence expected <b>\u2248' + plan.essence + '</b></div>' +
  '<div class="dr-line">Cards used <b>' + plan.cards + ' of ' + plan.of + '</b></div>' +
  '<button class="dr-go" type="button">Open Apply in Sofix</button>' +
  '<p class="dr-note">Entering still takes three presses in the app.</p>';

const drawer = $("#drawer");
$("#tab").addEventListener("click", function () { drawer.hidden = false; });
$("#close").addEventListener("click", function () { drawer.hidden = true; });
</script>
</body>
</html>
