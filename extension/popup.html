<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sofix</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top" id="top">
    <div class="row1"><img src="icons/32.png" alt="" width="18" height="18">Sofix</div>
    <h1 id="title">Checking…</h1>
    <p id="lede"></p>
    <div class="chain" aria-hidden="true"><span>Sorare</span><i id="wire1"></i><span>Extension</span><i id="wire2"></i><span>App</span></div>
  </header>
  <section class="list">
    <div class="row">Scores on sorare.com<span class="end"><button class="sw" id="overlay" type="button" role="switch" aria-checked="true" aria-label="Scores on sorare.com"></button></span></div>
    <div class="row">Signed in as<span class="end"><b id="user">—</b></span></div>
    <div class="row">Sofix app<span class="end"><b id="app">—</b></span></div>
  </section>
  <footer class="foot"><button class="btn primary" id="go" type="button">Open Sofix</button></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
