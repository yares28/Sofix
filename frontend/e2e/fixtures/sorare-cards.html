<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorare cards, as the overlay meets them</title>
<style>
/* A stand-in for sorare.com: the same card pictures at every size the real site draws them, wrapped the way it
   wraps them (rounded, clipped), with a button of its own beside a card. Served to the overlay test only. */
:root {
  color-scheme: dark;
  /* Sorare's own score tokens; one is off by a digit so a test can tell the page's value from the extension's fallback. */
  --c-score-veryLow: #ff5a5a; --c-score-low: #ff7e34; --c-score-mediumLow: #f0ce1d;
  --c-score-medium: #b7ff1b; --c-score-mediumHigh: #25ed36; --c-score-high: #00f3eb;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: #0e0e0e; color: #fff; font: 14px/1.4 -apple-system, "Segoe UI", sans-serif; }
h1 { margin: 0 0 4px; font-size: 20px; }
h2 { margin: 24px 0 8px; font-size: 13px; font-weight: 650; color: #b6b6bf; letter-spacing: .04em; text-transform: uppercase; }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.card { position: relative; overflow: hidden; border-radius: 8px; background: #000; }
.card img, .card video { display: block; width: 100%; height: auto; aspect-ratio: 320 / 452; object-fit: cover; }
.lineup .card { width: 88px; }
.bench .card { width: 56px; }
.gallery .card { width: 163px; }
.hero .card { width: 240px; }
.mini { display: flex; align-items: center; gap: 8px; }
.mini img { width: 18px; height: 26px; border-radius: 50%; object-fit: cover; }
.face { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; }
.face img { width: 100%; height: 100%; display: block; object-fit: cover; }
.buy { display: block; margin-top: 8px; width: 163px; padding: 10px; border: 0; border-radius: 10px; background: #6a48e8; color: #fff; font-weight: 650; }
a.card { display: block; color: inherit; }
/* Chips of Sorare's own, where the real site draws them: a badge inside the card's left edge, and on the compose card a
   percentage and a captain control hanging off the right. Ours must start below the one and clear of the others. */
.theirs, .gold { position: absolute; z-index: 2; height: 18px; padding: 2px 4px; font: 400 14px/14px -apple-system, "Segoe UI", sans-serif; }
.theirs { left: 0; top: 8px; background: #7029ff; color: #fff; border-radius: 4px 4px 0; }
/* A chip lower down the edge, between where the tile's top and bottom would be looked at. */
.theirs.mid { top: 24px; }
.gold { top: 8px; right: -6px; background: #f7c948; color: #0e0e0e; border-radius: 4px 4px 0; }
.frame { position: relative; width: 180px; }
.frame .card { width: 180px; }
.cap { position: absolute; z-index: 2; top: 32px; right: -6px; width: 24px; height: 24px; border: 0; border-radius: 6px; background: #3fb950; color: #0e0e0e; font-weight: 700; }
/* Sorare's own win / draw / loss bar under a compose card, and its kickoff line below that. */
.wdl { display: flex; align-items: center; justify-content: space-around; height: 24px; margin-top: 6px; border-radius: 8px; background: #242424; font: 700 15px/15px -apple-system, "Segoe UI", sans-serif; }
.wdl span:nth-child(1) { color: #b6ff1a; } .wdl span:nth-child(2) { color: #b6b6b6; } .wdl span:nth-child(3) { color: #ff5a5a; }
.foot { margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: #1d1d20; color: #d8d8de; font-size: 12px; }
/* A footer that is pinned where the room under the bar would be: making room moves nothing, so no row may be drawn there. */
.pinned .foot { position: absolute; left: 0; right: 0; top: 288px; margin: 0; }
/* Sorare's real block under a card in a list: a form-and-score row, a flags row, and only then the win / draw / loss bar,
   about 75px below the picture, then a "best score chosen" line and the kickoff. */
.real, .real .card { width: 147px; }
.real .info > div { margin-top: 1px; }
.real .form { height: 38px; margin-top: 12px; padding: 10px; border-radius: 8px 8px 0 0; background: #242424; font-size: 12px; }
.real .flags { height: 25px; padding: 5px 10px; background: #2e2e2e; font-size: 12px; }
.real .pick { height: 22px; margin-top: 4px; padding: 4px 8px; border-radius: 6px; background: #1d1d20; font-size: 11px; }
/* A list's title as Sorare draws it: styled text in a div, not a heading element, and split across two nodes. */
.pickhead { margin: 24px 0 8px; font-size: 20px; font-weight: 700; }
.picks .card { width: 130px; }
.scroller { width: 200px; overflow-x: auto; display: flex; gap: 12px; }
.scroller .card { flex: none; width: 100px; }
</style>
</head>
<body>
<main>
  <h1>Sorare cards</h1>
  <h2>Lineup</h2>
  <div class="row lineup" id="lineup">
    <div class="card" id="slot-a"><img alt="Unai Simón - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000001/picture/tinified-aaa1.png?width=200"></div>
    <div class="card" id="slot-b"><img alt="Pau Cubarsí - rare" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000002/picture/tinified-aaa2.png?width=200"></div>
    <div class="card" id="slot-c"><img alt="Lionel Messi - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000003/picture/tinified-aaa3.png?width=200"></div>
  </div>

  <h2>Bench</h2>
  <div class="row bench" id="bench">
    <div class="card" id="thumb"><img alt="Unai Simón - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000001/picture/tinified-aaa1.png?width=80"></div>
  </div>

  <h2>Gallery</h2>
  <div class="row gallery" id="gallery">
    <div class="card" id="copy"><img alt="Unai Simón - super_rare" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000004/picture/tinified-aaa4.png?width=300"></div>
    <div class="card" id="badged"><span class="theirs" id="badge">1/1</span><img alt="Unai Simón - super_rare" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000004/picture/tinified-aaa4.png?width=300"></div>
    <div class="card" id="midchip"><span class="theirs mid" id="midbadge">#7</span><img alt="Unai Simón - super_rare" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000004/picture/tinified-aaa4.png?width=300"></div>
    <div class="card" id="doubtful"><img alt="Pau Cubarsí - rare" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000002/picture/tinified-aaa2.png?width=300"></div>
    <div class="card" id="stranger"><img alt="Someone Else - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000005/picture/tinified-aaa5.png?width=300"></div>
    <div class="card" id="abroad"><img alt="Lionel Messi - rare" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000007/picture/tinified-aaa7.png?width=300"></div>
    <div class="card" id="noxg"><img alt="Kai Havertz - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000008/picture/tinified-aaa8.png?width=300"></div>
    <div class="card" id="over"><img alt="Over - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-0000000000020/picture/tinified-p20.png?width=300"></div>
    <div class="card" id="old"><img alt="Old - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-0000000000021/picture/tinified-p21.png?width=300"></div>
    <a class="card" id="linked" href="/football/players/x/cards?sale=true&card=pedri-2026-limited-7"><img alt="Pedri - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000006/picture/tinified-aaa6.png?width=300"></a>
    <div>
      <div class="card" id="clip"><video id="clip-video" muted preload="none" poster="https://assets.sorare.com/card/11111111-aaaa-4aaa-8aaa-000000000001/picture/tinified-aaa1.png"><source src="https://assets.sorare.com/card/11111111-aaaa-4aaa-8aaa-000000000001/video/low_res-vid1.webm"></video></div>
      <button class="buy" id="buy" type="button">Buy now</button>
    </div>
  </div>

  <h2>Compose</h2>
  <div class="row" id="compose">
    <div class="frame" id="frame">
      <div class="card" id="composecard"><img alt="Unai Simón - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000001/picture/tinified-aaa1.png?width=300"></div>
      <span class="gold" id="gold">60%</span>
      <button class="cap" id="cap" type="button" aria-label="Captain">C</button>
      <div class="wdl" id="wdl"><span>46%</span><span>27%</span><span>27%</span></div>
      <div class="foot" id="foot">Sat 10 Oct · 16:15</div>
    </div>
    <div class="frame pinned" id="frame2">
      <div class="card" id="pinnedcard"><img alt="Pau Cubarsí - rare" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000002/picture/tinified-aaa2.png?width=300"></div>
      <div class="wdl" id="wdl2"><span>38%</span><span>30%</span><span>32%</span></div>
      <div class="foot" id="foot2">Sat 10 Oct · 18:30</div>
    </div>
    <div class="frame real" id="frame3">
      <div class="card" id="realcard"><img alt="Unai Simón - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000001/picture/tinified-aaa1.png?width=300"></div>
      <div class="info">
        <div class="form" id="form3">form · 50</div>
        <div class="flags" id="flags3"><span>POL</span> <span>SWE</span></div>
        <div class="wdl" id="wdl3"><span>58%</span><span>24%</span><span>18%</span></div>
        <div class="pick" id="pick3">Best score chosen</div>
        <div class="foot" id="foot3">Fri 20:45</div>
      </div>
    </div>
  </div>

  <h2>A list that scrolls</h2>
  <div class="scroller" id="scroller" tabindex="0" role="region" aria-label="Scrolling cards">
    <div class="card" id="scrolled"><img alt="Pau Cubarsí - rare" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000002/picture/tinified-aaa2.png?width=200"></div>
    <div class="card"><img alt="Someone Else - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000005/picture/tinified-aaa5.png?width=200"></div>
  </div>

  <h2>Player page</h2>
  <div class="row hero" id="hero">
    <div class="card" id="big"><img alt="Unai Simón - limited" src="https://assets.sorare.com/card/11111111-aaaa-4aaa-8aaa-000000000001/picture/tinified-aaa1.png"></div>
    <div>
      <div class="mini" id="mini"><img alt="Unai Simón" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000001/picture/avatar-aaa1.png?width=40"><span>Unai Simón</span></div>
      <div class="face" id="face"><img alt="Unai Simón - face" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-000000000001/picture/tinified-aaa1.png?width=80"></div>
    </div>
  </div>
  <div class="pickhead" id="pickhead"><span>Select your</span> <b>Defender</b></div>
  <div class="row picks" id="picks">
    <div class="card" id="pick-1"><img alt="Pick 1 - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-0000000000011/picture/tinified-p11.png?width=300"></div>
    <div class="card" id="pick-2"><img alt="Pick 2 - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-0000000000012/picture/tinified-p12.png?width=300"></div>
    <div class="card" id="pick-3"><img alt="Pick 3 - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-0000000000013/picture/tinified-p13.png?width=300"></div>
    <div class="card" id="pick-4"><img alt="Pick 4 - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-0000000000014/picture/tinified-p14.png?width=300"></div>
    <div class="card" id="pick-5"><img alt="Pick 5 - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-0000000000015/picture/tinified-p15.png?width=300"></div>
    <div class="card" id="pick-6"><img alt="Pick 6 - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-0000000000016/picture/tinified-p16.png?width=300"></div>
  </div>
  <h2 id="pickhead2">Select your Forward</h2>
  <div class="row picks" id="picks2">
    <div class="card" id="fwd-1"><img alt="Fwd 1 - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-0000000000031/picture/tinified-p31.png?width=300"></div>
    <div class="card" id="fwd-2"><img alt="Fwd 2 - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-0000000000032/picture/tinified-p32.png?width=300"></div>
    <div class="card" id="fwd-3"><img alt="Fwd 3 - limited" src="https://assets.sorare.com/image-resize/card/11111111-aaaa-4aaa-8aaa-0000000000033/picture/tinified-p33.png?width=300"></div>
  </div>
</main>
<script>
// What the real page does: draws first, learns which card is which from its own GraphQL answers a moment later.
// Which card a click reached: what Sorare does to select a card for a lineup.
document.addEventListener("click", function (event) {
  var card = event.target.closest && event.target.closest(".card");
  if (card) window.__picked = card.id;
});
window.rerender = function () {
  // A list that re-renders hands every card a brand new element.
  document.querySelectorAll("#lineup .card, #gallery > .card").forEach(function (node) {
    var old = node.querySelector("img");
    var fresh = node.cloneNode(false);
    var img = document.createElement("img");
    img.alt = old.alt;
    img.src = old.src;
    fresh.append(img);
    node.replaceWith(fresh);
  });
};
window.swapCard = function (id, uuid, alt) {
  // A list that is re-used for another card: the same element, a different picture.
  var img = document.querySelector("#" + id + " img");
  img.alt = alt;
  img.src = "https://assets.sorare.com/image-resize/card/" + uuid + "/picture/tinified-swap.png?width=200";
};
setTimeout(function () {
  fetch("https://api.sorare.com/graphql", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ operationName: "LineupQuery", query: "query LineupQuery { cards { slug } }" }),
  }).then(function (r) { return r.json(); }).then(function (body) { window.__answer = body; document.body.dataset.answered = "yes"; });
}, 250);
</script>
</body>
</html>
