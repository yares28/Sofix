<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sofix Home</title>
<style>
:root {
  --bg: #fbfbfd; --surface: #ffffff; --ink: #1d1d1f; --ink-2: #6e6e73; --ink-3: #86868b; --ink-seg: #5e5e63;
  --line: #e8e8ed; --hover: #f5f5f7; --track: #ececf0; --accent: #0071e3;
  --good: #1f7a4f; --good-2: #5cc58d; --good-track: #d3f2e1; --low: #aeaeb2; --low-track: #f1f1f4;
  --amber: #ff9f0a;
  --f-lim: linear-gradient(145deg, #fff3c4 0%, #f7c948 38%, #d99a0b 62%, #ffe08a 100%);
  --f-rare: linear-gradient(145deg, #ffd6cf 0%, #f0594c 40%, #b3261e 66%, #ff9e94 100%);
  /* the board's own difficulty colours (frontend/app/globals.css) */
  --fdr1: #1f7a4f; --fdr2: #d3f2e1; --fdr3: #f1f1f4; --fdr4: #ffdcd8; --fdr5: #c4312a;
  --fdr2-edge: #a8dfc0; --fdr3-edge: #e2e2e7; --fdr4-edge: #e8998f;
  --win: #1a7a4e; --loss: #c4312a;
  --stripes: linear-gradient(90deg, #1f7a4f 0 20%, #5cc58d 20% 40%, #e3e3e8 40% 60%, #ff7b6e 60% 80%, #c4312a 80%);
  --shadow-card: 0 0 0 1px rgba(0,0,0,.04), 0 2px 4px rgba(0,0,0,.02), 0 12px 32px rgba(0,0,0,.05);
  --shadow-lift: 0 0 0 1px rgba(0,0,0,.04), 0 8px 18px rgba(0,0,0,.06), 0 24px 48px rgba(0,0,0,.08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.3,.7,.2,1);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.4 var(--font); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
img { display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: inherit; }

/* ---------- nav ---------- */
.nav { position: sticky; top: 0; z-index: 30; background: rgba(251,251,253,.8); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(0,0,0,.06); }
.nav-in { max-width: 1240px; margin: 0 auto; height: 52px; padding: 0 20px; display: flex; align-items: center; gap: 30px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: -0.02em; text-decoration: none; }
.brand i { width: 22px; height: 22px; border-radius: 7px; background: var(--stripes); box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
.links { display: flex; align-items: center; gap: 22px; }
.links a { color: var(--ink-2); text-decoration: none; font-size: 13px; font-weight: 500; transition: color .2s; }
.links a:hover { color: var(--ink); }
.links .sep { width: 1px; height: 14px; background: var(--line); }
.links .sor { display: inline-flex; align-items: center; gap: 6px; }
.pill { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 9px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.06); font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill small { color: var(--ink-2); font-weight: 500; font-size: 13px; }
.beat { width: 22px; height: 14px; color: var(--amber); }
.beat path { stroke-dasharray: 40; animation: beat 1.6s linear infinite; }
@keyframes beat { from { stroke-dashoffset: 40; } to { stroke-dashoffset: -40; } }

main { max-width: 1240px; margin: 0 auto; padding: 28px 20px 72px; }

/* ---------- page head: the gameweek and the one hero number (time to the lock) ---------- */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: -0.035em; }
.sub { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sub .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-3); }
.count { display: flex; align-items: flex-end; gap: 12px; text-align: right; }
.count .n { display: flex; align-items: baseline; gap: 6px; }
.count .n b { font-size: 56px; font-weight: 650; letter-spacing: -0.045em; line-height: .9; font-variant-numeric: tabular-nums; }
.count .n span { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
.count small { display: block; font-size: 12px; color: var(--ink-2); line-height: 1.35; white-space: nowrap; }
.count .ic { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; background: #eef5ff; color: var(--accent); margin-bottom: 2px; }
.count.played .ic { background: var(--hover); color: var(--ink-2); }

/* ---------- gameweek timeline (S0 component) ---------- */
.timeline { margin-top: 22px; display: flex; align-items: center; gap: 10px; }
.tl-arrow { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #fff; box-shadow: var(--shadow-card); cursor: pointer; display: grid; place-items: center; color: var(--ink); transition: transform .2s var(--ease); }
.tl-arrow:hover:not(:disabled) { transform: scale(1.06); }
.tl-arrow:disabled { opacity: .35; cursor: default; }
.tl-arrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tl-track { position: relative; flex: 1; min-width: 0; display: flex; gap: 4px; padding: 5px; background: var(--track); border-radius: 18px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; }
.tl-track::-webkit-scrollbar { display: none; }
.tl-knob { position: absolute; top: 5px; bottom: 5px; left: 0; border-radius: 14px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.08); transition: transform .45s var(--ease), width .45s var(--ease); }
.tl-item { position: relative; z-index: 1; flex: 1 0 auto; min-width: 96px; border: 0; background: none; cursor: pointer; border-radius: 14px; padding: 8px 14px; text-align: left; scroll-snap-align: center; display: flex; flex-direction: column; gap: 2px; }
.tl-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tl-top { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 650; color: var(--ink-seg); }
.tl-item[aria-pressed="true"] .tl-top { color: var(--ink); }
.tl-date { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.tl-dot.done { background: var(--ink-3); }
.tl-dot.next { background: var(--accent); }
.tl-dot.later { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.tl-break { flex: 1.3 0 auto; min-width: 150px; border-radius: 14px; padding: 8px 14px; display: flex; flex-direction: column; gap: 2px; color: var(--ink-2); background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(0,0,0,.035) 6px 7px); }
.tl-break b { font-size: 14px; font-weight: 600; color: var(--ink-3); }
.tl-break span { font-size: 12px; }

/* ---------- bento ---------- */
.bento { margin-top: 18px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.tile { position: relative; min-width: 0; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-card); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; isolation: isolate; transition: transform .25s var(--ease), box-shadow .25s var(--ease); animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.tile:has(.t-link:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.t-head { display: flex; align-items: center; gap: 10px; }
.t-head h2 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.02em; }
.t-link { text-decoration: none; outline: none; }
.t-link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 2; } /* the whole tile opens its page */
.t-meta { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chev { margin-left: auto; flex: none; color: var(--ink-3); transition: transform .25s var(--ease), color .25s; }
.tile:hover .chev { transform: translateX(3px); color: var(--ink); }
.fixtures, .diff, .tbl { grid-column: span 4; min-height: 460px; }
.play { grid-column: span 6; }
.cards, .review { grid-column: span 3; }
.eyebrow { margin: 0; font-size: 11px; font-weight: 600; color: var(--ink-2); letter-spacing: .03em; text-transform: uppercase; }
.crest { width: 16px; height: 16px; object-fit: contain; flex: none; }
.crest.lg { width: 36px; height: 36px; }

/* hero rows inside tiles: name on the left, one 34 px number on the right */
.t-hero { display: flex; align-items: center; gap: 12px; min-width: 0; }
.t-hero .who { min-width: 0; }
.t-hero .who b { display: block; font-size: 17px; font-weight: 650; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-hero .who span { font-size: 12px; color: var(--ink-2); }
.t-hero .num { margin-left: auto; text-align: right; flex: none; }
.t-hero .num b { display: block; font-size: 34px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.t-hero .num span { font-size: 12px; color: var(--ink-2); }

/* Fixtures */
.fx-list { display: flex; flex-direction: column; flex: 1; }
.fx-day { font-size: 11px; font-weight: 600; color: var(--ink-2); letter-spacing: .03em; text-transform: uppercase; padding: 8px 0 3px; }
.fx-day:first-child { padding-top: 0; }
.fx { display: grid; grid-template-columns: 40px minmax(0, 1fr) 96px; align-items: center; gap: 8px; height: 31px; box-shadow: inset 0 -1px 0 var(--line); }
.fx:last-child { box-shadow: none; }
.fx .t { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.teams { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0; }
.teams i { font-style: normal; font-weight: 500; color: var(--ink-2); }
.teams .sc { font-variant-numeric: tabular-nums; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--hover); }
.teams .lost { color: var(--ink-2); font-weight: 500; }
.odds { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.bar3 { display: flex; gap: 2px; height: 5px; }
.bar3 i { border-radius: 3px; transform-origin: left; animation: grow .8s var(--ease) both; animation-delay: calc(var(--r, 0) * 30ms + 150ms); }
.bar3 .h { background: var(--fdr1); } .bar3 .d { background: #c7c7cc; } .bar3 .a { background: var(--accent); }
@keyframes grow { from { transform: scaleX(0); } }
.odds em { font-style: normal; font-size: 11px; color: var(--ink-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.odds em b { color: var(--ink); font-weight: 600; }
.odds .tag { font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--ink); padding: 1px 5px; border-radius: 5px; background: #fff1d6; }

/* Difficulty: every club's next five games as one mosaic, easiest run first */
.mosaic { display: grid; gap: 3px; flex: 1; align-content: start; }
.m-row { display: grid; grid-template-columns: 30px repeat(5, minmax(0, 1fr)) 28px; gap: 3px; align-items: center; height: 11px; animation: fade .45s var(--ease) both; animation-delay: calc(var(--r) * 16ms + 180ms); }
@keyframes fade { from { opacity: 0; transform: translateX(-4px); } }
.m-row.hd { height: 14px; animation: none; }
.m-row.hd span { font-size: 10px; color: var(--ink-3); font-weight: 600; text-align: center; }
.m-row .code { font-size: 9.5px; font-weight: 600; color: var(--ink-2); letter-spacing: .01em; }
.m-row .xp { font-size: 10px; font-weight: 500; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.m-row.top .code, .m-row.top .xp, .m-row.bottom .code, .m-row.bottom .xp { color: var(--ink); font-weight: 700; }
.m-row i { height: 100%; border-radius: 3px; }
.m-row i.f1 { background: var(--fdr1); }
.m-row i.f2 { background: var(--fdr2); box-shadow: inset 0 0 0 1px var(--fdr2-edge); }
.m-row i.f3 { background: var(--fdr3); box-shadow: inset 0 0 0 1px var(--fdr3-edge); }
.m-row i.f4 { background: var(--fdr4); box-shadow: inset 0 0 0 1px var(--fdr4-edge); }
.m-row i.f5 { background: var(--fdr5); }
.m-row i.pl { background: repeating-linear-gradient(135deg, #fff 0 3px, #ececf0 3px 4px); box-shadow: inset 0 0 0 1px #e2e2e7; }
.m-row i.none { background: transparent; }
.t-foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); padding-top: 12px; box-shadow: inset 0 1px 0 var(--line); }
.t-foot b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.t-foot .push { margin-left: auto; }

/* Table */
.race { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; }
.race i { transform-origin: left; animation: grow .9s var(--ease) both .2s; }
.race-key { display: flex; gap: 12px; font-size: 11px; color: var(--ink-2); margin-top: -6px; flex-wrap: wrap; }
.race-key span { display: inline-flex; align-items: center; gap: 5px; }
.race-key i { width: 7px; height: 7px; border-radius: 2px; }
.mini { list-style: none; margin: 0; padding: 0; }
.mini li { display: grid; grid-template-columns: 18px 16px minmax(0, 1fr) auto 30px; gap: 8px; align-items: center; height: 29px; font-size: 13px; box-shadow: inset 0 -1px 0 var(--line); }
.mini li:last-child { box-shadow: none; }
.mini .pos { font-size: 12px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.mini .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .pts { font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }
.form { display: flex; gap: 3px; }
.form i { width: 7px; height: 7px; border-radius: 50%; }
.form .W { background: var(--win); } .form .D { background: #aeaeb2; } .form .L { background: var(--loss); }
.sub-h { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--ink-2); letter-spacing: .03em; text-transform: uppercase; margin-bottom: -6px; }
.down li { grid-template-columns: 16px minmax(0, 1fr) 70px 36px; }
.down .m { height: 5px; border-radius: 3px; background: var(--low-track); overflow: hidden; }
.down .m i { display: block; height: 100%; border-radius: 3px; background: #6e6e73; transform-origin: left; animation: grow .9s var(--ease) both .3s; }
.down .pc { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }

/* ---------- Sorare tiles ---------- */
.sorare-sec { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; margin: 22px 4px -2px; }
.sorare-sec h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
.sorare-sec span { font-size: 13px; color: var(--ink-2); }
.foil { position: relative; flex: none; width: 16px; height: 22px; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.12); }
.foil.limited { background: var(--f-lim); } .foil.rare { background: var(--f-rare); }
.foil::after { content: ""; position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.75) 50%, transparent 60%); transform: translateX(-60%); transition: transform .9s var(--ease); }
.tile:hover .foil::after { transform: translateX(60%); }
.foil.stack { overflow: visible; } .foil.stack::before { content: ""; position: absolute; left: 4px; top: -3px; width: 100%; height: 100%; border-radius: inherit; background: inherit; opacity: .45; z-index: -1; }
.play::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(520px circle at 100% 0%, rgba(247,201,72,.20), transparent 62%), radial-gradient(380px circle at 0% 100%, rgba(0,113,227,.05), transparent 60%); }
.lock { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #eef5ff; color: #0058b0; white-space: nowrap; }
.lock::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.p-grid { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.15fr); gap: 22px; align-items: center; flex: 1; }
.ring { position: relative; width: 124px; height: 124px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--good-track); }
.ring .bar { stroke: var(--good); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease); }
.ring .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .val b { font-size: 40px; font-weight: 650; letter-spacing: -0.04em; line-height: 1; }
.ring .val b small { font-size: 18px; font-weight: 600; }
.ring .val .lbl { font-size: 11px; color: var(--ink-2); margin-top: 3px; white-space: nowrap; }
.p-stats { display: flex; flex-direction: column; gap: 10px; }
.p-stats .l1 { font-size: 13px; color: var(--ink-2); }
.p-stats .l1 b { color: var(--ink); font-weight: 650; }
.rewards { display: flex; flex-wrap: wrap; gap: 8px; }
.rw { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--hover); font-variant-numeric: tabular-nums; }
.rw small { font-weight: 500; color: var(--ink-2); }
.best { display: flex; flex-direction: column; gap: 10px; }
.best-top { display: flex; align-items: center; gap: 9px; }
.best-top .nm { font-size: 14px; font-weight: 650; }
.best-top .md { font-size: 12px; color: var(--ink-2); }
.best-top .pc { margin-left: auto; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: var(--good-track); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--good); transform-origin: left; animation: grow .9s var(--ease) both .25s; }
.mfan { position: relative; height: 104px; margin-top: 4px; }
.mfan .fc { position: absolute; left: 50%; bottom: 0; width: 58px; aspect-ratio: 5 / 8; margin-left: -29px; border-radius: 7px; transform-origin: 50% 120%; transform: translateX(calc(var(--k) * 34px)) rotate(calc(var(--k) * 6deg)) translateY(calc(var(--a) * 3px)); transition: transform .45s var(--ease); box-shadow: 0 8px 18px rgba(0,0,0,.18); background: #e9e9ee; }
.mfan .fc img { width: 100%; height: 100%; object-fit: cover; border-radius: 7px; }
.tile:hover .mfan .fc { transform: translateX(calc(var(--k) * 42px)) rotate(calc(var(--k) * 7deg)) translateY(calc(var(--a) * 4px - 6px)); }
.mfan .fc.cap { box-shadow: 0 0 0 2px #f7c948, 0 8px 18px rgba(0,0,0,.18); }

.c-hero { display: flex; align-items: baseline; gap: 8px; }
.c-hero b { font-size: 34px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.c-hero span { font-size: 13px; color: var(--ink-2); }
.rar { display: flex; gap: 16px; }
.rar span { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.posbars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: end; flex: 1 0 96px; }
.posbars > div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; height: 100%; }
.posbars .col { width: 100%; max-width: 30px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; transform-origin: bottom; animation: up .9s var(--ease) both .2s; }
@keyframes up { from { transform: scaleY(0); } }
.posbars .col i { display: block; border-radius: 5px; }
.posbars .col i.limited { background: var(--f-lim); }
.posbars .col i.rare { background: var(--f-rare); }
.posbars em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.posbars span { font-size: 10px; color: var(--ink-2); font-weight: 600; letter-spacing: .03em; }

.rv-rows { display: flex; flex-direction: column; gap: 12px; flex: 1; justify-content: center; }
.rv { position: relative; height: 16px; }
.rv .rail { position: absolute; left: 0; right: 0; top: 7px; height: 3px; border-radius: 2px; background: var(--hover); }
.rv .band { position: absolute; top: 6px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, #cfe9da, #5cc58d); }
.rv .x { position: absolute; top: 3px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--ink); }
.rv .act { position: absolute; top: 2px; width: 13px; height: 13px; margin-left: -6.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2.5px #fff, 0 1px 4px rgba(0,0,0,.25); }

    const target = sorare ? DATA.sorare.lock : first;
    const days = Math.floor((new Date(target) - NOW) / 86400000);
    const when = `${f(target, { weekday: 'short' })} ${f(target, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })}`;
    count.className = 'count';
    count.innerHTML = `<span class="ic"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 5.2V9l2.6 1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><div><div class="n"><b>${days}</b><span>days</span></div><small>${sorare ? 'to the Sorare lock' : 'to kickoff'}<br>${when}</small></div>`;
  }

  /* ---------- timeline ---------- */
  function timeline() {
    const track = $('#track');
    track.querySelectorAll('.tl-item, .tl-break').forEach((n) => n.remove());
    DATA.timeline.forEach((t, i) => {
      const prev = DATA.timeline[i - 1];
      if (prev && (new Date(t.from) - new Date(prev.to)) / 86400000 > 10) {
        const br = document.createElement('div');
        br.className = 'tl-break';
        const a = new Date(new Date(prev.to).getTime() + 86400000).toISOString(), b = new Date(new Date(t.from).getTime() - 86400000).toISOString();
        br.innerHTML = `<b>International break</b><span>${range(a, b)}</span>`;
        track.appendChild(br);
      }
      const b = document.createElement('button');
      const next = !t.done && DATA.timeline.filter((x) => !x.done)[0] === t;
      b.type = 'button'; b.className = 'tl-item'; b.dataset.gw = t.gw;
      b.setAttribute('aria-pressed', String(t.gw === state.gw));
      b.innerHTML = `<span class="tl-top"><span class="tl-dot ${t.done ? 'done' : next ? 'next' : 'later'}"></span>GW${t.gw}</span><span class="tl-date">${t.tbc ? dayMonth(t.from) + ' · TBC' : range(t.from, t.to)}</span>`;
      b.addEventListener('click', () => select(t.gw));
      track.appendChild(b);
    });
    placeKnob();
  }
  function placeKnob() {
    const item = $(`.tl-item[data-gw="${state.gw}"]`), knob = $('#knob');
    knob.style.width = `${item.offsetWidth}px`;
    knob.style.transform = `translateX(${item.offsetLeft - 5}px)`;
    item.scrollIntoView({ block: 'nearest', inline: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    const gws = DATA.timeline.map((t) => t.gw);
    $('#prev').disabled = state.gw === gws[0];
    $('#next').disabled = state.gw === gws[gws.length - 1];
  }
  function select(gw) {
    state.gw = gw;
    document.querySelectorAll('.tl-item').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.gw === gw)));
    placeKnob(); head(); bento();
  }
  $('#prev').addEventListener('click', () => { const g = DATA.timeline.map((t) => t.gw); const i = g.indexOf(state.gw); if (i > 0) select(g[i - 1]); });
  $('#next').addEventListener('click', () => { const g = DATA.timeline.map((t) => t.gw); const i = g.indexOf(state.gw); if (i < g.length - 1) select(g[i + 1]); });

  /* ---------- tiles ---------- */
  const tile = (cls, i, title, meta, body, id, extra = '') => `<section class="tile ${cls}" style="--i:${i}" aria-labelledby="${id}"><header class="t-head"><h2 id="${id}"><a class="t-link" href="#">${title}</a></h2>${meta ? `<span class="t-meta">${meta}</span>` : ''}${extra}${CHEV}</header>${body}</section>`;

  function fixturesTile(g) {
    let day = null, r = 0, html = '<div class="fx-list">';
    const played = g.fixtures.every((m) => m.status === 'finished');
    for (const m of g.fixtures) {
      const d = f(m.utc, { weekday: 'short', day: 'numeric', month: 'short' });
      if (d !== day) { html += `<div class="fx-day">${d}</div>`; day = d; }
      if (m.status === 'finished') {
        const [h, a] = m.score; const hw = h > a, aw = a > h;
        const shock = m.chance < 0.3;
        html += `<div class="fx"><span class="t">FT</span><span class="teams">${crest(m.home)}<span class="${aw ? 'lost' : ''}">${m.home}</span><span class="sc">${h}–${a}</span><span class="${hw ? 'lost' : ''}">${m.away}</span>${crest(m.away)}</span><span class="odds"><em>${shock ? '<span class="tag">shock</span> ' : ''}<b>${pct(m.chance)}</b></em></span></div>`;
      } else {
        const [ph, pd, pa] = m.p; const fav = ph >= pa ? [m.home, ph] : [m.away, pa];
        html += `<div class="fx" style="--r:${r++}"><span class="t">${m.time}</span><span class="teams">${crest(m.home)}${m.home}<i>v</i>${m.away}${crest(m.away)}</span><span class="odds"><span class="bar3" role="img" aria-label="${DATA.names[m.home]} win ${pct(ph)}, draw ${pct(pd)}, ${DATA.names[m.away]} win ${pct(pa)}"><i class="h" style="flex:${ph}"></i><i class="d" style="flex:${pd}"></i><i class="a" style="flex:${pa}"></i></span><em>${fav[0]} <b>${pct(fav[1])}</b></em></span></div>`;
      }
    }
    html += '</div>';
    return tile('fixtures', 0, 'Fixtures', played ? 'results' : `${g.fixtures.length} matches`, html, 't-fx');
  }

  function difficultyTile(g) {
    const rows = g.ladder, top = rows[0], bottom = rows[rows.length - 1];
    const cols = [0, 1, 2, 3, 4].map((k) => state.gw + k);
    let m = `<div class="mosaic" role="img" aria-label="Every club's next five games coloured by difficulty, easiest run first: ${top.name} ${top.xp} expected points, ${bottom.name} ${bottom.xp}">`;
    m += `<div class="m-row hd"><span></span>${cols.map((c) => `<span>${c}</span>`).join('')}<span></span></div>`;
    rows.forEach((row, i) => {
      const cls = i === 0 ? ' top' : i === rows.length - 1 ? ' bottom' : '';
      m += `<div class="m-row${cls}" style="--r:${i}"><span class="code">${row.code}</span>${row.cells.map((c) => !c ? '<i class="none"></i>' : c.r ? `<i class="pl" title="${c.opp} ${c.v} · played (${c.r})"></i>` : `<i class="f${c.b}" title="${c.opp} ${c.v}"></i>`).join('')}<span class="xp">${row.xp.toFixed(1)}</span></div>`;
    });
    m += '</div>';
    const hero = `<div class="t-hero">${crest(top.code, 'crest lg')}<div class="who"><b>${top.name}</b><span>easiest run</span></div><div class="num"><b data-to="${top.xp.toFixed(1)}">${top.xp.toFixed(1)}</b><span>expected points</span></div></div>`;
    const foot = `<div class="t-foot">Hardest ${crest(bottom.code)} ${bottom.name}<b class="push">${bottom.xp.toFixed(1)}</b></div>`;
    return tile('diff', 1, 'Difficulty', `GW${cols[0]}–GW${cols[4]}`, hero + m + foot, 't-diff');
  }

  function tableTile() {
    const P = DATA.predicted, S = DATA.standings;
    const title = Object.entries(P).map(([c, v]) => [c, parseFloat(v.first) || 0]).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const down = Object.entries(P).map(([c, v]) => [c, parseFloat(v.down) || 0]).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const [lead] = title;
    const tones = ['var(--good)', 'var(--good-2)', '#cfe9da'];
    const hero = `<div class="t-hero">${crest(lead[0], 'crest lg')}<div class="who"><b>${DATA.names[lead[0]]}</b><span>to win the league</span></div><div class="num"><b data-to="${lead[1]}">${lead[1]}</b><span>% chance</span></div></div>`;
    const race = `<div class="race" role="img" aria-label="Chance of winning the league: ${title.map(([c, v]) => `${DATA.names[c]} ${v}%`).join(', ')}">${title.map(([, v], i) => `<i style="flex:${v};background:${tones[i]}"></i>`).join('')}</div><div class="race-key">${title.map(([c, v], i) => `<span><i style="background:${tones[i]}"></i>${c} ${v}%</span>`).join('')}</div>`;
    const top = `<ol class="mini">${S.slice(0, 4).map((s) => `<li><span class="pos">${s.pos}</span>${crest(s.code)}<span class="nm">${s.name}</span><span class="form" aria-label="Last five: ${s.form}">${[...s.form].map((x) => `<i class="${x}"></i>`).join('')}</span><span class="pts">${s.pts}</span></li>`).join('')}</ol>`;
    const rel = `<div class="sub-h"><span>Relegation</span><span>chance</span></div><ol class="mini down">${down.map(([c, v]) => `<li>${crest(c)}<span class="nm">${DATA.names[c]}</span><span class="m"><i style="width:${v}%"></i></span><span class="pc">${v}%</span></li>`).join('')}</ol>`;
    return tile('tbl', 2, 'Table', 'after GW7', hero + race + top + rel, 't-tbl');
  }

  function ring(p, label) {
    const C = 2 * Math.PI * 50;
    return `<div class="ring" role="img" aria-label="${Math.round(p * 100)}% ${label}"><svg viewBox="0 0 116 116"><circle class="trk" cx="58" cy="58" r="50" fill="none" stroke-width="10"/><circle class="bar" cx="58" cy="58" r="50" fill="none" stroke-width="10" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C * (1 - p)}"/></svg><div class="val"><b><span data-to="${Math.round(p * 100)}">${Math.round(p * 100)}</span><small>%</small></b><span class="lbl">${label}</span></div></div>`;
  }

  function waiting(cls, i, title, meta, icon, line, id) {
    return tile(`${cls} wait`, i, title, meta, `<div class="ghost"><span class="shape ${icon}">${icon === 'card' ? '' : '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 3"/></svg>'}</span><p>${line}</p></div>`, id);
  }

  function playTile() {
    const s = DATA.sorare, b = s.best;
    if (state.phase === 's2') return waiting('play', 3, 'Play', 'Sorare', 'ring', '<b>Best lineups</b><br>Arrive with Optimize: the best competition, your lineups and your chance of a reward.', 't-play');
    if (state.gw !== 8) {
      const past = DATA.timeline.find((t) => t.gw === state.gw).done;
      return waiting('play', 3, 'Play', 'Sorare', 'ring', past ? '<b>Your results</b><br>This gameweek’s lineups and rewards come from the Sorare sync.' : '<b>Not open yet</b><br>Sorare publishes a gameweek’s competitions a few days before it starts.', 't-play');
    }
    const fan = b.cards.map((c, i) => `<span class="fc${c.captain ? ' cap' : ''}" style="--k:${i - 2};--a:${Math.abs(i - 2)};z-index:${5 - Math.abs(i - 2)}"><img src="${c.pic}" alt="${c.name}" referrerpolicy="no-referrer" loading="lazy"></span>`).join('');
    const days = Math.floor((new Date(s.lock) - NOW) / 86400000);
    const body = `<div class="p-grid">${ring(s.summary.pAny, 'reward chance')}
      <div class="p-stats"><span class="l1"><b>${s.summary.lineups}</b> lineups · <b>${s.summary.cardsUsed}</b> cards</span>
        <div class="rewards"><span class="rw">${ESS()}≈${s.summary.expEssence.toLocaleString('en-GB')} <small>essence</small></span><span class="rw">${CASH}≈$${Math.round(s.summary.expCash)}</span></div>
        <span class="l1">expected this gameweek</span></div>
      <div class="best"><div class="best-top"><span class="foil limited stack" aria-hidden="true"></span><span><span class="nm">${b.mode} · ${b.name}</span><br><span class="md">best play · ${b.x} xScore</span></span><span class="pc">${pct(b.p)}</span></div>
        <div class="meter" role="img" aria-label="${pct(b.p)} chance of a reward in ${b.mode} ${b.name}"><i style="width:${Math.round(b.p * 100)}%"></i></div>
        <div class="mfan" aria-hidden="true">${fan}</div></div></div>`;
    return tile('play', 3, 'Play', `Sorare GW${s.gw}`, body, 't-play', `<span class="lock">locks in ${days} d</span>`);
  }

  function cardsTile() {
    if (state.phase === 's2') return waiting('cards', 4, 'My cards', '', 'card', '<b>Your cards</b><br>Arrive with the Sorare sync.', 't-cards');
    const p = DATA.sorare.pool, pos = ['GK', 'DEF', 'MID', 'FWD'];
    const max = Math.max(...pos.map((k) => p.byPos.limited[k] + p.byPos.rare[k]));
    const bars = pos.map((k) => { const l = p.byPos.limited[k], r = p.byPos.rare[k];
      return `<div><em>${l + r}</em><span class="col" style="height:${((l + r) / max) * 100}%">${r ? `<i class="rare" style="flex:${r}"></i>` : ''}<i class="limited" style="flex:${l}"></i></span><span>${k}</span></div>`; }).join('');
    const sealed = p.excluded.filter((x) => x.why === 'sealed').length;
    const body = `<div class="c-hero"><b data-to="${p.size}">${p.size}</b><span>playable</span></div>
      <div class="rar"><span><span class="foil limited" aria-hidden="true"></span>${p.byRarity.limited}<span class="sr"> Limited</span></span><span><span class="foil rare" aria-hidden="true"></span>${p.byRarity.rare}<span class="sr"> Rare</span></span></div>
      <div class="posbars" role="img" aria-label="By position: ${pos.map((k) => `${k} ${p.byPos.limited[k] + p.byPos.rare[k]}`).join(', ')}">${bars}</div>
      <div class="t-foot">${sealed} sealed · no Rare goalkeeper</div>`;
    return tile('cards', 4, 'My cards', 'yares', body, 't-cards');
  }

  function reviewTile() {
    if (state.phase === 's2') return waiting('review', 5, 'Predicted vs actual', '', 'ring', '<b>How close we were</b><br>Starts after your first gameweek with Sofix lineups.', 't-rev');
    const R = DATA.sorare.review;
    const inside = R.rows.filter((r) => r.actual >= r.lo && r.actual <= r.hi).length;
    const ours = R.rows.reduce((s, r) => s + Math.abs(r.x - r.actual), 0) / R.rows.length;
    const theirs = R.rows.reduce((s, r) => s + Math.abs(r.sorare - r.actual), 0) / R.rows.length;
    const rows = R.rows.map((r) => {
      const lo = Math.min(r.lo, r.actual, r.sorare) - 20, hi = Math.max(r.hi, r.actual, r.sorare) + 20, at = (v) => ((v - lo) / (hi - lo)) * 100;
      return `<div class="rv" role="img" aria-label="Predicted ${r.x} (range ${r.lo} to ${r.hi}), scored ${Math.round(r.actual)}, Sorare projected ${r.sorare}"><span class="rail"></span><span class="band" style="left:${at(r.lo)}%;width:${at(r.hi) - at(r.lo)}%"></span><span class="so" style="left:${at(r.sorare)}%"></span><span class="x" style="left:${at(r.x)}%"></span><span class="act" style="left:${at(r.actual)}%"></span></div>`;
    }).join('');
    const body = `<div class="c-hero"><b>${inside}<span style="font-size:22px;color:var(--ink-2)"> of ${R.rows.length}</span></b><span>inside our range</span></div>
      <div class="rv-rows">${rows}</div>
      <div class="rv-key"><span><i style="box-shadow:inset 0 0 0 2px var(--ink)"></i>ours</span><span><i style="background:var(--accent)"></i>scored</span><span><i style="width:2px;border-radius:1px;background:#d99a0b"></i>Sorare</span></div>
      <div class="t-foot">Average miss<span class="push">ours <b>${Math.round(ours)}</b> · Sorare <b>${Math.round(theirs)}</b></span></div>`;
    return tile('review', 5, 'Predicted vs actual', `GW${R.gw}`, body, 't-rev');
  }

  function bento() {
    const g = DATA.gws[state.gw];
    $('#bento').innerHTML = fixturesTile(g) + difficultyTile(g) + tableTile() +
      `<div class="sorare-sec"><h2><span class="foil limited stack" aria-hidden="true"></span>Sorare</h2><span>your lineups, cards and results</span></div>` +
      playTile() + cardsTile() + reviewTile();
    requestAnimationFrame(() => {
      document.querySelectorAll('.ring .bar').forEach((c) => { c.style.strokeDashoffset = c.dataset.off; });
      document.querySelectorAll('[data-to]').forEach(countUp);
    });
    document.querySelectorAll('.sorare-only').forEach((n) => { n.hidden = state.phase === 's2'; });
  }

  document.querySelectorAll('.preview-bar button').forEach((b) => b.addEventListener('click', () => {
    state.phase = b.dataset.phase;
    document.querySelectorAll('.preview-bar button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    head(); bento();
  }));
  addEventListener('resize', placeKnob);

  $('#note').innerHTML = `<p>Design preview S2 · Home. Real data: the board as published to Neon on 21 Sep (fixtures, forecasts, difficulty colours, expected points), the standings and the predicted table exactly as the live app shows them, crests from football-data.org, card art from Sorare.</p>
    <p>“All phases” shows the Sorare tiles filled: My cards from the Sorare API (21 Sep); Play and Predicted vs actual from the S0 prototype (a rough model: its xScore missed by more than Sorare’s own projection, which is why S4 exists). In the build they wait, and say what fills them, until S3, S6 and S8 land.</p>`;

  timeline(); head(); bento();
})();
</script>
</body>
</html>
