<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="design-check" content="no-images: the week menu is dates and counts; the page behind it carries the art">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The week</title>
<style>
:root {
  --bg: #fbfbfd; --surface: #ffffff; --ink: #1d1d1f; --ink-2: #6e6e73; --ink-3: #86868b; --ink-seg: #5e5e63;
  --line: #e8e8ed; --hover: #f5f5f7; --track: #ececf0; --accent: #0071e3;
  --good: #1f7a4f; --good-2: #5cc58d; --good-track: #d3f2e1; --good-ink: #11633b;
  --low: #aeaeb2; --low-track: #f1f1f4;
  --amber: #ff9f0a; --amber-bg: #fff4e0; --amber-ink: #8a5300;
  --f-lim: linear-gradient(145deg, #fff3c4 0%, #f7c948 38%, #d99a0b 62%, #ffe08a 100%);
  --brand: linear-gradient(135deg, #1f7a4f, #5cc58d);
  --shadow-card: 0 0 0 1px rgba(0,0,0,.04), 0 2px 4px rgba(0,0,0,.02), 0 12px 32px rgba(0,0,0,.05);
  --shadow-pop: 0 0 0 1px rgba(0,0,0,.05), 0 12px 24px rgba(0,0,0,.09), 0 36px 70px rgba(0,0,0,.14);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.3,.7,.2,1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.45 var(--font); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

/* ── the bar ───────────────────────────────────────────────────────────── */
.nav { position: sticky; top: 0; z-index: 40; background: rgba(251,251,253,.82); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(0,0,0,.06); }
.nav-in { max-width: 1120px; margin: 0 auto; height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 24px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
.brand i { width: 22px; height: 22px; border-radius: 7px; background: var(--brand); }
.tabs { display: flex; gap: 20px; }
.tabs a { color: var(--ink-2); text-decoration: none; font-size: 13px; font-weight: 550; }
.tabs a[aria-current] { color: var(--ink); }

/* the one control: which week the whole app is showing */
.pick { margin-left: auto; position: relative; }
.trigger {
  display: inline-flex; align-items: center; gap: 10px; border: 0; cursor: pointer; padding: 7px 12px 7px 11px;
  border-radius: 13px; background: var(--surface); box-shadow: var(--shadow-card); transition: transform .2s var(--ease);
}
.trigger:hover { transform: translateY(-1px); }
.trigger .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.trigger .dot.live { background: var(--good); animation: beat 2.4s var(--ease) infinite; }
.trigger b { font-size: 14px; font-weight: 650; letter-spacing: -0.02em; }
.trigger span { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.trigger svg { color: var(--ink-3); transition: transform .3s var(--ease); }
.pick.open .trigger svg { transform: rotate(180deg); }
@keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* ── the menu ──────────────────────────────────────────────────────────── */
.menu {
  position: absolute; right: 0; top: calc(100% + 10px); width: 460px; max-width: calc(100vw - 32px);
  background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-pop); padding: 8px; z-index: 50;
  transform-origin: top right; opacity: 0; transform: scale(.96) translateY(-6px); pointer-events: none;
  transition: opacity .22s var(--ease), transform .22s var(--ease);
}
.pick.open .menu { opacity: 1; transform: none; pointer-events: auto; }
.menu .hd { display: flex; align-items: baseline; padding: 8px 12px 10px; font-size: 11px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
.menu .hd span { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
.week {
  width: 100%; display: grid; grid-template-columns: 14px 64px minmax(0,1fr) auto; align-items: center; gap: 12px;
  border: 0; background: none; cursor: pointer; text-align: left; padding: 10px 12px; border-radius: 15px;
  opacity: 0; transform: translateY(5px); animation: rise .35s var(--ease) forwards;
}
.pick.open .week { animation-delay: calc(var(--i) * 28ms + 60ms); }
@keyframes rise { to { opacity: 1; transform: none; } }
.week:hover { background: var(--hover); }
.week[aria-checked="true"] { background: var(--ink); }
.week[aria-checked="true"] .n, .week[aria-checked="true"] .val b { color: #fff; }
.week[aria-checked="true"] .d, .week[aria-checked="true"] .val span, .week[aria-checked="true"] .tag:not(.foil) { color: rgba(255,255,255,.72); }
.week[aria-checked="true"] .tag:not(.foil) { background: rgba(255,255,255,.14); }
.week[aria-checked="true"] .tag.foil { color: #4a3200; } /* the foil stays gold on the dark row */
.week s { text-decoration: none; width: 8px; height: 8px; border-radius: 50%; background: var(--low); justify-self: center; }
.week s.done { background: var(--low); }
.week s.live { background: var(--good); animation: beat 2.4s var(--ease) infinite; }
.week s.next { background: var(--accent); }
.week .n { font-size: 14px; font-weight: 650; letter-spacing: -0.02em; }
.week .d { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.week .mid { display: flex; align-items: center; gap: 7px; min-width: 0; }
.tag { font-size: 11px; font-weight: 650; padding: 3px 8px; border-radius: 999px; background: var(--hover); color: var(--ink-2); white-space: nowrap; }
.tag.none { color: var(--ink-2); }
.tag.foil { background: var(--f-lim); color: #4a3200; }
.val { text-align: right; display: flex; flex-direction: column; gap: 1px; }
.val b { font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
.val span { font-size: 11px; color: var(--ink-2); }

/* ── what changes behind it ────────────────────────────────────────────── */
.page { max-width: 1120px; margin: 0 auto; padding: 26px 20px 80px; }
.lead { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
.lead h1 { margin: 0; font-size: 52px; line-height: 1; font-weight: 700; letter-spacing: -0.04em; }
.lead p { margin: 0; font-size: 14px; color: var(--ink-2); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-card); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; min-height: 148px; }
.card .t { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.card .t em { font-style: normal; margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-2); }
.card .big { display: flex; align-items: baseline; gap: 8px; }
.card .big b { font-size: 34px; font-weight: 700; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.card .big i { font-style: normal; font-size: 13px; color: var(--ink-2); }
.card .sub { font-size: 12px; color: var(--ink-2); }
.card.empty { background: repeating-linear-gradient(135deg, #fafafc, #fafafc 8px, #f5f5f8 8px, #f5f5f8 16px); box-shadow: inset 0 0 0 1px var(--line); }
.card.empty .big b { color: var(--ink-3); }
.foil { width: 13px; height: 18px; border-radius: 2px; background: var(--f-lim); box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }

@media (max-width: 760px) {
  .tabs { display: none; }
  .nav-in { padding: 0 14px; }
  .menu { width: calc(100vw - 28px); right: -6px; }
  .grid { grid-template-columns: 1fr; }
  .lead h1 { font-size: 40px; }
  .page { padding: 20px 14px 60px; }
}
@media (prefers-reduced-motion: reduce) { *, .week { animation: none !important; transition: none !important; opacity: 1 !important; transform: none !important; } }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-in">
    <span class="brand"><i></i> Sofix</span>
    <div class="tabs">
      <a href="#" aria-current="page">Play</a><a href="#">Fixtures</a><a href="#">Difficulty</a><a href="#">Table</a>
    </div>
    <div class="pick open" id="pick">
      <button class="trigger" type="button" id="trigger" aria-expanded="true" aria-haspopup="menu">
        <span class="dot" id="tdot"></span>
        <b id="tnum">GW17</b>
        <span id="tdate">25–29 Sep</span>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="m2 4.5 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" aria-label="Week"></div>
    </div>
  </div>
</nav>

<main class="page">
  <div class="lead">
    <h1 id="h1">Gameweek 17</h1>
    <p id="lead-sub"></p>
  </div>
  <div class="grid" id="cards"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);

// Real: Sorare's weeks, the LaLiga round inside each, and how many of the owner's 87 playable cards have a game.
const WEEKS = [
  { gw: 13, from: "11 Sep", to: "15 Sep", state: "done", laliga: 5, cards: 0, won: 0 },
  { gw: 14, from: "15 Sep", to: "18 Sep", state: "done", laliga: 6, cards: 0, won: 0 },
  { gw: 15, from: "18 Sep", to: "22 Sep", state: "done", laliga: 7, cards: 87, won: 500 },
  { gw: 16, from: "22 Sep", to: "25 Sep", state: "live", laliga: null, cards: 0 },
  { gw: 17, from: "25 Sep", to: "29 Sep", state: "next", laliga: null, cards: 13, essence: 55, plans: 4 },
  { gw: 18, from: "29 Sep", to: "2 Oct", state: "later", laliga: null, cards: 3 },
  { gw: 19, from: "2 Oct", to: "6 Oct", state: "later", laliga: null, cards: 14 },
  { gw: 20, from: "6 Oct", to: "9 Oct", state: "later", laliga: null, cards: 3 },
];

let at = 4;

function value(w) {
  if (w.state === "done") return w.won ? [`${w.won}`, "essence won"] : ["—", "nothing entered"];
  if (w.state === "live") return ["live", "locked"];
  if (w.essence) return [`≈${w.essence}`, `${w.plans} plans`];
  return [String(w.cards), w.cards === 1 ? "card plays" : "cards play"];
}

function drawMenu() {
  $("#menu").innerHTML =
    `<div class="hd">Week<span>LaLiga · your cards</span></div>` +
    WEEKS.map((w, i) => {
      const [big, small] = value(w);
      const laliga = w.laliga ? `<span class="tag">MD${w.laliga}</span>` : `<span class="tag none">no LaLiga</span>`;
      const mine = w.cards ? `<span class="tag foil">${w.cards} cards</span>` : "";
      return `<button class="week" role="menuitemradio" data-i="${i}" style="--i:${i}" aria-checked="${i === at}">
        <s class="${w.state}"></s>
        <span><span class="n">GW${w.gw}</span></span>
        <span class="mid"><span class="d">${w.from}–${w.to}</span>${laliga}${mine}</span>
        <span class="val"><b>${big}</b><span>${small}</span></span>
      </button>`;
    }).join("");
  document.querySelectorAll(".week").forEach((b) => b.addEventListener("click", () => { at = Number(b.dataset.i); draw(); }));
}

function draw() {
  const w = WEEKS[at];
  $("#tnum").textContent = `GW${w.gw}`;
  $("#tdate").textContent = `${w.from}–${w.to}`;
  $("#tdot").className = `dot ${w.state === "live" ? "live" : ""}`;
  $("#h1").textContent = `Gameweek ${w.gw}`;
  $("#lead-sub").textContent = `${w.from}–${w.to} · ${w.laliga ? `LaLiga matchday ${w.laliga}` : "no LaLiga round this week"}`;

  const play = w.essence
    ? `<div class="card"><span class="t"><span class="foil"></span> Play<em>${w.plans} plans</em></span>
         <span class="big"><b>≈${w.essence}</b><i>essence</i></span>
         <span class="sub">${w.cards} of your cards play · 16% chance of a reward</span></div>`
    : w.state === "done"
      ? `<div class="card"><span class="t"><span class="foil"></span> Play<em>played</em></span>
           <span class="big"><b>${w.won ?? 0}</b><i>essence won</i></span>
           <span class="sub">${w.cards ? `${w.cards} cards entered` : "nothing entered"}</span></div>`
      : `<div class="card${w.cards ? "" : " empty"}"><span class="t"><span class="foil"></span> Play<em>${w.state === "live" ? "locked" : "ahead"}</em></span>
           <span class="big"><b>${w.cards}</b><i>${w.cards === 1 ? "card plays" : "cards play"}</i></span>
           <span class="sub">${w.cards ? "a plan from form until Sorare publishes" : "none of your cards play"}</span></div>`;

  const board = w.laliga
    ? `<div class="card"><span class="t">Fixtures<em>MD${w.laliga}</em></span><span class="big"><b>10</b><i>matches</i></span><span class="sub">difficulty, table and the grid all follow this week</span></div>
       <div class="card"><span class="t">Table<em>after MD${w.laliga}</em></span><span class="big"><b>20</b><i>clubs</i></span><span class="sub">projected from here to the end of the season</span></div>`
    : `<div class="card empty"><span class="t">Fixtures<em>—</em></span><span class="big"><b>0</b><i>matches</i></span><span class="sub">no LaLiga round falls in this week</span></div>
       <div class="card empty"><span class="t">Table<em>—</em></span><span class="big"><b>—</b><i></i></span><span class="sub">unchanged while LaLiga is away</span></div>`;

  $("#cards").innerHTML = play + board;
  drawMenu();
}

$("#trigger").addEventListener("click", () => {
  const open = $("#pick").classList.toggle("open");
  $("#trigger").setAttribute("aria-expanded", String(open));
});
draw();
</script>
</body>
</html>
