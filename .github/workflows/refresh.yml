name: Scheduled refresh

# Keeps fixtures, odds and predictions fresh without the PC being on, then publishes the board for the
# web app (read_models) and asks the app on Vercel to reload it. The app's Refresh button starts it too.
# Cron is UTC, so Madrid times shift by an hour between summer (CEST) and winter (CET).
on:
  # A push that changes what the job computes or publishes runs it at once, so production shows the new code's numbers
  # without anyone starting it by hand.
  push:
    branches: [main]
    paths: ["backend/app/**", "backend/artifacts/**"]
  schedule:
    - cron: "17 7 * * *" #   ~09:15 Madrid (summer) / 08:15 (winter): overnight results
    - cron: "7 12 * * *" #   14:07 Madrid (summer) / 13:07 (winter): two hours before Sorare's 14:00 UTC cutoff
    # Mondays, and Tue–Thu when Europe plays, the deadline is 17:30 or 19:00 Madrid instead of 16:00.
    # Summer times below; in winter each one lands an hour earlier and still before the lock.
    # Tuesday's 15:23 football-data run already covers the 17:30 deadline, so only 19:00 is added that day.
    - cron: "37 13 * * 1" #  Mon 15:37 Madrid: two hours before a 17:30 deadline
    - cron: "7 15 * * 1" #   Mon 17:07 Madrid: two hours before a 19:00 deadline
    - cron: "7 15 * * 2" #   Tue 17:07 Madrid: two hours before a 19:00 deadline
    - cron: "37 13 * * 3" #  Wed 15:37 Madrid: two hours before a 17:30 deadline
    - cron: "7 15 * * 3" #   Wed 17:07 Madrid: two hours before a 19:00 deadline
    - cron: "37 13 * * 4" #  Thu 15:37 Madrid: two hours before a 17:30 deadline
    - cron: "7 15 * * 4" #   Thu 17:07 Madrid: two hours before a 19:00 deadline
    - cron: "43 22 * * *" #  ~00:45 Madrid (summer) / 23:45 (winter): after the day's late games
    - cron: "23 13 * * 2" #  Tuesday after football-data.co.uk's ~13:00 UK update
    - cron: "23 17 * * 5" #  Friday after football-data.co.uk's ~17:00 UK update
  workflow_dispatch:
    inputs:
      trigger:
        description: Who started this run
        type: choice
        options: [cli, button, schedule] # `schedule` is for the near-lock workflow, which starts runs like the cron does
        default: cli

permissions:
  contents: read
  actions: read # the push gate below lists this workflow's recent runs

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  # A refresh reads ~28 MB from Neon, whose free plan sends 5 GB a month. 28 of 42 runs on 12-14 Oct 2026 came from pushes,
  # so a push refreshes only when no run started in the last 3 hours; the schedule and the app's button are unchanged.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A validated league-model release must replan owned cards as well as publishing its new player blocks.
          promoted=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" --jq '[.files[] | select(.filename | test("^backend/artifacts/league_xscore/(PL|BL1)[.]json$"))] | length')
          if [ "$promoted" != "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh api "repos/${{ github.repository }}/actions/workflows/refresh.yml/runs?created=>$since&per_page=20"             --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
          if [ "$recent" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::A refresh ran in the last 3 hours; this push waits for the next one."; echo "run=false" >> "$GITHUB_OUTPUT"; fi

  refresh:
    name: Refresh data
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # runs take ~8 min (14 Oct 2026, after the planner stopped re-simulating the same lineups)
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: prod
      # App role (DML only). The owner/migration URL is deliberately not a secret here:
      # migrations are applied by hand with `python -m app.migrate`, never unattended.
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_URL_SPARE: ${{ secrets.POSTGRES_URL_SPARE }} # the other free Neon project (app/jobs/neon_switch.py)
      # Cloudflare R2: page blocks for the web app, free to send (backend/app/services/r2.py); skipped when unset.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PLAYER_GAMES_MIRROR: .cache/player_games.sqlite # see "Restore the game history copy"
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }} # reads each project's data sent; without it the move never starts
      FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }} # optional; the odds step is skipped without it (and throttled to 6 h)
      # Sorare's public API (read-only). Without it the Sorare step is skipped.
      SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
      SORARE_USER: ${{ vars.SORARE_USER || 'yares' }}
      # After publishing, the job pings {APP_URL}/api/revalidate; skipped when these are missing.
      APP_URL: ${{ secrets.APP_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
      RUN_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger || 'cli' }}
    steps:
      - uses: actions/checkout@v4

      # setup-uv downloads Python 3.11 into a virtualenv and activates it: the runner has no system 3.11.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: backend/requirements.lock

      - name: Install locked dependencies
        run: uv pip sync requirements.lock

      # Two free Neon projects take turns: the one written last is live, and it moves at 4 GB sent.
      - name: Pick the live Neon project
        run: python -m app.jobs.neon_switch --move

      # A copy of the game history kept between runs (app/sorare/games_mirror.py): Neon sends only the players that changed.
      - name: Restore the game history copy
        uses: actions/cache/restore@v4
        with:
          path: backend/.cache/player_games.sqlite
          key: player-games-${{ github.run_id }}
          restore-keys: player-games-

      # football-data.co.uk CSVs: past seasons never change, the current one is re-checked with a conditional GET.
      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: backend/data/raw
          key: football-data-co-uk-${{ github.run_id }}
          restore-keys: football-data-co-uk-

      - name: Check secrets
        run: |
          test -n "$POSTGRES_URL" || { echo "::error::POSTGRES_URL secret is missing"; exit 1; }
          test -n "$FOOTBALL_DATA_ORG_TOKEN" || { echo "::error::FOOTBALL_DATA_ORG_TOKEN secret is missing"; exit 1; }

      # Exit 2 means a refresh (e.g. the button) is already running: not a failure.
      # Any other non-zero exit fails the job, and GitHub emails the owner.
      - name: Refresh
        run: |
          set +e
          case "$RUN_TRIGGER" in schedule|button|cli) ;; *) RUN_TRIGGER=cli ;; esac
          python -m app.jobs.refresh --trigger "$RUN_TRIGGER" --skip-migrations
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::notice::Another refresh was already running; skipped."
            exit 0
          fi
          exit "$code"

      - name: Keep the game history copy
        if: always() && hashFiles('backend/.cache/player_games.sqlite') != ''
        uses: actions/cache/save@v4
        with:
          path: backend/.cache/player_games.sqlite
          key: player-games-${{ github.run_id }}-${{ github.run_attempt }}

  # A new league must not stay empty until tonight because another refresh just ran.
  # This path only initializes missing blocks; subsequent pushes skip without source calls.
  # Workflow concurrency and the existing database refresh lock still allow one writer.
  fdr-bootstrap:
    name: Initialize missing league FDR
    needs: gate
    if: github.event_name == 'push' && needs.gate.outputs.run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: prod
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_URL_SPARE: ${{ secrets.POSTGRES_URL_SPARE }}
      FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: backend/requirements.lock
      - name: Install locked dependencies
        run: uv pip sync requirements.lock
      - name: Pick the live Neon project
        run: python -m app.jobs.neon_switch
      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: backend/data/raw
          key: football-data-co-uk-bootstrap-${{ github.run_id }}
          restore-keys: football-data-co-uk-
      - name: Initialize missing blocks under the refresh lock
        run: |
          set +e
          python -m app.jobs.league_fdr --bootstrap
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::notice::Another refresh is running; the next refresh will publish the leagues."
            exit 0
          fi
          exit "$code"
