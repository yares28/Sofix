name: Validate league xScore data

# Collection/evaluation only: no Neon settings, no model publication and no Sorare writes.
on:
  push:
    branches: [main]
    paths: ["backend/app/research/league_xscore_data.py", ".github/workflows/league-xscore.yml"]
  workflow_dispatch:
    inputs:
      league:
        description: League to collect without enabling a model
        type: choice
        options: [FL1, PL, BL1]
        default: FL1

permissions:
  contents: read

concurrency:
  group: league-xscore-validation
  cancel-in-progress: false

jobs:
  collect:
    name: Collect ${{ matrix.league }} authentic outcomes
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2 # at .75 s per reader, both together stay below 200 requests/minute
      matrix:
        league: ${{ fromJSON(format('["{0}"]', inputs.league || 'FL1')) }}
    defaults:
      run:
        working-directory: backend
    env:
      FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
      SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: backend/requirements.lock
      - run: uv pip sync requirements.lock
      - uses: actions/cache/restore@v4
        with:
          path: backend/data/raw/league-xscore/${{ matrix.league }}
          key: league-xscore-v1-${{ matrix.league }}-${{ github.run_id }}
          restore-keys: league-xscore-v1-${{ matrix.league }}-
      - name: Verify Ligue 1 current fixtures without publishing
        if: matrix.league == 'FL1'
        run: |
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from app.sources.football_data_org import FootballDataOrg
          payload = asyncio.run(FootballDataOrg().matches(competition="FL1"))
          matches = payload.get("matches") or []
          clubs = {m[s]["id"] for m in matches for s in ("homeTeam", "awayTeam")}
          assert payload["competition"]["code"] == "FL1" and len(clubs) == 18 and len(matches) == 306
          folder = Path("data/raw/league-xscore")
          folder.mkdir(parents=True, exist_ok=True)
          (folder / "FL1-fixtures.json").write_text(json.dumps(payload), encoding="utf-8")
          print("Ligue 1 configured fixture feed: 18 clubs, 306 fixtures")
          PY
      - name: Retain one representative source game before the full read
        run: |
          set +e
          python -m app.research.league_xscore_data --league ${{ matrix.league }} --limit 1
          code=$?
          # Exit 1 is the expected incomplete-cohort result for a one-game sample.
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: source-sample-${{ matrix.league }}
          path: backend/data/raw/league-xscore/${{ matrix.league }}/sample.json
          retention-days: 7
      - name: Collect null-preserving completed seasons
        run: python -m app.research.league_xscore_data --league ${{ matrix.league }} --use-index --seconds 2700
      - name: Verify complete current squads without publishing
        if: always()
        run: python -m app.sorare.foreign_coverage --league ${{ matrix.league }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-squads-${{ matrix.league }}
          path: backend/data/raw/league-xscore-current/${{ matrix.league }}.json
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: backend/data/raw/league-xscore/${{ matrix.league }}
          key: league-xscore-v1-${{ matrix.league }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: league-xscore-${{ matrix.league }}
          path: backend/data/raw/league-xscore/
          retention-days: 7
