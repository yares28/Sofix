name: Check player scores

# Kickoff +3h and +26h, accepted only once Sorare says played. Scheduler delays are visible as check timestamps.
# Reads only the owner's due games, batched by match; no football, odds or planner calls. Public repository minutes.
# Rewards: observe the last relevant finish, wait one hour, read public receipts/cutoffs, then check corrections a day later.
on:
  # Timed by the outside clock, not GitHub (whose timer runs hours late): "11,41 * * * *" UTC in clock/timetable.json.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: prod
      PLAYER_GAMES_MIRROR: .cache/player_games.sqlite
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_URL_SPARE: ${{ secrets.POSTGRES_URL_SPARE }} # the other free Neon project (app/jobs/neon_switch.py)
      # Cloudflare R2: page blocks for the web app, free to send (backend/app/services/r2.py); skipped when unset.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: backend/requirements.lock
      - name: Install locked dependencies
        run: uv pip sync requirements.lock

      # Two free Neon projects take turns: the one written last is live.
      - name: Pick the live Neon project
        run: python -m app.jobs.neon_switch

      - name: Restore the game history copy
        uses: actions/cache/restore@v4
        with:
          path: backend/.cache/player_games.sqlite
          key: player-games-${{ github.run_id }}
          restore-keys: player-games-

      - name: Read due scores and publish Audit
        run: python -m app.jobs.score_checks

      - name: Keep the game history copy
        if: always() && hashFiles('backend/.cache/player_games.sqlite') != ''
        uses: actions/cache/save@v4
        with:
          path: backend/.cache/player_games.sqlite
          key: player-games-${{ github.run_id }}-${{ github.run_attempt }}
