<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="design-check" content="record">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play · Sorare</title>
<style>
:root {
  --bg: #fbfbfd; --surface: #ffffff; --ink: #1d1d1f; --ink-2: #6e6e73; --ink-3: #86868b; --ink-seg: #5e5e63;
  --line: #e8e8ed; --hover: #f5f5f7; --track: #ececf0; --accent: #0071e3;
  --good: #1f7a4f; --good-2: #5cc58d; --good-track: #d3f2e1; --low: #aeaeb2; --low-track: #f1f1f4;
  --lim-1: #fff6d6; --lim-2: #f7c948; --lim-3: #d99a0b; --lim-4: #a86f00;
  --rare-1: #ffe3de; --rare-2: #f0594c; --rare-3: #c4312a; --rare-4: #8f1f19;
  --f-lim: linear-gradient(145deg, #fff3c4 0%, #f7c948 38%, #d99a0b 62%, #ffe08a 100%);
  --f-rare: linear-gradient(145deg, #ffd6cf 0%, #f0594c 40%, #b3261e 66%, #ff9e94 100%);
  --fdr1: #1f7a4f; --fdr2: #5cc58d; --fdr3: #c7c7cc; --fdr4: #ff7b6e; --fdr5: #c4312a;
  --r-xl: 28px; --r-lg: 22px; --r-md: 16px;
  --shadow-card: 0 0 0 1px rgba(0,0,0,.04), 0 2px 4px rgba(0,0,0,.02), 0 12px 32px rgba(0,0,0,.05);
  --shadow-lift: 0 0 0 1px rgba(0,0,0,.04), 0 8px 18px rgba(0,0,0,.06), 0 24px 48px rgba(0,0,0,.08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.3,.7,.2,1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.4 var(--font); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
img { display: block; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- nav ---------- */
.nav { position: sticky; top: 0; z-index: 30; background: rgba(251,251,253,.8); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(0,0,0,.06); }
.nav-in { max-width: 1240px; margin: 0 auto; height: 52px; padding: 0 20px; display: flex; align-items: center; gap: 28px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: -0.02em; }
.brand i { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #1f7a4f, #5cc58d); }
.nav a { color: var(--ink-2); text-decoration: none; font-size: 13px; font-weight: 500; }
.nav a[aria-current] { color: var(--ink); }
.nav .links { display: flex; gap: 22px; }
.nav .sync { margin-left: auto; font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.nav .sync::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #34c759; }

main { max-width: 1240px; margin: 0 auto; padding: 28px 20px 64px; }

/* ---------- page head ---------- */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: -0.035em; }
.head-sub { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; display: flex; align-items: center; gap: 8px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: #34c759; box-shadow: 0 0 0 0 rgba(52,199,89,.5); animation: pulse 1.8s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(52,199,89,0); } 100% { box-shadow: 0 0 0 0 rgba(52,199,89,0); } }

/* rarity switch: two foil cards */
.rarity { position: relative; display: inline-flex; padding: 4px; background: var(--track); border-radius: 16px; }
.rarity .knob { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.08); transition: transform .35s var(--ease), width .35s var(--ease); }
.rarity button { position: relative; z-index: 1; border: 0; background: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; border-radius: 12px; color: var(--ink-seg); font-weight: 600; font-size: 14px; }
.rarity button[aria-pressed="true"] { color: var(--ink); }
.rarity button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rarity small { font-weight: 500; color: var(--ink-seg); font-variant-numeric: tabular-nums; }
.foil { position: relative; flex: none; width: 16px; height: 22px; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.12); }
.foil.limited { background: var(--f-lim); }
.foil.rare { background: var(--f-rare); }
.foil::after { content: ""; position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.75) 50%, transparent 60%); transform: translateX(-60%); transition: transform .9s var(--ease); }
button:hover .foil::after, .comp:hover .foil::after, .hero:hover .foil::after { transform: translateX(60%); }
.foil.lg { width: 22px; height: 30px; border-radius: 5px; }
.foil.stack { overflow: visible; }
.foil.stack::before { content: ""; position: absolute; left: 4px; top: -3px; width: 100%; height: 100%; border-radius: inherit; background: inherit; opacity: .45; z-index: -1; }

/* ---------- gameweek timeline ---------- */
.timeline { margin-top: 22px; display: flex; align-items: center; gap: 10px; }
.tl-arrow { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #fff; box-shadow: var(--shadow-card); cursor: pointer; display: grid; place-items: center; color: var(--ink); transition: transform .2s var(--ease); }
.tl-arrow:hover { transform: scale(1.06); }
.tl-arrow:disabled { opacity: .35; cursor: default; transform: none; }
.tl-arrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tl-track { position: relative; flex: 1; min-width: 0; display: flex; gap: 4px; padding: 5px; background: var(--track); border-radius: 18px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; }
.tl-track::-webkit-scrollbar { display: none; }
.tl-knob { position: absolute; top: 5px; bottom: 5px; left: 0; border-radius: 14px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.08); transition: transform .45s var(--ease), width .45s var(--ease); }
.tl-item { position: relative; z-index: 1; flex: 1 0 auto; min-width: 104px; border: 0; background: none; cursor: pointer; border-radius: 14px; padding: 8px 14px; text-align: left; scroll-snap-align: center; display: flex; flex-direction: column; gap: 2px; }
.tl-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tl-top { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 650; color: var(--ink-seg); }
.tl-item[aria-pressed="true"] .tl-top { color: var(--ink); }
.tl-date { font-size: 12px; color: var(--ink-seg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-ess { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; font-weight: 600; color: var(--ink); }
.tl-ess.zero { color: var(--ink-seg); font-weight: 500; }
.tl-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.tl-dot.done { background: var(--ink-3); }
.tl-dot.live { background: #34c759; animation: pulse 1.8s infinite; }
.tl-dot.upcoming { background: var(--accent); }
.tl-break { flex: 1.4 0 auto; min-width: 150px; border-radius: 14px; padding: 8px 14px; display: flex; flex-direction: column; gap: 2px; color: var(--ink-2); background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(0,0,0,.035) 6px 7px); }
.tl-break b { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.tl-break span { font-size: 12px; }

/* ---------- hero ---------- */
.hero { position: relative; margin-top: 22px; border-radius: var(--r-xl); background: var(--surface); box-shadow: var(--shadow-card); padding: 30px 32px; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) minmax(0, 1.25fr); gap: 32px; overflow: hidden; isolation: isolate; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(640px circle at 100% 0%, var(--glow, rgba(247,201,72,.20)), transparent 62%), radial-gradient(420px circle at 0% 100%, rgba(0,113,227,.05), transparent 60%); }
.hero[data-rarity="rare"] { --glow: rgba(240,89,76,.16); }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; text-transform: uppercase; }
.hero-id { display: flex; flex-direction: column; gap: 18px; }
.hero-name { display: flex; align-items: center; gap: 12px; }
.hero-name h2 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.03em; }
.hero-name .mode { font-size: 16px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.hero-ring { display: flex; align-items: center; gap: 18px; }
.ring { position: relative; width: 132px; height: 132px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--good-track); }
.ring .bar { stroke: var(--good); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease); }
.ring.mid .trk { stroke: #e3f5ea; } .ring.mid .bar { stroke: var(--good-2); }
.ring.low .trk { stroke: var(--low-track); } .ring.low .bar { stroke: var(--low); }
.ring .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .val b { font-size: 48px; font-weight: 650; letter-spacing: -0.04em; line-height: 1; }
.ring .val b small { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.ring .val span { font-size: 11px; color: var(--ink-2); margin-top: 4px; }
.ring-side { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-2); }
.ring-side b { color: var(--ink); font-weight: 600; }

.hero-num { display: flex; flex-direction: column; gap: 16px; justify-content: center; }
.big { display: flex; align-items: baseline; gap: 10px; }
.big b { font-size: 40px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; }
.big span { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.delta { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.delta.up { background: var(--good-track); color: #11633b; }
.delta.down { background: #ffe5e2; color: #9e1f15; }
/* range: bad week .. good week, with the score needed for a reward */
.range { position: relative; height: 44px; }
.range .rail { position: absolute; left: 0; right: 0; top: 20px; height: 6px; border-radius: 3px; background: var(--hover); }
.range .band { position: absolute; top: 20px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #cfe9da, #1f7a4f); }
.range .dot { position: absolute; top: 16px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--ink), 0 2px 6px rgba(0,0,0,.2); }
.range .need { position: absolute; top: 12px; width: 2px; height: 22px; margin-left: -1px; border-radius: 1px; background: var(--ink); }
.range .need span { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.range .ends { position: absolute; left: 0; right: 0; top: 30px; display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.range .act { position: absolute; top: 14px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,.25); }
.rewards { display: flex; flex-wrap: wrap; gap: 8px; }
.rw { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--hover); font-variant-numeric: tabular-nums; }
.rw svg { flex: none; }
.rw.won { background: var(--good-track); color: #11633b; }
.rw.none { color: var(--ink-2); font-weight: 500; }
.rw small { font-weight: 500; color: var(--ink-2); }

.hero-lineup { display: flex; flex-direction: column; gap: 0; justify-content: space-between; }
.hero-lineup .actions { justify-content: center; }
.faces { display: flex; justify-content: space-between; gap: 6px; }
.face { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; flex: 1; }
.face .av { position: relative; width: 64px; height: 64px; border-radius: 50%; background: #f1f1f4; box-shadow: 0 0 0 3px #fff, 0 4px 14px rgba(0,0,0,.12); }
.face .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.face .crest { position: absolute; right: -4px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); padding: 2px; }
.face .crest img { width: 100%; height: 100%; object-fit: contain; }
.cap { position: absolute; left: -4px; top: -4px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #5a3d00; background: var(--f-lim); box-shadow: 0 0 0 2px #fff, 0 1px 3px rgba(0,0,0,.25); }
.face .nm { font-size: 12px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.face .xs { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; margin-top: -4px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: 11px 18px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: transform .2s var(--ease), background .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--ink); color: #fff; }
.btn.primary:hover { background: #000; }
.btn.soft { background: var(--track); color: var(--ink); }
.btn.soft:hover { background: #e2e2e8; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* card fan */
.fan { position: relative; height: 214px; margin: 0 0 34px; }
.fan .fc { position: absolute; left: 50%; bottom: 0; width: 112px; aspect-ratio: 5 / 8; margin-left: -56px; border-radius: 11px; transform-origin: 50% 115%;
  transform: translateX(calc(var(--k) * 58px)) rotate(calc(var(--k) * 7deg)) translateY(calc(var(--a) * 4px - 26px)); transition: transform .45s var(--ease), box-shadow .3s; box-shadow: 0 10px 24px rgba(0,0,0,.18); background: #e9e9ee; }
.fan .fc img { width: 100%; height: 100%; object-fit: cover; border-radius: 11px; }
.fan:hover .fc { transform: translateX(calc(var(--k) * 72px)) rotate(calc(var(--k) * 8deg)) translateY(calc(var(--a) * 5px - 26px)); }
.fan .fc:hover { z-index: 9 !important; transform: translateX(calc(var(--k) * 72px)) rotate(calc(var(--k) * 3deg)) translateY(calc(var(--a) * 5px - 44px)) scale(1.06); box-shadow: 0 18px 40px rgba(0,0,0,.25); }
.fan .fc.captain { box-shadow: 0 0 0 2px #f7c948, 0 10px 24px rgba(0,0,0,.18); }
.fan .fc .cap { left: 6px; top: 6px; }
.fan .rib { top: 18px; right: -5px; height: 18px; font-size: 11px; }
.fan .fc .tag { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--ink-2); opacity: 0; transition: opacity .2s; }
.fan .fc:hover .tag { opacity: 1; }
@media (max-width: 700px) { .fan { height: 176px; } .fan .fc, .fan:hover .fc { width: 88px; margin-left: -44px; transform: translateX(calc(var(--k) * 38px)) rotate(calc(var(--k) * 6deg)) translateY(calc(var(--a) * 3px - 20px)); } }

/* ---------- KPI strip ---------- */
.kpis { margin-top: 14px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-card); }
.kpi { padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi + .kpi { box-shadow: inset 1px 0 0 var(--line); }
.kpi .lbl { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.kpi b { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; display: flex; align-items: center; gap: 6px; }
.kpi b small { font-size: 13px; font-weight: 500; color: var(--ink-2); }

/* ---------- competitions ---------- */
.sec-head { margin: 36px 4px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-head h3 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
.seg { position: relative; display: inline-flex; padding: 3px; background: var(--track); border-radius: 11px; }
.seg .knob { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 9px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 3px 8px rgba(0,0,0,.06); transition: transform .3s var(--ease), width .3s var(--ease); }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--ink-seg); cursor: pointer; border-radius: 9px; }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.comp { position: relative; text-align: left; border: 0; cursor: pointer; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-card); padding: 20px 20px 18px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; overflow: hidden; transition: transform .25s var(--ease), box-shadow .25s var(--ease); animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.comp:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.comp:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.comp .edge { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
.comp .edge.limited { background: var(--f-lim); }
.comp .edge.rare { background: var(--f-rare); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.c-top { display: flex; align-items: center; gap: 10px; }
.c-top .nm { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-top .md { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.c-top .chev { margin-left: auto; color: var(--ink-2); flex: none; transition: transform .25s var(--ease); }
.comp:hover .chev { transform: translateX(3px); color: var(--ink); }
.c-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.c-val b { display: block; font-size: 34px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; }
.c-val .lbl { display: block; margin-top: 5px; font-size: 12px; color: var(--ink-2); }
.meter { height: 6px; border-radius: 3px; background: var(--good-track); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--good); transform-origin: left; animation: grow .9s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms + 120ms); }
.meter.mid { background: #e3f5ea; } .meter.mid i { background: var(--good-2); }
.meter.low { background: var(--low-track); } .meter.low i { background: var(--low); }
@keyframes grow { from { transform: scaleX(0); } }
.c-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.c-meta { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stack { display: flex; }
.stack img, .stack span { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #f1f1f4; box-shadow: 0 0 0 2px #fff; }
.stack > * + * { margin-left: -8px; }
.stack span { display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--ink-seg); }
.pill { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--hover); color: var(--ink-2); white-space: nowrap; }

/* not playable */
.blocked { margin-top: 14px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-card); }
.blocked summary { list-style: none; cursor: pointer; padding: 16px 20px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.blocked summary::-webkit-details-marker { display: none; }
.blocked summary span { color: var(--ink-2); font-weight: 500; }
.blocked summary svg { margin-left: auto; color: var(--ink-2); transition: transform .25s var(--ease); }
.blocked[open] summary svg { transform: rotate(90deg); }
.blocked ul { margin: 0; padding: 0 20px 14px; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 24px; }
.blocked li { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; box-shadow: inset 0 -1px 0 var(--line); }
.blocked li b { font-weight: 600; }
.blocked li em { margin-left: auto; font-style: normal; color: var(--ink-2); font-size: 12px; text-align: right; }

/* empty state (Rare with no goalkeeper) */
.empty { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.empty h2 { margin: 8px 0 8px; font-size: 30px; font-weight: 700; letter-spacing: -0.03em; }
.empty p { margin: 0; color: var(--ink-2); font-size: 15px; max-width: 42ch; }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

<script>
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);
  const NOW = new Date(D.generatedAt);
  const TZ = 'Europe/Madrid';
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  const pct = (p) => Math.round(p * 100);
  const dayFmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: 'numeric' });
  const monFmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, month: 'short' });
  const lockFmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const koFmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short', hour: '2-digit', minute: '2-digit' });
  const span = (a, b) => {
    const A = new Date(a), B = new Date(b);
    return monFmt.format(A) === monFmt.format(B) ? `${dayFmt.format(A)}–${dayFmt.format(B)} ${monFmt.format(B)}` : `${dayFmt.format(A)} ${monFmt.format(A)}–${dayFmt.format(B)} ${monFmt.format(B)}`;
  };
  const BUCKET = { 1: 'var(--fdr1)', 2: 'var(--fdr2)', 3: 'var(--fdr3)', 4: 'var(--fdr4)', 5: 'var(--fdr5)' };
  const lastName = (n) => { const p = n.split(' '); return p.length > 1 && p[p.length - 1].length > 2 ? p[p.length - 1] : n; };
  const ribClass = (v) => v == null ? 's0' : v >= 70 ? 's9' : v >= 55 ? 's7' : v >= 40 ? 's5' : v >= 25 ? 's3' : 's1';
  const meterClass = (p) => p >= 0.5 ? '' : p >= 0.2 ? 'mid' : 'low';
  const essence = (r, size = 16) => `<svg width="${size}" height="${size}" viewBox="0 0 16 16" aria-hidden="true"><defs><linearGradient id="e${r}${size}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${r === 'rare' ? '#ffb4aa' : '#ffe38a'}"/><stop offset=".55" stop-color="${r === 'rare' ? '#e0463c' : '#e8a917'}"/><stop offset="1" stop-color="${r === 'rare' ? '#8f1f19' : '#a86f00'}"/></linearGradient></defs><path d="M8 1 14 6 8 15 2 6Z" fill="url(#e${r}${size})"/><path d="M2 6h12M8 1 5.5 6 8 15l2.5-9L8 1" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".8"/></svg>`;
  const cash = `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#1f7a4f"/><text x="8" y="11.5" text-anchor="middle" font-size="10" font-weight="700" fill="#fff" font-family="-apple-system,Segoe UI,sans-serif">$</text></svg>`;
  const chevron = `<svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m5 2 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  // ---- timeline items: 13, 14, 15, break 16–20, 21
  const byId = Object.fromEntries(D.gws.map((g) => [g.id, g]));
  const ITEMS = [{ id: '13' }, { id: '14' }, { id: '15' }, { brk: true }, { id: '21' }];
  const state = { gw: '21', rarity: 'limited', filter: 'all', open: null, lu: 0 };

  const track = $('#track');
  ITEMS.forEach((it) => {
    if (it.brk) {
      const d = document.createElement('div');
      d.className = 'tl-break';
      d.innerHTML = `<b>GW16–20</b><span>International break</span>`;
      d.setAttribute('aria-label', 'Gameweeks 16 to 20: international break, no LaLiga');
      track.appendChild(d);
      return;
    }
    const g = byId[it.id];
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tl-item'; b.dataset.gw = g.id;
    const label = g.status === 'live' ? 'Live' : g.status === 'upcoming' ? 'Next' : '';
    b.innerHTML = `<span class="tl-top"><span class="tl-dot ${g.status}" aria-hidden="true"></span>GW${g.id}${label ? `<span class="pill" style="margin-left:2px">${label}</span>` : ''}</span><span class="tl-date">${span(g.start, g.end)}</span>`;
    b.setAttribute('aria-label', `Gameweek ${g.id}, ${span(g.start, g.end)}${label ? ', ' + label : ''}`);
    b.addEventListener('click', () => { state.gw = g.id; render(); });
    track.appendChild(b);
  });
  const gwOrder = ITEMS.filter((i) => i.id).map((i) => i.id);
  $('#prevGw').addEventListener('click', () => { const i = gwOrder.indexOf(state.gw); if (i > 0) { state.gw = gwOrder[i - 1]; render(); } });
  $('#nextGw').addEventListener('click', () => { const i = gwOrder.indexOf(state.gw); if (i < gwOrder.length - 1) { state.gw = gwOrder[i + 1]; render(); } });
  track.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const i = gwOrder.indexOf(state.gw) + (e.key === 'ArrowRight' ? 1 : -1);
    if (i >= 0 && i < gwOrder.length) { state.gw = gwOrder[i]; render(); track.querySelector(`[data-gw="${state.gw}"]`).focus(); }
  });

  function gwEssence(g) {
    const ls = g.comps.filter((c) => c.rarity === state.rarity).flatMap((c) => c.lineups);
    if (!ls.length) return null;
    return g.status === 'upcoming' ? { exp: true, v: ls.reduce((s, l) => s + l.expEssence, 0) } : { exp: false, v: ls.reduce((s, l) => s + (l.won?.essence || 0), 0) };
  }
  function paintTimeline() {
    track.querySelectorAll('.tl-item').forEach((b) => {
      const g = byId[b.dataset.gw], e = gwEssence(g);
      const d = b.querySelector('.tl-date');
      d.innerHTML = span(g.start, g.end) + (e ? ` <span class="tl-ess${!e.exp && !e.v ? ' zero' : ''}">${essence(state.rarity, 11)}${e.exp ? '≈' : '+'}${fmt(e.v)}</span>` : '');
    });
  }

  function slideKnob(container, activeEl) {
    const knob = container.querySelector('.knob, .tl-knob');
    if (!knob || !activeEl) return;
    knob.style.width = activeEl.offsetWidth + 'px';
    knob.style.transform = `translateX(${activeEl.offsetLeft}px)`;
  }

  $('#rarity').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { state.rarity = b.dataset.r; render(); } });
  $('#filter').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { state.filter = b.dataset.f; render(); } });
  $('#cntLimited').textContent = D.poolByRarity.limited;
  $('#cntRare').textContent = D.poolByRarity.rare;

  // ---- helpers
  const ringSvg = (p, size = 132, stroke = 10) => {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r;
    return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="trk" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"/><circle class="bar" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-target="${c * (1 - p)}"/></svg>`;
  };
  const ring = (p, label, cls = '') => `<div class="ring ${meterClass(p)} ${cls}" role="img" aria-label="${pct(p)}% ${label}">${ringSvg(p)}<div class="val"><b data-count="${pct(p)}">0<small>%</small></b><span>${label}</span></div></div>`;
  const rangeBar = (lu, done) => {
    const lo = lu.lo, hi = lu.hi, need = lu.needed;
    const vals = [lo, hi, need, done ? lu.actual : null].filter((v) => v != null);
    const min = Math.min(...vals) - 25, max = Math.max(...vals) + 25;
    const x = (v) => ((v - min) / (max - min)) * 100;
    return `<div class="range" role="img" aria-label="Bad week ${lo}, good week ${hi}${need ? `, reward needs about ${need}` : ''}${done ? `, scored ${Math.round(lu.actual)}` : ''}">
      <div class="rail"></div><div class="band" style="left:${x(lo)}%;width:${x(hi) - x(lo)}%"></div>
      ${need ? `<div class="need" style="left:${x(need)}%"><span>needs ${need}</span></div>` : ''}
      ${done ? `<div class="act" style="left:${x(lu.actual)}%" title="Scored ${Math.round(lu.actual)}"></div>` : `<div class="dot" style="left:${x(lu.x)}%"></div>`}
      <div class="ends"><span>Bad week ${lo}</span><span>Good week ${hi}</span></div></div>`;
  };
  const rewardChips = (lu, rarity, done) => {
    if (done) {
      const w = lu.won || {};
      const parts = [];
      if (w.essence) parts.push(`<span class="rw won">${essence(rarity)}+${fmt(w.essence)} essence</span>`);
      if (w.cash) parts.push(`<span class="rw won">${cash}+$${w.cash.toFixed(2)}</span>`);
      return parts.length ? parts.join('') : `<span class="rw none">No reward</span>`;
    }
    const parts = [`<span class="rw">${essence(rarity)}≈ ${fmt(lu.expEssence)} <small>essence</small></span>`];
    parts.push(lu.pCash >= 0.005 ? `<span class="rw">${cash}${pct(lu.pCash)}% <small>cash chance</small></span>` : `<span class="rw none">${cash}No cash in reach</span>`);
    return parts.join('');
  };
  const avatar = (c, size = '') => `<img src="${esc(c.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer">`;

  function isDone(g) { return g.status !== 'upcoming'; }

  // ---- render
  function render() {
    const g = byId[state.gw];
    const done = isDone(g);
    // switchers
    track.querySelectorAll('.tl-item').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.gw === state.gw)));
    paintTimeline();
    const act = track.querySelector(`[data-gw="${state.gw}"]`);
    slideKnob(track, act);
    if (act && track.scrollWidth > track.clientWidth) track.scrollTo({ left: act.offsetLeft - (track.clientWidth - act.offsetWidth) / 2, behavior: 'smooth' });
    $('#prevGw').disabled = gwOrder.indexOf(state.gw) === 0;
    $('#nextGw').disabled = gwOrder.indexOf(state.gw) === gwOrder.length - 1;
    document.querySelectorAll('#rarity button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.r === state.rarity)));
    slideKnob($('#rarity'), $(`#rarity [data-r="${state.rarity}"]`));
    document.querySelectorAll('#filter button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.f === state.filter)));
    slideKnob($('#filter'), $(`#filter [data-f="${state.filter}"]`));

    // head line
    const sub = $('#headSub');
    if (g.status === 'upcoming') {
      const days = Math.ceil((new Date(g.lock) - NOW) / 86400000);
      sub.innerHTML = `GW${g.id} · ${span(g.start, g.end)} · locks ${lockFmt.format(new Date(g.lock))} <span class="pill">in ${days} days</span>`;
    } else if (g.status === 'live') {
      sub.innerHTML = `<span class="pulse" aria-hidden="true"></span>GW${g.id} is live · scores still moving`;
    } else {
      sub.textContent = `GW${g.id} · ${span(g.start, g.end)} · finished`;
    }

    const comps = g.comps.filter((c) => c.rarity === state.rarity);
    const playable = comps.filter((c) => c.lineups.length);
    const blocked = comps.filter((c) => !c.lineups.length);
    const lineupsOf = playable.flatMap((c) => c.lineups.map((l, i) => ({ c, l, i })));

    // hero
    const hero = $('#hero');
    hero.dataset.rarity = state.rarity;
    if (!playable.length) {
      renderEmpty(hero, comps);
    } else {
      let best;
      if (!done) best = lineupsOf.slice().sort((a, b) => b.l.p - a.l.p)[0];
      else best = lineupsOf.slice().sort((a, b) => ((b.l.won?.essence || 0) + (b.l.won?.cash || 0) * 100) - ((a.l.won?.essence || 0) + (a.l.won?.cash || 0) * 100) || (b.l.actual - b.l.needed) - (a.l.actual - a.l.needed))[0];
      renderHero(hero, best.c, best.l, best.i, done, g);
    }

    // kpis
    renderKpis(lineupsOf, done, g);

    // grid
    const grid = $('#grid');
    const shown = playable.filter((c) => state.filter === 'all' || c.mode === state.filter);
    const sorted = shown.slice().sort((a, b) => done
      ? (value(bestOf(b, true)) - value(bestOf(a, true))) || (bestOf(b, true).actual - bestOf(a, true).actual)
      : b.lineups[0].p - a.lineups[0].p);
    $('#compsTitle').textContent = done ? 'How each competition went' : 'Every competition, optimized';
    document.querySelector('.sec-head').hidden = !playable.length;
    const aa = $('#applyAll'); aa.hidden = done || !lineupsOf.length; aa.textContent = `Apply all ${lineupsOf.length}`;
    grid.innerHTML = sorted.length ? sorted.map((c, i) => compCard(c, i, done)).join('') : (playable.length ? `<p class="c-meta" style="padding:8px 4px">Nothing in ${state.filter} this week.</p>` : '');
    grid.querySelectorAll('.comp').forEach((el) => el.addEventListener('click', () => openSheet(el.dataset.key, +el.dataset.lu || 0)));

    // blocked
    const bl = $('#blocked');
    if (blocked.length) {
      bl.hidden = false;
      bl.innerHTML = `<summary>Not playable <span>· ${blocked.length}</span><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m5 2 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
        <ul>${blocked.map((c) => `<li><span class="foil ${c.rarity}" aria-hidden="true"></span><b>${esc(c.name)}</b> <span class="c-meta">${c.mode}</span><em>${esc(c.blocked)}</em></li>`).join('')}</ul>`;
    } else bl.hidden = true;

    animateNumbers(document);
  }

  function renderHero(hero, c, lu, idx, done, g) {
    const key = `${c.name}|${c.rarity}`;
    const n = lu.cards.length, mid = (n - 1) / 2;
    const faces = lu.cards.map((p, i) => { const k = i - mid; const shown = done ? p.actual : p.x;
      return `<div class="fc${p.captain ? ' captain' : ''}" style="--k:${k};--a:${Math.abs(k) * Math.abs(k)};z-index:${10 - Math.round(Math.abs(k) * 2)}" title="${esc(p.name)}"><img src="${esc(p.pic)}" alt="${esc(p.name)}" referrerpolicy="no-referrer">${p.captain ? '<span class="cap" aria-label="Captain">C</span>' : ''}<span class="rib ${ribClass(shown)}">${shown == null ? '–' : Math.round(shown)}</span><span class="tag">${esc(lastName(p.name))}</span></div>`; }).join('');
    const delta = done ? Math.round(lu.actual - lu.x) : 0;
    hero.innerHTML = `
      <div class="hero-id">
        <p class="eyebrow">${done ? (g.status === 'live' ? 'Leading this week' : 'Best result') : 'Best play this week'}</p>
        <div class="hero-name"><span class="foil lg stack ${c.rarity}" aria-hidden="true"></span><h2>${esc(c.name)}</h2><span class="mode">${c.mode}</span></div>
        <div class="hero-ring">${ring(lu.p, done ? 'chance before' : 'reward chance')}
          <div class="ring-side">
            <span><b>${c.cards}${c.subs ? ` + ${c.subs} subs` : ''}</b> cards${c.cap ? ` · cap <b>${c.cap}</b>` : ''}</span>
            <span>${c.mode === 'Arena' ? `Rooms of <b>10</b> · top 3 win` : `<b>${fmt(c.entries || 0)}</b> ${done ? 'lineups entered' : 'lineups last week'}`}</span>
            <span>Captain <b>+${Math.round((c.captainBonus || 0) * 100)}%</b></span>
          </div>
        </div>
      </div>
      <div class="hero-num">
        ${done
          ? `<div class="big"><b data-count="${Math.round(lu.actual)}">0</b><span>scored</span><span class="delta ${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '+' : '−'}${Math.abs(delta)} vs xScore ${lu.x}</span></div>`
          : `<div class="big"><b data-count="${lu.x}">0</b><span>xScore</span></div>`}
        ${rangeBar(lu, done)}
        <div class="rewards">${rewardChips(lu, c.rarity, done)}</div>
      </div>
      <div class="hero-lineup">
        <div class="fan" aria-label="Lineup">${faces}</div>
        <div class="actions">
          <button class="btn primary" type="button" data-open="${esc(key)}" data-lu="${idx}">View lineup</button>
          ${done ? '' : `<button class="btn soft tip" type="button" data-tip="Saves through the extension (S7)">Apply to Sorare</button>`}
        </div>
      </div>`;
    hero.querySelector('[data-open]').addEventListener('click', (e) => openSheet(e.currentTarget.dataset.open, +e.currentTarget.dataset.lu));
  }

  function renderEmpty(hero, comps) {
    const pos = D.poolByPos[state.rarity];
    const names = [...new Set(comps.map((c) => c.name.split(' · ')[0]))];
    const missing = Object.entries(pos).filter(([, n]) => n === 0).map(([p]) => p);
    const g = byId[state.gw];
    const inLimited = state.rarity === 'rare' ? g.comps.filter((c) => c.rarity === 'limited').flatMap((c) => c.lineups).flatMap((l) => [...l.cards, ...l.subs]).filter((p) => p.rarity === 'rare').length : 0;
    const word = { GK: 'goalkeeper', DEF: 'defender', MID: 'midfielder', FWD: 'forward' };
    hero.innerHTML = `<div class="empty">
      <div>
        <p class="eyebrow">${state.rarity === 'rare' ? 'Rare' : 'Limited'} · ${D.poolByRarity[state.rarity]} cards</p>
        <h2>${missing.length ? `One Rare ${word[missing[0]]} away` : 'No playable lineup'}</h2>
        <p>${missing.length ? `Every Rare competition needs a ${word[missing[0]]}. Adding one opens ${names.join(', ')}.` : 'Your cards don’t fit any competition this week.'}</p>
        ${inLimited ? `<p style="margin-top:10px"><b style="color:var(--ink)">${inLimited}</b> of your Rare cards play in Limited lineups this week.</p>` : ''}
      </div>
      <div class="slots">${['GK', 'DEF', 'MID', 'FWD'].map((p) => pos[p] ? `<div class="slot"><b>${pos[p]}</b><span>${p}</span></div>` : `<div class="slot missing"><b>+</b><span>${p}</span></div>`).join('')}</div>
    </div>`;
  }

  function renderKpis(lineupsOf, done, g) {
    const k = $('#kpis');
    if (!lineupsOf.length) { k.hidden = true; return; }
    k.hidden = false;
    const n = lineupsOf.length;
    const used = lineupsOf.reduce((s, x) => s + x.l.cards.length + x.l.subs.length, 0);
    const pool = D.poolByRarity[state.rarity] + (state.rarity === 'limited' ? D.poolByRarity.rare : 0);
    if (!done) {
      const pAny = 1 - lineupsOf.reduce((s, x) => s * (1 - x.l.p), 1);
      const ess = lineupsOf.reduce((s, x) => s + x.l.expEssence, 0);
      const cs = lineupsOf.reduce((s, x) => s + x.l.expCash, 0);
      k.innerHTML = `
        <div class="kpi"><span class="lbl">Lineups ready</span><b data-count="${n}">0</b></div>
        <div class="kpi"><span class="lbl">At least one reward</span><b><span><span data-count="${pct(pAny)}">0</span>%</span></b></div>
        <div class="kpi"><span class="lbl">Expected essence</span><b>${essence(state.rarity, 18)}<span data-count="${Math.round(ess)}">0</span></b></div>
        <div class="kpi"><span class="lbl">Expected cash</span><b>${cash}$${cs.toFixed(2)}</b></div>
        <div class="kpi"><span class="lbl">Cards used</span><b><span data-count="${used}">0</span><small>/ ${pool}</small></b></div>`;
    } else {
      const won = lineupsOf.filter((x) => (x.l.won?.essence || 0) + (x.l.won?.cash || 0) > 0).length;
      const ess = lineupsOf.reduce((s, x) => s + (x.l.won?.essence || 0), 0);
      const cs = lineupsOf.reduce((s, x) => s + (x.l.won?.cash || 0), 0);
      const act = lineupsOf.reduce((s, x) => s + x.l.actual, 0), exp = lineupsOf.reduce((s, x) => s + x.l.x, 0);
      const d = Math.round(((act - exp) / exp) * 100);
      k.innerHTML = `
        <div class="kpi"><span class="lbl">Rewarded</span><b><span data-count="${won}">0</span><small>/ ${n} lineups</small></b></div>
        <div class="kpi"><span class="lbl">Essence ${g.status === 'live' ? 'so far' : 'won'}</span><b>${essence(state.rarity, 18)}<span data-count="${ess}">0</span></b></div>
        <div class="kpi"><span class="lbl">Cash ${g.status === 'live' ? 'so far' : 'won'}</span><b>${cash}$${cs.toFixed(2)}</b></div>
        <div class="kpi"><span class="lbl">Scored vs xScore</span><b>${d >= 0 ? '+' : '−'}${Math.abs(d)}%</b></div>
        <div class="kpi"><span class="lbl">Points scored</span><b><span data-count="${Math.round(act)}">0</span><small>/ ${fmt(exp)} expected</small></b></div>`;
    }
  }

  const value = (l) => (l.won?.essence || 0) + (l.won?.cash || 0) * 100;
  const bestOf = (c, done) => done ? c.lineups.slice().sort((a, b) => value(b) - value(a) || b.actual - a.actual)[0] : c.lineups[0];
  function compCard(c, i, done) {
    const l = bestOf(c, done);
    const li = c.lineups.indexOf(l);
    const key = `${c.name}|${c.rarity}`;
    const faces = l.cards.slice(0, 5).map((p) => avatar(p)).join('') + (l.cards.length > 5 ? `<span>+${l.cards.length - 5}</span>` : '');
    const main = done
      ? `<div class="c-val"><b data-count="${Math.round(l.actual)}">0</b><span class="lbl">scored · xS ${l.x}</span></div>
         <div class="rewards">${rewardChips(l, c.rarity, true)}</div>`
      : `<div class="c-val"><b><span data-count="${pct(l.p)}">0</span>%</b><span class="lbl">reward chance</span></div>
         <div class="c-meta" style="text-align:right">xS <b style="color:var(--ink)">${l.x}</b><br>needs ${l.needed ?? '—'}</div>`;
    return `<button class="comp" type="button" style="--i:${i}" data-key="${esc(key)}" data-lu="${li}" aria-label="${esc(c.name)} ${c.mode}, ${done ? `scored ${Math.round(l.actual)}` : `${pct(l.p)}% reward chance`}">
      <span class="edge ${c.rarity}" aria-hidden="true"></span>
      <div class="c-top"><span class="nm">${esc(c.name)}</span><span class="md">${c.mode}</span>${chevron}</div>
      <div class="c-main">${main}</div>
      ${done ? '' : `<div class="meter ${meterClass(l.p)}" aria-hidden="true"><i style="width:${Math.max(pct(l.p), 2)}%"></i></div>`}
      <div class="c-foot"><div class="stack">${faces}</div>
        <span class="c-meta">${c.lineups.length > 1 ? `<span class="pill">${c.lineups.length} lineups</span>` : ''} ${done ? '' : `${essence(c.rarity, 12)} ≈${fmt(l.expEssence)}`}</span></div>
    </button>`;
  }

  // ---- sheet
  const scrim = $('#scrim'), sheet = $('#sheet');
  let lastFocus = null;
  function openSheet(key, idx) {
    const g = byId[state.gw];
    const c = g.comps.find((x) => `${x.name}|${x.rarity}` === key);
    if (!c) return;
    state.open = key; state.lu = idx || 0;
    lastFocus = document.activeElement;
    drawSheet(c, g);
    scrim.classList.add('open'); scrim.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    setTimeout(() => $('.x', sheet)?.focus(), 50);
  }
  function closeSheet() {
    scrim.classList.remove('open'); scrim.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    state.open = null;
    lastFocus?.focus?.();
  }
  scrim.addEventListener('click', (e) => { if (e.target === scrim) closeSheet(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.open) closeSheet(); });

  function drawSheet(c, g) {
    const done = isDone(g);
    const l = c.lineups[state.lu];
    const tabs = c.lineups.length > 1 ? `<div class="seg" role="group" aria-label="Lineup" id="luSeg"><span class="knob" aria-hidden="true"></span>${c.lineups.map((x, i) => `<button type="button" data-i="${i}" aria-pressed="${i === state.lu}">Lineup ${i + 1} · ${done ? Math.round(x.actual) : pct(x.p) + '%'}</button>`).join('')}</div>` : '';
    const card = (p, i) => {
      const shown = done ? p.actual : p.x;
      return `<div class="pc" style="--i:${i}">
        <div class="art"><img src="${esc(p.pic)}" alt="${esc(p.name)} card" loading="lazy" referrerpolicy="no-referrer">${p.captain ? '<span class="cap" aria-label="Captain">C</span>' : ''}
          <span class="rib ${ribClass(shown)}">${shown == null ? '–' : Math.round(shown)}</span></div>
        <div class="who"><b>${esc(p.name)}</b>
          <span class="fx"><img src="${esc(p.oppCrest)}" alt="" referrerpolicy="no-referrer">${p.venue === 'H' ? 'vs' : '@'} ${p.opp} · ${koFmt.format(new Date(p.kickoff))}${p.bucket ? `<span class="fdr" style="background:${BUCKET[p.bucket]}" title="Sofix difficulty ${p.bucket}/5"></span>` : ''}</span></div>
        ${done
          ? `<div class="nums"><span>xS <b>${Math.round(p.x)}</b></span><span>Sorare <b>${p.sorare ?? '–'}</b></span></div>`
          : `<div class="nums"><span>Plays <b>${pct(p.pPlay)}%</b></span><span title="Bad / average / good game">${p.bad} · <b>${p.avg}</b> · ${p.good}</span></div>`}
        ${p.win != null ? `<div class="nums"><span>Win <b>${pct(p.win)}%</b></span><span>Clean sheet <b>${pct(p.cs)}%</b></span></div>` : ''}
      </div>`;
    };
    const tiers = (l.tiers || []);
    const ladder = tiers.length ? `<details class="ladder"><summary>Rewards <span>· ${c.mode === 'Arena' ? 'per room of 10' : 'score needed, average of the last 3 gameweeks'}</span><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m5 2 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <table><tbody>${tiers.map((t) => `<tr class="${!done && t.score && l.x >= t.score ? 'hit' : ''}"><td>${esc(t.label)}</td><td>${t.score ? `${t.score} pts` : ''}</td><td>${t.cash ? `${cash} $${fmt(t.cash)}` : ''} ${t.essence ? `${essence(c.rarity, 14)} ${fmt(t.essence)}` : ''}</td></tr>`).join('')}</tbody></table></details>` : '';
    const rules = [`${c.cards} cards${c.subs ? ` + ${c.subs} subs` : ''}`, 'one card per slot', c.cap ? `recent total ${l.l10} ≤ ${c.cap}` : null, c.minInSeason ? `${l.cards.filter((p) => p.inSeason).length} in-season (min ${c.minInSeason})` : null, `captain +${Math.round((c.captainBonus || 0) * 100)}%`].filter(Boolean);
    sheet.innerHTML = `
      <div class="sh-head"><span class="foil lg stack ${c.rarity}" aria-hidden="true"></span><div><h2 id="shTitle">${esc(c.name)}</h2><span class="md">${c.mode} · GW${g.id}</span></div>
        ${tabs}<button class="x" type="button" aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
      <div class="sh-body">
        <div class="sh-sum">
          ${ring(l.p, done ? 'chance before' : 'reward chance')}
          <div class="hero-num" style="gap:12px">
            ${done ? `<div class="big"><b data-count="${Math.round(l.actual)}">0</b><span>scored · xScore ${l.x}${l.sorare ? ` · Sorare ${l.sorare}` : ''}</span></div>` : `<div class="big"><b data-count="${l.x}">0</b><span>xScore</span></div>`}
            ${rangeBar(l, done)}
          </div>
          <div class="actions" style="flex-direction:column;align-items:stretch">
            <div class="rewards" style="justify-content:flex-end">${rewardChips(l, c.rarity, done)}</div>
            ${done ? '' : `<button class="btn primary tip" type="button" data-tip="Saves through the extension (S7)">Apply to Sorare</button>`}
          </div>
        </div>
        <div class="cards" style="--n:${l.cards.length}">${l.cards.map(card).join('')}</div>
        ${l.subs.length ? `<div class="subs"><span class="lbl">Subs</span>${l.subs.map((p) => `<div class="sub"><img src="${esc(p.avatar)}" alt="" referrerpolicy="no-referrer"><div><b>${esc(p.name)}</b><br><span>${p.pos} · ${done ? `scored ${Math.round(p.actual ?? 0)}` : `xS ${Math.round(p.x)}`}</span></div></div>`).join('')}</div>` : ''}
        <div class="rules">${rules.map((r) => `<span>${esc(r)}</span>`).join('')}</div>
        ${ladder}
      </div>`;
    $('.x', sheet).addEventListener('click', closeSheet);
    const seg = $('#luSeg', sheet);
    if (seg) {
      requestAnimationFrame(() => slideKnob(seg, seg.querySelector(`[data-i="${state.lu}"]`)));
      seg.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { state.lu = +b.dataset.i; drawSheet(c, g); } });
    }
    animateNumbers(sheet);
  }

  // ---- motion
  function animateNumbers(root) {
    root.querySelectorAll('[data-count]').forEach((el) => {
      const target = +el.dataset.count;
      const small = el.querySelector('small');
      const suffix = small ? small.outerHTML : '';
      const t0 = performance.now(), dur = 700;
      const step = (t) => {
        const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.innerHTML = fmt(target * e) + suffix;
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
    requestAnimationFrame(() => root.querySelectorAll('.ring .bar').forEach((b) => { b.style.strokeDashoffset = b.dataset.target; }));
  }

  window.addEventListener('resize', () => {
    slideKnob(track, track.querySelector(`[data-gw="${state.gw}"]`));
    slideKnob($('#rarity'), $(`#rarity [data-r="${state.rarity}"]`));
    slideKnob($('#filter'), $(`#filter [data-f="${state.filter}"]`));
  });
  render();
  // knobs need layout: settle once fonts are in
  requestAnimationFrame(() => render());
})();
</script>
</body>
</html>
