<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="design-check" content="record">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sofix Home v2</title>
<style>
:root {
  --bg: #fbfbfd; --surface: #ffffff; --ink: #1d1d1f; --ink-2: #6e6e73; --ink-3: #86868b; --ink-seg: #5e5e63;
  --line: #e8e8ed; --hover: #f5f5f7; --track: #ececf0; --accent: #0071e3;
  --good: #1f7a4f; --good-2: #5cc58d; --good-track: #d3f2e1; --low: #aeaeb2; --low-track: #f1f1f4;
  --amber: #ff9f0a;
  --f-lim: linear-gradient(145deg, #fff3c4 0%, #f7c948 38%, #d99a0b 62%, #ffe08a 100%);
  --f-rare: linear-gradient(145deg, #ffd6cf 0%, #f0594c 40%, #b3261e 66%, #ff9e94 100%);
  --fdr1: #1f7a4f; --fdr2: #d3f2e1; --fdr3: #f1f1f4; --fdr4: #ffdcd8; --fdr5: #c4312a;
  --fdr2-edge: #a8dfc0; --fdr3-edge: #e2e2e7; --fdr4-edge: #e8998f;
  --win: #1a7a4e; --loss: #c4312a;
  --stripes: linear-gradient(90deg, #1f7a4f 0 20%, #5cc58d 20% 40%, #e3e3e8 40% 60%, #ff7b6e 60% 80%, #c4312a 80%);
  --shadow-card: 0 0 0 1px rgba(0,0,0,.04), 0 2px 4px rgba(0,0,0,.02), 0 12px 32px rgba(0,0,0,.05);
  --shadow-lift: 0 0 0 1px rgba(0,0,0,.04), 0 8px 18px rgba(0,0,0,.06), 0 24px 48px rgba(0,0,0,.08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.3,.7,.2,1);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.4 var(--font); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
img { display: block; }
a { color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- nav ---------- */
.nav { position: sticky; top: 0; z-index: 30; background: rgba(251,251,253,.8); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(0,0,0,.06); }
.nav-in { max-width: 1240px; margin: 0 auto; height: 52px; padding: 0 20px; display: flex; align-items: center; gap: 30px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: -0.02em; text-decoration: none; cursor: pointer; }
.brand i { width: 22px; height: 22px; border-radius: 7px; background: var(--stripes); box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
.links { display: flex; align-items: center; gap: 22px; }
.links a { color: var(--ink-2); text-decoration: none; font-size: 13px; font-weight: 500; transition: color .2s; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.links a:hover, .links a[aria-current="page"] { color: var(--ink); }
.links .sep { width: 1px; height: 14px; background: var(--line); }
.pill { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 9px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.06); font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill small { color: var(--ink-2); font-weight: 500; font-size: 13px; }
.beat { width: 22px; height: 14px; color: #34c759; }
.beat path { stroke-dasharray: 40; animation: beat 1.6s linear infinite; }
@keyframes beat { from { stroke-dashoffset: 40; } to { stroke-dashoffset: -40; } }

main { max-width: 1240px; margin: 0 auto; padding: 28px 20px 72px; }

/* ---------- page head ---------- */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; }
.eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
h1 { margin: 0; font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: -0.035em; }
.sub { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sub .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-3); }
.count { display: flex; align-items: flex-end; gap: 12px; text-align: right; }
.count .n { display: flex; align-items: baseline; gap: 4px; justify-content: flex-end; }
.count .n b { font-size: 56px; font-weight: 650; letter-spacing: -0.045em; line-height: .9; font-variant-numeric: tabular-nums; }
.count .n span { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin-right: 8px; }
.count .n span:last-child { margin-right: 0; }
.count small { display: block; font-size: 12px; color: var(--ink-2); line-height: 1.35; white-space: nowrap; margin-top: 6px; }
.count .ic { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; background: #eef5ff; color: var(--accent); margin-bottom: 2px; }

/* ---------- foil chips ---------- */
.foil { position: relative; flex: none; width: 16px; height: 22px; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.12); }
.foil.limited { background: var(--f-lim); } .foil.rare { background: var(--f-rare); }
.foil::after { content: ""; position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.75) 50%, transparent 60%); transform: translateX(-60%); transition: transform .9s var(--ease); }
.tile:hover .foil::after, .lu:hover .foil::after, .hero:hover .foil::after { transform: translateX(60%); }
.foil.sm { width: 11px; height: 15px; border-radius: 3px; }
.foil.lg { width: 22px; height: 30px; border-radius: 5px; }
.foil.stack { overflow: visible; } .foil.stack::before { content: ""; position: absolute; left: 4px; top: -3px; width: 100%; height: 100%; border-radius: inherit; background: inherit; opacity: .45; z-index: -1; }

/* ---------- gameweek timeline (S0 component) ---------- */
.timeline { margin-top: 22px; display: flex; align-items: center; gap: 10px; }
.tl-arrow { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #fff; box-shadow: var(--shadow-card); cursor: pointer; display: grid; place-items: center; color: var(--ink); transition: transform .2s var(--ease); }
.tl-arrow:hover:not(:disabled) { transform: scale(1.06); }
.tl-arrow:disabled { opacity: .35; cursor: default; }
.tl-arrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tl-track { position: relative; flex: 1; min-width: 0; display: flex; gap: 4px; padding: 5px; background: var(--track); border-radius: 18px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; }
.tl-track::-webkit-scrollbar { display: none; }
.tl-knob { position: absolute; top: 5px; bottom: 5px; left: 0; border-radius: 14px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.08); transition: transform .45s var(--ease), width .45s var(--ease); }
.tl-item { position: relative; z-index: 1; flex: 1 0 auto; min-width: 112px; border: 0; background: none; cursor: pointer; border-radius: 14px; padding: 8px 14px; text-align: left; scroll-snap-align: center; display: flex; flex-direction: column; gap: 2px; }
.tl-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tl-top { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 650; color: var(--ink-seg); white-space: nowrap; }
.tl-item[aria-pressed="true"] .tl-top { color: var(--ink); }
.tl-date { font-size: 12px; color: var(--ink-seg); font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.tl-date em { font-style: normal; font-weight: 600; color: var(--ink); }
.tl-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.tl-dot.done { background: var(--ink-3); }
.tl-dot.live { background: #34c759; animation: pulse 1.8s infinite; }
.tl-dot.next { background: var(--accent); }
.tl-dot.later { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.tl-tag { font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 1px 6px; border-radius: 5px; background: #fff1d6; color: #7a4d00; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(52,199,89,.5); } 70% { box-shadow: 0 0 0 7px rgba(52,199,89,0); } 100% { box-shadow: 0 0 0 0 rgba(52,199,89,0); } }

/* ---------- bento ---------- */
.bento { margin-top: 22px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.tile { position: relative; min-width: 0; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-card); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; isolation: isolate; transition: transform .25s var(--ease), box-shadow .25s var(--ease); animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.tile.link:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.tile:has(.t-link:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.t-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.t-head h2 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.02em; white-space: nowrap; }
.t-link { text-decoration: none; outline: none; cursor: pointer; }
.t-link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 2; }
.t-meta { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { margin-left: auto; flex: none; color: var(--ink-2); transition: transform .25s var(--ease), color .25s; }
.tile.link:hover .chev, .lu:hover .chev { transform: translateX(3px); color: var(--ink); }
.crest { width: 16px; height: 16px; object-fit: contain; flex: none; }
.crest.lg { width: 36px; height: 36px; }
.sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; margin: 22px 4px -2px; flex-wrap: wrap; }
.sec h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
.sec .meta { font-size: 13px; color: var(--ink-2); }
.sec .push { margin-left: auto; }
.mini-sw { display: inline-flex; align-items: center; gap: 4px; padding: 3px; border-radius: 999px; background: var(--track); }
.mini-sw button { width: 28px; height: 28px; border: 0; border-radius: 50%; background: none; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
.mini-sw button:hover:not(:disabled) { background: #fff; }
.mini-sw button:disabled { opacity: .35; cursor: default; }
.mini-sw span { min-width: 64px; text-align: center; font-size: 13px; font-weight: 650; }
.mini-sw button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.t-hero { display: flex; align-items: center; gap: 12px; min-width: 0; }
.t-hero .who { min-width: 0; }
.t-hero .who b { display: block; font-size: 17px; font-weight: 650; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-hero .who span { font-size: 12px; color: var(--ink-2); }
.t-hero .val { margin-left: auto; text-align: right; flex: none; }
.t-hero .val b { display: block; font-size: 34px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.t-hero .val span { font-size: 12px; color: var(--ink-2); }
.t-foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); padding-top: 12px; box-shadow: inset 0 1px 0 var(--line); flex-wrap: wrap; }
.t-foot b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.t-foot .push { margin-left: auto; }
.sub-h { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--ink-2); letter-spacing: .03em; text-transform: uppercase; }

/* ---------- next gameweek tile (Sorare) ---------- */
.tile.next { grid-column: span 8; }
.tile.next::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(620px circle at 100% 0%, rgba(247,201,72,.18), transparent 62%), radial-gradient(420px circle at 0% 100%, rgba(0,113,227,.05), transparent 60%); }
.state-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px 4px 8px; border-radius: 999px; background: #eef5ff; color: #0058b0; white-space: nowrap; }
.state-chip.good { background: var(--good-track); color: #11633b; }
.nx { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 26px; flex: 1; }
.nx-l { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big b { font-size: 40px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.big span { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.split { display: flex; gap: 6px; flex-wrap: wrap; }
.split .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--hover); color: var(--ink); white-space: nowrap; }
.split .chip small { color: var(--ink-2); font-weight: 500; font-size: 12px; }
.faces { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding: 6px 2px 2px; margin: -6px -2px 0; scroll-snap-type: x proximity; }
.faces::-webkit-scrollbar { display: none; }
.face { flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 5px; scroll-snap-align: start; }
.face .av { position: relative; width: 52px; height: 52px; border-radius: 50%; background: #f1f1f4; box-shadow: 0 0 0 2.5px #fff, 0 4px 12px rgba(0,0,0,.12); }
.face .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.face .av .is { position: absolute; right: -3px; bottom: -1px; width: 14px; height: 14px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 2px #fff; }
.face .av .n2 { position: absolute; left: -4px; top: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--ink); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff; }
.face b { font-size: 11px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.face span { font-size: 10px; color: var(--ink-2); font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.opts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.opts li { display: grid; grid-template-columns: 11px minmax(0, 1fr) auto 28px; gap: 10px; align-items: center; min-height: 38px; box-shadow: inset 0 -1px 0 var(--line); font-size: 13px; }
.opts li:last-child { box-shadow: none; }
.opts .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opts .nm small { display: block; font-size: 11px; font-weight: 500; color: var(--ink-2); }
.opts .fee { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.opts .fee.free { color: #11633b; font-weight: 600; }
.opts .mx { text-align: right; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
.opts .mx small { color: var(--ink-2); font-weight: 500; }
.wait-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #f6f9ff; box-shadow: inset 0 0 0 1px #e3edfb; }
.wait-row .ring-sm { flex: none; }
.wait-row b { display: block; font-size: 14px; font-weight: 650; }
.wait-row span { font-size: 12px; color: var(--ink-2); }
.ring-sm { position: relative; width: 44px; height: 44px; }
.ring-sm svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-sm .trk { stroke: #dbe8fb; } .ring-sm .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease); }
.ring-sm i { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 700; color: #0058b0; }

/* ---------- plan tile (home, plans ready) ---------- */
.tile.plan { grid-column: span 12; padding: 20px 24px 22px; }
.tile.plan::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(700px circle at 100% 0%, rgba(247,201,72,.2), transparent 62%), radial-gradient(420px circle at 0% 100%, rgba(0,113,227,.05), transparent 60%); }
.pl { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1fr) minmax(0, 1.25fr); gap: 30px; align-items: center; }
.pl-a { display: flex; align-items: center; gap: 18px; }
.pl-b { display: flex; flex-direction: column; gap: 14px; }
.lurows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lurows li { display: grid; grid-template-columns: 11px minmax(0, 1fr) 40px 40px 64px; gap: 10px; align-items: center; min-height: 38px; box-shadow: inset 0 -1px 0 var(--line); font-size: 13px; }
.lurows li:last-child { box-shadow: none; }
.lurows .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lurows .nm small { display: block; font-size: 11px; font-weight: 500; color: var(--ink-2); }
.lurows .xs { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.lurows .pc { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.lurows .meter { height: 5px; }
.others { display: flex; gap: 6px; flex-wrap: wrap; }
.others .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--hover); white-space: nowrap; }
.others .chip small { color: var(--ink-2); font-weight: 500; font-size: 12px; }

/* ---------- last gameweek tile (predicted vs actual) ---------- */
.tile.last { grid-column: span 4; }
.pva { display: flex; flex-direction: column; gap: 12px; flex: 1; justify-content: center; }
.pva-row { display: grid; grid-template-columns: 84px minmax(0, 1fr) 54px; gap: 10px; align-items: center; }
.pva-row .nm { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pva-row .res { font-size: 12px; font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
.pva-row .res.none { color: var(--ink-2); font-weight: 500; }
.rv { position: relative; height: 18px; }
.rv .rail { position: absolute; left: 0; right: 0; top: 8px; height: 3px; border-radius: 2px; background: var(--hover); }
.rv .band { position: absolute; top: 7px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, #cfe9da, #5cc58d); }
.rv .x { position: absolute; top: 4px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--ink); }
.rv .act { position: absolute; top: 3px; width: 13px; height: 13px; margin-left: -6.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2.5px #fff, 0 1px 4px rgba(0,0,0,.25); }
.rv .need { position: absolute; top: 1px; width: 2px; height: 17px; margin-left: -1px; border-radius: 1px; background: var(--ink); opacity: .75; }
.rv-key { display: flex; gap: 12px; font-size: 11px; color: var(--ink-2); flex-wrap: wrap; }
.rv-key span { display: inline-flex; align-items: center; gap: 5px; }
.rv-key i { width: 9px; height: 9px; border-radius: 50%; }

/* ---------- LaLiga tiles (S2 v1) ---------- */
.fixtures, .diff, .tbl { grid-column: span 4; min-height: 460px; }
.lg-tabs { display: none; }
.fx-list { display: flex; flex-direction: column; flex: 1; }
.fx-day { font-size: 11px; font-weight: 600; color: var(--ink-2); letter-spacing: .03em; text-transform: uppercase; padding: 8px 0 3px; }
.fx-day:first-child { padding-top: 0; }
.fx { display: grid; grid-template-columns: 40px minmax(0, 1fr) 96px; align-items: center; gap: 8px; height: 31px; box-shadow: inset 0 -1px 0 var(--line); }
.fx:last-child { box-shadow: none; }
.fx .t { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.teams { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0; }
.teams i { font-style: normal; font-weight: 500; color: var(--ink-2); }
.teams .sc { font-variant-numeric: tabular-nums; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--hover); }
.odds { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.bar3 { display: flex; gap: 2px; height: 5px; }
.bar3 i { border-radius: 3px; transform-origin: left; animation: grow .8s var(--ease) both; animation-delay: calc(var(--r, 0) * 30ms + 150ms); }
.bar3 .h { background: var(--fdr1); } .bar3 .d { background: #c7c7cc; } .bar3 .a { background: var(--accent); }
@keyframes grow { from { transform: scaleX(0); } }
.odds em { font-style: normal; font-size: 11px; color: var(--ink-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.odds em b { color: var(--ink); font-weight: 600; }
.mosaic { display: grid; gap: 3px; flex: 1; align-content: start; }
.m-row { display: grid; grid-template-columns: 30px repeat(5, minmax(0, 1fr)) 28px; gap: 3px; align-items: center; height: 11px; animation: fade .45s var(--ease) both; animation-delay: calc(var(--r) * 16ms + 180ms); }
@keyframes fade { from { opacity: 0; transform: translateX(-4px); } }
.m-row.hd { height: 14px; animation: none; }
.m-row.hd span { font-size: 10px; color: var(--ink-2); font-weight: 600; text-align: center; }
.m-row .code { font-size: 9.5px; font-weight: 600; color: var(--ink-2); letter-spacing: .01em; }
.m-row .xp { font-size: 10px; font-weight: 500; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.m-row.top .code, .m-row.top .xp, .m-row.bottom .code, .m-row.bottom .xp { color: var(--ink); font-weight: 700; }
.m-row i { height: 100%; border-radius: 3px; }
.m-row i.f1 { background: var(--fdr1); }
.m-row i.f2 { background: var(--fdr2); box-shadow: inset 0 0 0 1px var(--fdr2-edge); }
.m-row i.f3 { background: var(--fdr3); box-shadow: inset 0 0 0 1px var(--fdr3-edge); }
.m-row i.f4 { background: var(--fdr4); box-shadow: inset 0 0 0 1px var(--fdr4-edge); }
.m-row i.f5 { background: var(--fdr5); }
.m-row i.pl { background: repeating-linear-gradient(135deg, #fff 0 3px, #ececf0 3px 4px); box-shadow: inset 0 0 0 1px #e2e2e7; }
.m-row i.none { background: transparent; }
.race { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; }
.race i { transform-origin: left; animation: grow .9s var(--ease) both .2s; }
.race-key { display: flex; gap: 12px; font-size: 11px; color: var(--ink-2); margin-top: -6px; flex-wrap: wrap; }
.race-key span { display: inline-flex; align-items: center; gap: 5px; }
.race-key i { width: 7px; height: 7px; border-radius: 2px; }
.mini { list-style: none; margin: 0; padding: 0; }
.mini li { display: grid; grid-template-columns: 18px 16px minmax(0, 1fr) auto 30px; gap: 8px; align-items: center; height: 29px; font-size: 13px; box-shadow: inset 0 -1px 0 var(--line); }
.mini li:last-child { box-shadow: none; }
.mini .pos { font-size: 12px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.mini .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .pts { font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }
.form { display: flex; gap: 3px; }
.form i { width: 7px; height: 7px; border-radius: 50%; }
.form .W { background: var(--win); } .form .D { background: #aeaeb2; } .form .L { background: var(--loss); }
.down li { grid-template-columns: 16px minmax(0, 1fr) 70px 36px; }
.down .m { height: 5px; border-radius: 3px; background: var(--low-track); overflow: hidden; }
.down .m i { display: block; height: 100%; border-radius: 3px; background: #6e6e73; transform-origin: left; animation: grow .9s var(--ease) both .3s; }
.down .pc { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }

/* ---------- my cards strip ---------- */
.mycards { grid-column: span 12; display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 0; padding: 0; }
.mycards > div { padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mycards > div + div { box-shadow: inset 1px 0 0 var(--line); }
.mycards .lbl { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.mycards .kv { display: flex; align-items: baseline; gap: 8px; }
.mycards .kv b { font-size: 28px; font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.mycards .kv span { font-size: 13px; color: var(--ink-2); }
.rar { display: flex; gap: 16px; align-items: center; }
.rar span { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.posline { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
.posline i { display: block; }
.poskey { display: flex; gap: 12px; font-size: 11px; color: var(--ink-2); flex-wrap: wrap; }
.poskey b { color: var(--ink); font-weight: 650; }
.warn { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; }
.warn .foil { margin-top: 1px; }
.warn b { font-weight: 650; }
.warn span { color: var(--ink-2); }

/* ---------- Play page ---------- */
.mode { position: relative; display: inline-flex; padding: 4px; background: var(--track); border-radius: 14px; }
.mode .knob { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.08); transition: transform .35s var(--ease), width .35s var(--ease); }
.mode button { position: relative; z-index: 1; border: 0; background: none; cursor: pointer; padding: 8px 16px; border-radius: 10px; color: var(--ink-seg); font-weight: 600; font-size: 13px; white-space: nowrap; }
.mode button[aria-pressed="true"] { color: var(--ink); }
.mode button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* plan switch: five plans, one knob */
.plans { margin-top: 22px; position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 5px; background: var(--track); border-radius: 20px; }
.plans .knob { position: absolute; top: 5px; bottom: 5px; left: 0; border-radius: 16px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 20px rgba(0,0,0,.09); transition: transform .45s var(--ease), width .45s var(--ease); }
.plans button { position: relative; z-index: 1; border: 0; background: none; cursor: pointer; border-radius: 16px; padding: 10px 14px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.plans button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.plans .p1 { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 650; color: var(--ink-seg); white-space: nowrap; }
.plans button[aria-pressed="true"] .p1 { color: var(--ink); }
.plans .p1 .best { font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 1px 6px; border-radius: 5px; background: var(--good-track); color: #11633b; }
.plans .p2 { font-size: 12px; color: var(--ink-seg); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 8px; align-items: center; }
.plans .p2 b { color: var(--ink); font-weight: 600; }
.plans .mix { display: flex; gap: 2px; height: 4px; border-radius: 2px; overflow: hidden; margin-top: 3px; }
.plans .mix i { display: block; }

.hero { position: relative; margin-top: 14px; border-radius: 28px; background: var(--surface); box-shadow: var(--shadow-card); padding: 28px 30px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .95fr) minmax(0, 1.2fr); gap: 30px; overflow: hidden; isolation: isolate; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(640px circle at 100% 0%, rgba(247,201,72,.2), transparent 62%), radial-gradient(420px circle at 0% 100%, rgba(0,113,227,.05), transparent 60%); }
.hero-id { display: flex; flex-direction: column; gap: 16px; }
.hero-name { display: flex; align-items: center; gap: 12px; }
.hero-name h2 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.03em; }
.hero-name .md { font-size: 15px; font-weight: 500; color: var(--ink-2); }
.hero-ring { display: flex; align-items: center; gap: 18px; }
.ring { position: relative; width: 132px; height: 132px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--good-track); }
.ring .bar { stroke: var(--good); stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease); }
.ring.mid .trk { stroke: #e3f5ea; } .ring.mid .bar { stroke: var(--good-2); }
.ring.low .trk { stroke: var(--low-track); } .ring.low .bar { stroke: var(--low); }
.ring .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .val b { font-size: 48px; font-weight: 650; letter-spacing: -0.04em; line-height: 1; }
.ring .val b small { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.ring .val .lbl { font-size: 11px; color: var(--ink-2); margin-top: 4px; white-space: nowrap; }
.ring-side { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-2); }
.ring-side b { color: var(--ink); font-weight: 600; }
.hero-num { display: flex; flex-direction: column; gap: 14px; justify-content: center; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair > div { padding: 14px 16px; border-radius: 16px; background: var(--hover); display: flex; flex-direction: column; gap: 4px; }
.pair .lbl { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.pair b { font-size: 30px; font-weight: 650; letter-spacing: -0.035em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.pair small { font-size: 12px; color: var(--ink-2); }
.pair .won b { color: #11633b; }
.alloc { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.alloc-bar { display: flex; gap: 3px; height: 14px; border-radius: 7px; overflow: hidden; }
.alloc-bar i { display: block; transform-origin: left; animation: grow .9s var(--ease) both .15s; }
.alloc-key { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.alloc-key li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.alloc-key li i { width: 10px; height: 10px; border-radius: 3px; }
.alloc-key li b { font-weight: 600; }
.alloc-key li span { color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 12px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.btn { border: 0; border-radius: 12px; padding: 11px 18px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: transform .2s var(--ease), background .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--ink); color: #fff; }
.btn.primary:hover { background: #000; }
.btn.primary[aria-disabled="true"] { background: #3a3a3c; cursor: default; }
.btn.soft { background: var(--track); color: var(--ink); }
.btn.soft:hover { background: #e2e2e8; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tip { position: relative; }
.tip:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--ink); color: #fff; font-size: 12px; font-weight: 500; padding: 6px 10px; border-radius: 8px; pointer-events: none; z-index: 5; }

.sec-head { margin: 34px 4px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-head h3 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
.sec-head span { font-size: 13px; color: var(--ink-2); }

/* lineup cards */
.lus { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.lu { position: relative; text-align: left; border: 0; cursor: pointer; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-card); padding: 18px 20px 18px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; overflow: hidden; transition: transform .25s var(--ease), box-shadow .25s var(--ease); animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.lu:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.lu:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.lu .edge { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--f-lim); }
.lu-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.lu-top .nm { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
.grp { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.grp.In-season { background: #e8f1fd; color: #0a4f9c; }
.grp.Classic { background: #f2efe6; color: #6b5210; }
.grp.Room { background: #f3eefc; color: #5b3aa0; }
.lu-top .fmt { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lu-main { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 22px; align-items: end; }
.kv2 b { display: block; font-size: 30px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
.kv2 span { display: block; margin-top: 5px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.kv2.good b { color: var(--good); }
.meter { height: 6px; border-radius: 3px; background: var(--good-track); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--good); transform-origin: left; animation: grow .9s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms + 120ms); }
.meter.mid { background: #e3f5ea; } .meter.mid i { background: var(--good-2); }
.meter.low { background: var(--low-track); } .meter.low i { background: var(--low); }
.range { position: relative; height: 40px; }
.range .rail { position: absolute; left: 0; right: 0; top: 18px; height: 6px; border-radius: 3px; background: var(--hover); }
.range .band { position: absolute; top: 18px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #cfe9da, #1f7a4f); }
.range .dot { position: absolute; top: 14px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--ink), 0 2px 6px rgba(0,0,0,.2); }
.range .need { position: absolute; top: 11px; width: 2px; height: 20px; margin-left: -1px; border-radius: 1px; background: var(--ink); }
.range .need span { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.range .need.act { background: var(--accent); }
.range .need.act span { top: 22px; bottom: auto; color: #0058b0; }
.range .act { position: absolute; top: 12px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,.25); }
.range .ends { position: absolute; left: 0; right: 0; top: 28px; display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.lu-cards { display: flex; align-items: flex-end; gap: 6px; }
.mc { position: relative; flex: none; width: 46px; }
.mc .art { position: relative; width: 46px; aspect-ratio: 5 / 8; border-radius: 6px; background: #e9e9ee; box-shadow: 0 4px 10px rgba(0,0,0,.14); }
.mc .art img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
.mc.captain .art { box-shadow: 0 0 0 2px #f7c948, 0 4px 10px rgba(0,0,0,.14); }
.mc .c { position: absolute; left: -5px; top: -5px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: #5a3d00; background: var(--f-lim); box-shadow: 0 0 0 2px #fff; z-index: 1; }
.mc .isd { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 2px #fff; }
.mc .sc { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px; color: #fff; background: #2b8a3e; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mc .sc.dnp { background: #d9dde4; color: #16181d; }
.mc.out .art { opacity: .38; filter: grayscale(1); }
.mc.sub { width: 38px; }
.mc.sub .art { width: 38px; }
.mc.in .art { box-shadow: 0 0 0 2px var(--accent), 0 4px 10px rgba(0,0,0,.14); }
.lu-cards .div { flex: none; width: 1px; align-self: stretch; margin: 6px 4px 0; background: var(--line); }
.lu-cards .sl { flex: none; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); writing-mode: vertical-rl; transform: rotate(180deg); align-self: center; }
.lu-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rw { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--hover); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rw small { font-weight: 500; color: var(--ink-2); font-size: 12px; }
.rw.won { background: var(--good-track); color: #11633b; }
.rw.none { color: var(--ink-2); font-weight: 500; }
.rw.neg { background: #fff0ee; color: #9e1f15; }
.lu-foot .note2 { margin-left: auto; font-size: 12px; color: var(--ink-2); white-space: nowrap; }

/* also open / not playable / rules */
.fold { margin-top: 14px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-card); }
.fold summary { list-style: none; cursor: pointer; padding: 16px 20px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary span { color: var(--ink-2); font-weight: 500; }
.fold summary svg { margin-left: auto; color: var(--ink-2); transition: transform .25s var(--ease); flex: none; }
.fold[open] summary svg { transform: rotate(90deg); }
.fold summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 22px; }
.fold ul { margin: 0; padding: 0 20px 14px; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 28px; }
.fold li { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 13px; box-shadow: inset 0 -1px 0 var(--line); min-width: 0; }
.fold li b { font-weight: 600; white-space: nowrap; }
.fold li em { margin-left: auto; font-style: normal; color: var(--ink-2); font-size: 12px; text-align: right; }
.fold li em.neg { color: #9e1f15; font-weight: 600; }
.rules-list { margin: 0; padding: 0 20px 18px 20px; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 28px; }
.rules-list li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 13px; color: var(--ink-2); box-shadow: none; padding: 0; }
.rules-list li b { color: var(--ink); font-weight: 600; white-space: normal; }
.rules-list .ic { width: 26px; height: 26px; border-radius: 8px; background: var(--hover); display: grid; place-items: center; color: var(--ink); font-size: 12px; font-weight: 700; }

/* empty / waiting states for a gameweek */
.gw-state { margin-top: 22px; border-radius: 28px; background: var(--surface); box-shadow: var(--shadow-card); padding: 28px 30px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 30px; position: relative; overflow: hidden; isolation: isolate; }
.gw-state::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(560px circle at 100% 0%, rgba(0,113,227,.07), transparent 62%); }
.gw-state h2 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
.gw-state .faces { flex-wrap: wrap; overflow: visible; row-gap: 14px; }
.gw-state p { margin: 8px 0 0; color: var(--ink-2); font-size: 14px; max-width: 46ch; }

/* ---------- lineup sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(20,20,24,.28); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: grid; place-items: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { width: min(1060px, 100%); max-height: calc(100vh - 48px); overflow: auto; border-radius: 30px; background: var(--bg); box-shadow: 0 30px 80px rgba(0,0,0,.25); transform: translateY(24px) scale(.98); transition: transform .4s var(--ease); }
.scrim.open .sheet { transform: none; }
.sh-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 18px 24px; background: rgba(251,251,253,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(0,0,0,.05); }
.sh-head h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.025em; white-space: nowrap; }
.x { margin-left: auto; width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--track); cursor: pointer; display: grid; place-items: center; flex: none; }
.x:hover { background: #e2e2e8; }
.x:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sh-body { padding: 22px 24px 28px; display: flex; flex-direction: column; gap: 22px; }
.sh-sum { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 28px; align-items: center; padding: 20px 24px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow-card); }
.sh-sum .ring { width: 96px; height: 96px; }
.sh-sum .ring .val b { font-size: 30px; }
.sh-sum .ring .val b small { font-size: 15px; }
.cards { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 16px; }
.pc { display: flex; flex-direction: column; gap: 10px; min-width: 0; animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms); }
.pc .art { position: relative; aspect-ratio: 5 / 8; border-radius: 14px; background: #e9e9ee; box-shadow: 0 10px 24px rgba(0,0,0,.14); transition: transform .35s var(--ease); }
