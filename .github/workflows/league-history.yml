name: League history

# Every LaLiga player plus the owner's players elsewhere: new games and late corrections, kept in player_games.
# The refresh also upserts its owner's fresh games; neither job touches frozen source statements.
# About 700 players, paced by the client; longer first reads page back to the season's first gameweek.
# Cron is UTC: 03:30 is 05:30 Madrid in summer, 04:30 in winter, after the night's late games are scored and before the
# morning refresh. GitHub often starts scheduled runs late; a late run only means the games arrive later that day.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: league-history
  cancel-in-progress: false

jobs:
  league-history:
    name: Keep every player's games
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: prod
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      # With the key Sorare allows the heavier query that carries red cards, and a higher rate.
      SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: backend/requirements.lock

      - name: Install locked dependencies
        run: uv pip sync requirements.lock

      - name: Check secrets
        run: |
          test -n "$POSTGRES_URL" || { echo "::error::POSTGRES_URL secret is missing"; exit 1; }
          test -n "$SORARE_API_KEY" || { echo "::error::SORARE_API_KEY secret is missing"; exit 1; }

      # Progress is saved every 50 players, so a run that is cut off keeps what it read and the next one carries on.
      - name: Read the league's past games
        run: python -m app.jobs.league_history
