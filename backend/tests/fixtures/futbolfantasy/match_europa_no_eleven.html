                        <script>
        function getMinute(){
            var now = new Date();
            var hora = new Date('');
            var parte = 0;
            var diffMs = (now - hora); // milliseconds between now & Christmas
            var diffMins = Math.round(((diffMs % 86400000) % 3600000) / 60000); // minutes
            switch(parte){
                case 1:
                    diffMins = "Directo " + diffMins + "'";
                break;
                case 2:
                    diffMins = "Descanso";
                break;
                case 3:
                    diffMins = diffMins + 45;
                    diffMins = "Directo " + diffMins + "'";
                break;
                case 4:
                    diffMins = "Finalizado";
                break;
                case 5:
                    diffMins = diffMins + 90;
                    diffMins = "Directo " + diffMins + "'";
                break;
                case 6:
                    diffMins = "Final 1a parte de la prórroga";
                break;
                case 7:
                    diffMins = diffMins + 105;
                    diffMins = "Directo " + diffMins + "'";
                break;
                case 8:
                    diffMins = "Final 2a parte de la prórroga";
                break;
                case 9:
                    diffMins = "Penaltis";
                break;
                case 10:
                    diffMins = "Final";
                break;
            }
            $('.minuto_directo').addClass('ml-1').html(" " + diffMins);
        }
        document.addEventListener("DOMContentLoaded", function(event) {
            getMinute();
        });
    </script>
