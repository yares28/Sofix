name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests use in-memory SQLite; make sure nothing can pick up a real database.
      POSTGRES_URL: sqlite://
      POSTGRES_MIGRATION_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: backend/requirements-dev.lock

      - name: Install locked dependencies
        run: uv pip sync --system requirements-dev.lock

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy (typed core modules)
        run: mypy

      - name: Pytest (includes models-vs-migrations drift check)
        run: python -m pytest -q

      - name: OpenAPI document matches the committed frontend copy
        run: python -m app.openapi_export --check

      - name: Dependency audit
        run: uvx pip-audit -r requirements.lock

  frontend:
    name: Frontend (eslint, tsc, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Generated API types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- lib/api.gen.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

  e2e:
    name: End-to-end (Playwright, mock API)
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs the app against e2e/mock-api.mjs: no database, no secrets, no external APIs.
      - name: Playwright
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
