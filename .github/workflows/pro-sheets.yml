# Plan the Pro weeks again on the announced elevens (backend/app/jobs/pro_sheets.py, plans/pro-page.md "Teamsheet watch").
# The clock starts it when a watched game's eleven is newly out; the Pro page's "Check now" starts it by hand.
name: Pro teamsheets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pro-sheets
  cancel-in-progress: false

jobs:
  sheets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: prod
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_URL_SPARE: ${{ secrets.POSTGRES_URL_SPARE }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: backend/requirements.lock
      - run: uv pip sync requirements.lock
      - run: python -m app.jobs.neon_switch
      - run: python -m app.jobs.pro_sheets
