<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="design-check" content="hero: the overlay is drawn at Sorare's own card size, so the panel's 44px score is the largest number; crowd: the sheet shows the tile in several states side by side on purpose">
<title>Overlay on sorare.com</title>
<!-- The tile, the odds row and the panel are drawn with the extension's own stylesheet, so this sheet cannot drift from
     what ships. Only Sorare's stand-ins (the card frame, its chips, its odds bar) and the layout are styled here. -->
<link rel="stylesheet" href="../../../extension/overlay.css">
<style>
:root { --page: #0e0e0e; --line: #2a2a2e; --text: #ffffff; --text-2: #a3a3ab; --ease: cubic-bezier(.3,.7,.2,1); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--text); }
body { font: 14px/1.45 var(--sfx-font); -webkit-font-smoothing: antialiased; }
main { max-width: 1040px; margin: 0 auto; padding: 28px 18px 80px; }
h1 { margin: 0 0 22px; font: 700 18px/24px var(--sfx-font); }
h2 { margin: 30px 0 14px; font: 700 11px/14px var(--sfx-font); letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); }
.sheet { animation: rise .5s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

/* Sorare's own things, roughly: a card frame, two chips that hang off its right, its odds bar and its kickoff line. */
.row { display: flex; flex-wrap: wrap; gap: 26px; align-items: flex-start; }
.frame { position: relative; width: 159px; }
.frame img { display: block; width: 159px; height: 232px; border-radius: 8px; object-fit: cover; background: #1d1d20; }
.tag { position: absolute; right: -6px; display: flex; align-items: center; justify-content: center; gap: 3px; height: 18px; padding: 2px 4px; border-radius: 4px 4px 0 4px; color: #0e0e0e; font: 500 14px/14px var(--sfx-font); }
.tag--odds { top: 6px; background: #00f3eb; }
.tag--grade { top: 30px; width: 18px; padding: 0; background: #25ed36; font-weight: 600; }
.wdl { display: flex; align-items: center; justify-content: space-around; height: 24px; margin-top: 6px; border-radius: 8px; background: linear-gradient(90deg, rgba(120,160,30,.55) 0%, rgba(36,36,36,0) 48%), #242424; font: 700 15px/15px var(--sfx-font); }
.wdl b:nth-child(1) { color: #b6ff1a; } .wdl b:nth-child(2) { color: #b6b6b6; } .wdl b:nth-child(3) { color: #ff5a5a; }
.wdl small { font-size: 9px; margin-left: 1px; }
.room { position: relative; height: 26px; }
.room .sfx-odds { left: 0; top: 4px; right: 0; }
.kick { margin: 0; font: 500 12px/16px var(--sfx-font); color: var(--text-2); }
.spot { position: relative; }
.spot .sfx-ribs { left: 6px; top: 6px; }
.spot .sfx-ribs--compact { left: 4px; top: 4px; }
.spot .sfx-ribs--tiny { left: 3px; top: 3px; }
.beside .sfx-panel { position: relative; }
.caption { margin: 10px 0 0; font: 600 13px/16px var(--sfx-font); color: #fff; }
.caption span { display: block; margin-top: 3px; font: 500 12px/16px var(--sfx-font); color: var(--text-2); }
.crop { width: 132px; height: 150px; border-radius: 10px; overflow: hidden; position: relative; }
.crop img { position: absolute; left: 0; top: 0; width: 159px; height: 232px; object-fit: cover; }
.small { display: grid; place-items: center; width: 132px; height: 150px; border-radius: 10px; background: #161618; }
.small .frame { width: 84px; } .small img { width: 84px; height: 123px; border-radius: 5px; }
.small.tinier .frame { width: 56px; } .small.tinier img { width: 56px; height: 79px; border-radius: 4px; }
</style>
</head>
<body>
<main class="sheet">
  <h1>Overlay on sorare.com</h1>
  <p class="kick" style="margin:-14px 0 0">The numbers on this sheet are illustrative.</p>

  <h2>Compose: select your goalkeeper</h2>
  <div class="row beside" id="compose"></div>

  <h2>Midfielder and forward</h2>
  <div class="row" id="attack"></div>

  <h2>States</h2>
  <div class="row" id="states"></div>

  <h2>Decisions: what the best plan does with a card</h2>
  <div class="row" id="decisions"></div>
</main>

<script>
// The markup below is what extension/overlay.js builds (buildTile, panelNode, buildOdds), written out once so the sheet
// can show every state at rest. The colours are Sorare's own tokens.
var C = { high: "#00f3eb", up: "#25ed36", mid: "#f0ce1d", low: "#ff7e34", vlow: "#ff5a5a", lime: "#b6ff1a" };
var STRIPE = [C.high, C.up, C.mid, C.low, C.vlow];
var SHIRT = '<svg class="sfx-shirt" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 1.4 1 3.1l.9 2.5L3 5.2v5.4h6V5.2l1.1.4.9-2.5L8 1.4C7.6 2.3 6.9 2.8 6 2.8S4.4 2.3 4 1.4Z"/></svg>';
var OBLAK = "https://assets.sorare.com/card/c0af94c9-927b-422e-ac4e-a051f16e72ae/picture/tinified-4e59e1794fe68061a586ff8ba74fd171.png";
var GULER = "https://assets.sorare.com/card/9f848b74-dbf2-48e4-8393-45450eee2ea6/picture/tinified-2d1f65cc66df9a3004dc9e814ee98b63.png";

function stripe() { return '<span class="sfx-stripe" aria-hidden="true">' + STRIPE.map(function (c) { return '<i style="background:' + c + '"></i>'; }).join("") + "</span>"; }
function scoreColour(s) { return s <= 20 ? C.vlow : s <= 35 ? C.low : s <= 50 ? C.mid : s <= 60 ? C.lime : s <= 75 ? C.up : C.high; }

var TICK = '<span class="sfx-mark" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2.4 6.4 4.9 8.8 9.7 3.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>';
var STAR = '<span class="sfx-mark sfx-mark--star" aria-hidden="true" style="--sfx-m:' + C.mid + '"><svg viewBox="0 0 12 12"><path d="M6 1 7.5 4.3l3.6.4-2.7 2.4.8 3.5L6 8.7 2.8 10.6l.8-3.5L.9 4.7l3.6-.4Z" fill="currentColor"></path></svg></span>';

function tile(o) {
  var driver = o.stale
    ? '<span class="sfx-drive sfx-drive--none"><span class="sfx-cap">' + o.stale + "</span></span>"
    : o.fdr
    ? '<span class="sfx-drive"><span class="sfx-cap">FDR</span><b class="sfx-fdr">' + o.fdr + "</b></span>"
    : o.xg
      ? '<span class="sfx-drive"><span class="sfx-cap sfx-cap--xg">xG</span><b class="sfx-xg">' + o.xg + "</b></span>"
      : '<span class="sfx-drive sfx-drive--none"><span class="sfx-cap">No odds</span></span>';
  var doubt = o.doubt ? '<span class="sfx-doubt" aria-hidden="true">' + SHIRT.replace('class="sfx-shirt" ', "") + "<b>" + o.doubt + "<small>%</small></b></span>" : "";
  return '<span class="sfx-ribs sfx-ribs--full" data-sfx><button type="button" class="sfx-tile' + (o.doubt ? " sfx-tile--doubt" : "") + (o.stale ? " sfx-tile--stale" : "") + '" aria-label="' + o.label +
    '" style="--sfx-c:' + (o.stale ? "#a3a3ab" : scoreColour(o.score)) + ";--sfx-d:" + (o.fdrColour || "#fff") + '">' + stripe() +
    '<span class="sfx-main">' + SHIRT + '<b class="sfx-score">' + o.score + "</b></span>" + driver + doubt + "</button>" +
    (o.mark === "tick" ? TICK : o.mark === "star" ? STAR : "") + (o.rank ? '<span class="sfx-rank" aria-hidden="true">#' + o.rank + "</span>" : "") + "</span>";
}
function small(score, tiny) {
  return '<span class="sfx-ribs sfx-ribs--compact" data-sfx><span class="sfx-tile sfx-tile--compact' + (tiny ? " sfx-tile--tiny" : "") + '" role="img" aria-label="Sofix: ' + score +
    ' if he starts." style="--sfx-c:' + scoreColour(score) + '">' + stripe() + '<b class="sfx-score">' + score + "</b></span></span>";
}
function odds(win, cs) {
  return '<span class="sfx-odds" data-sfx role="group" aria-label="Sofix odds: win ' + win + "%, clean sheet " + cs + '%">' + stripe() +
    '<span class="sfx-odds-cell"><span class="sfx-cap">WIN</span><span class="sfx-odds-num sfx-odds-num--win">' + win + "<small>%</small></span></span>" +
    '<span class="sfx-odds-rule" aria-hidden="true"></span>' +
    '<span class="sfx-odds-cell"><span class="sfx-cap">CS</span><span class="sfx-odds-num">' + cs + "<small>%</small></span></span></span>";
}
function frame(art, alt, inner, below) {
  return '<div class="frame spot"><img src="' + art + '" alt="' + alt + '" referrerpolicy="no-referrer">' + inner + (below || "") + "</div>";
}
function figure(html, name, note) {
  return "<figure style=\"margin:0\">" + html + '<figcaption class="caption">' + name + (note ? "<span>" + note + "</span>" : "") + "</figcaption></figure>";
}

// One panel, both cases: Starts is the default and one press shows the other.
var PANEL = { start: { n: 53, words: "if he starts", chance: "90% he starts" }, bench: { n: 1, words: "if he doesn't start", chance: "2% he comes on" } };
function big(mode) {
  var p = PANEL[mode];
  return '<div class="sfx-big" style="--sfx-c:' + scoreColour(p.n) + '"><div><strong>' + p.n + "</strong><span>" + p.words + "</span></div><p><b>" + p.chance.split(" ")[0] + "</b> " + p.chance.split(" ").slice(1).join(" ") + "</p></div>";
}
function panelHtml() {
  var bands = STRIPE.map(function (c, i) { return '<i style="background:' + c + ";--sfx-band:" + c + '"' + (i === 1 ? " data-on" : "") + "></i>"; }).join("");
  return '<div class="sfx-panel" data-sfx="panel" data-side="left" role="group" aria-label="Sofix details"><span class="sfx-arrow"></span>' +
    stripe().replace('class="sfx-stripe"', 'class="sfx-stripe" style="border-radius:14px 14px 0 0;overflow:hidden;height:3px"') +
    '<div class="sfx-body"><div class="sfx-head"><span class="sfx-brand">' + stripe() + 'SOFIX</span><span class="sfx-age">updated 11 h ago</span></div>' +
    '<div class="sfx-seg" role="group" aria-label="Projected score when he"><button type="button" data-mode="start" aria-pressed="true">Starts</button><button type="button" data-mode="bench" aria-pressed="false">Doesn\'t start</button></div>' +
    big("start") + '<div class="sfx-rule"></div>' +
    '<div class="sfx-driver" style="--sfx-d:' + C.up + '"><div class="sfx-row"><span>Difficulty</span><span class="sfx-val"><span>Favourite</span><b class="sfx-fdr" style="--sfx-d:' + C.up + '">45</b></span></div>' +
    '<div class="sfx-bands" role="img" aria-label="Band 2 of 5 difficulty bands, 1 easiest">' + bands + "</div></div>" +
    '<div class="sfx-driver"><div class="sfx-row"><span>Clean sheet</span><span class="sfx-pct">33<small>%</small></span></div><div class="sfx-track" aria-hidden="true"><i style="width:33%"></i></div></div>' +
    '<p class="sfx-note">From Sofix\'s own model of this game.</p></div></div>';
}

document.getElementById("compose").innerHTML =
  panelHtml() +
  figure(
    frame(OBLAK, "Jan Oblak, Limited card", '<span class="tag tag--odds">90%</span><span class="tag tag--grade">B</span>' +
      tile({ score: 53, fdr: 45, fdrColour: C.up, label: "Sofix: 53 if he starts. Difficulty 45 of 100, favourite." }),
      '<div class="wdl" aria-label="Sorare odds: 46% win, 27% draw, 27% loss"><b>46<small>%</small></b><b>27<small>%</small></b><b>27<small>%</small></b></div><div class="room">' + odds(46, 33) + '</div><p class="kick">Sat 10 Oct · 16:15</p>'),
    "Goalkeeper", "If he starts · FDR, then Sofix's win and clean sheet under Sorare's odds");

document.getElementById("attack").innerHTML =
  figure(frame(GULER, "Midfielder card", tile({ score: 64, xg: "0.38", label: "Sofix: 64 if he starts. Expected goals 0.38." })), "Midfielder", "If he starts · xG") +
  figure(frame(GULER, "Forward card", tile({ score: 64, xg: "0.38", label: "Sofix: 64 if he starts. Expected goals 0.38." })), "Forward", "If he starts · xG, win chance on hover");

document.getElementById("states").innerHTML =
  figure('<div class="crop spot"><img src="' + OBLAK + '" alt="" referrerpolicy="no-referrer"><span class="sfx-ribs sfx-ribs--full" data-sfx><span class="sfx-tile sfx-tile--loading" role="img" aria-label="Sofix numbers loading">' + stripe() + '<span class="sfx-skel"><i></i><i></i></span></span></span></div>', "Loading") +
  figure('<div class="crop spot"><img src="' + OBLAK + '" alt="" referrerpolicy="no-referrer">' + tile({ score: 51, label: "Sofix: 51 if he starts. No odds for this game yet." }) + "</div>", "No odds yet") +
  figure('<div class="crop spot"><img src="' + OBLAK + '" alt="" referrerpolicy="no-referrer">' + tile({ score: 53, fdr: 45, fdrColour: C.up, doubt: 34, label: "Sofix: 53 if he starts. Difficulty 45 of 100, favourite. He starts only 34% of the time." }) + "</div>", "Doubtful starter") +
  figure('<div class="crop spot"><img src="' + OBLAK + '" alt="" referrerpolicy="no-referrer"><span class="sfx-ribs sfx-ribs--full" data-sfx><button type="button" class="sfx-tag" aria-label="Sofix does not recognise this extension. Open Sofix">' + stripe() + "<span>Sign in</span></button></span></div>", "Signed out") +
  figure('<div class="small"><div class="frame spot"><img src="' + OBLAK + '" alt="">' + small(53, false) + "</div></div>", "Small card") +
  figure('<div class="small tinier"><div class="frame spot"><img src="' + OBLAK + '" alt="">' + small(53, true) + "</div></div>", "Thumbnail");

document.getElementById("decisions").innerHTML =
  figure(frame(OBLAK, "Card in the best plan", tile({ score: 53, fdr: 45, fdrColour: C.up, mark: "tick", label: "Sofix: 53 if he starts. Difficulty 45 of 100, favourite. In your best plan, All Star lineup." })), "In the best plan", "A tick; the lineup is in its name and the panel") +
  figure(frame(OBLAK, "Captain of the best plan", tile({ score: 58, fdr: 45, fdrColour: C.up, mark: "star", label: "Sofix: 58 if he starts. In your best plan, All Star lineup, as captain." })), "Its captain", "A star") +
  figure(frame(OBLAK, "First on a list to pick from", tile({ score: 66, fdr: 45, fdrColour: C.up, mark: "tick", rank: 1, label: "Sofix: 66 if he starts. Number 1 of the cards on this list by expected score." })), "Best on the list", "#1 to #3, on a list of four or more under Select your ...") +
  figure(frame(OBLAK, "His game has started", tile({ score: 53, stale: "Started", label: "Sofix: 53 if he starts. His game has started." })), "Game started", "The colour goes, the number stays") +
  figure(frame(OBLAK, "Numbers more than a day old", tile({ score: 53, stale: "Old", label: "Sofix: 53 if he starts. These numbers are 40 h old." })), "More than a day old", "Same, for a stale refresh");

// The two cases of the panel, one press apart. Nothing here reaches Sorare or the app.
var seg = document.querySelector(".sfx-seg");
seg.addEventListener("click", function (event) {
  var button = event.target.closest("button");
  if (!button) return;
  seg.querySelectorAll("button").forEach(function (other) { other.setAttribute("aria-pressed", String(other === button)); });
  document.querySelector(".sfx-big").outerHTML = big(button.getAttribute("data-mode"));
});
</script>
</body>
</html>
