"https://assets.sorare.com/team/f92833c9-4e18-413e-8a3c-91c06f77abb3/picture/low_res-22f86a30575e4ed332d0f7c6dbbb979d.png","average":36,"projection":null,"eur":7.01,"pic":"https://assets.sorare.com/card/1c9127c7-4e64-4ebf-bacf-7e1795090876/picture/tinified-8a15f5d2a2a9cf0f5b0e411d05bca4e9.png"},{"slug":"hamza-mohamed-abdel-karim","name":"Hamza Abdelkarim","pos":"FWD","club":"Barcelona","crest":"https://assets.sorare.com/team/f115e8de-5e7a-44f6-a03f-1ec44cc02839/picture/low_res-e22e59b0d19b66242e924adc98b199e0.png","average":35,"projection":null,"eur":10.23,"pic":"https://assets.sorare.com/card/a9205a65-6f18-4468-9d1c-d906002e5171/picture/tinified-3799f86c73f0a671b893f3773737cbae.png"},{"slug":"jones-el-abdellaoui","name":"Jones El Abdellaoui","pos":"FWD","club":"Celta de Vigo","crest":"https://assets.sorare.com/team/f87c0c19-6d6b-4774-a546-c42b71d898f7/picture/low_res-9385655b2a0d435643756aa4194c32d1.png","average":34,"projection":null,"eur":2.09,"pic":"https://assets.sorare.com/card/234800f9-fef2-490d-b356-5dab4c28cd5a/picture/tinified-ccde07966a79c07d912d504de519340c.png"},{"slug":"alejandro-padilla-perez","name":"Á. Padilla","pos":"GK","club":"Athletic Club","crest":"https://assets.sorare.com/team/d4875093-b554-4837-b883-a69dfcaf75ac/picture/low_res-62d1e07f8fc20fe23fd53c4057606740.png","average":26,"projection":null,"eur":3.76,"pic":"https://assets.sorare.com/card/f42cccd8-eb77-4858-af4b-9fdae7c1bf3b/picture/tinified-d31e18e06bd06b4171c747a9d1ac570e.png"}]};
const ORDER = ["GK", "DEF", "MID", "FWD"];
const POS_LABEL = { GK: "Goalkeepers", DEF: "Defenders", MID: "Midfielders", FWD: "Forwards" };

const mine = DATA.mine;
const dupeCount = {};
mine.forEach((c) => { dupeCount[c.player] = (dupeCount[c.player] || 0) + 1; });
const players = Object.keys(dupeCount).length;
const duplicates = mine.length - players;
const clubs = new Set(mine.map((c) => c.club)).size;
const rare = mine.filter((c) => c.rarity === "rare").length;
const limited = mine.length - rare;
const inSeason = mine.filter((c) => c.inSeason).length;
const avg = Math.round(mine.reduce((a, c) => a + c.average, 0) / mine.length);
const byPos = ORDER.map((pos) => ({ pos, n: mine.filter((c) => c.pos === pos).length }));
const maxPos = Math.max(...byPos.map((p) => p.n));

$("#hero").dataset.v = players;
$("#heroLabel").textContent = "players you can field";
countTo($("#hero"), players);
$("#sub").innerHTML =
  "<span>from <b>" + mine.length + "</b> playable cards</span>" +
  "<span><b>" + duplicates + "</b> a duplicate you already have</span>" +
  "<span>across <b>" + clubs + "</b> clubs</span>" +
  "<span><b>" + DATA.leftOut.length + "</b> sealed</span>";

$("#kpis").innerHTML =
  kpi(mine.length, "playable") +
  kpi(limited, 'Limited', "limited") +
  kpi(rare, "Rare", "rare") +
  kpi(inSeason, "in season") +
  kpi(avg, "avg score");
function kpi(v, label, foil) {
  const chip = foil ? '<span class="foil ' + foil + '"></span>' : "";
  return '<div class="kpi"><b>' + chip + v + "</b><span>" + esc(label) + "</span></div>";
}

let pos = "all";
let rarity = "all";

$("#posSeg").innerHTML = ["all"].concat(ORDER)
  .map((p) => '<button type="button" data-pos="' + p + '" aria-pressed="' + (p === "all") + '">' + (p === "all" ? "All" : p) + "</button>")
  .join("");
$("#raritySeg").innerHTML = [["all", "Both"], ["limited", "Limited"], ["rare", "Rare"]]
  .map((r) => '<button type="button" data-rarity="' + r[0] + '" aria-pressed="' + (r[0] === "all") + '">' + r[1] + "</button>")
  .join("");

function draw() {
  const shownPos = pos === "all" ? ORDER : [pos];
  let total = 0;
  $("#shelves").innerHTML = shownPos.map((p) => {
    const cards = mine
      .filter((c) => c.pos === p && (rarity === "all" || c.rarity === rarity))
      .sort((a, b) => b.average - a.average);
    total += cards.length;
    if (!cards.length) return "";
    const pct = Math.round(100 * cards.length / maxPos);
    return (
      '<section class="shelf">' +
        '<div class="shelf-head">' +
          "<h2>" + POS_LABEL[p] + "</h2>" +
          "<em>" + cards.length + "</em>" +
          '<span class="shelf-bar"><i style="width:' + pct + '%"></i></span>' +
        "</div>" +
        '<div class="grid">' + cards.map(tile).join("") + "</div>" +
      "</section>"
    );
  }).join("");
  $("#count").textContent = total + (total === 1 ? " card" : " cards");
}

function tile(c, i) {
  return (
    '<article class="pc" style="animation-delay:' + Math.min(i * 20, 360) + 'ms">' +
      '<span class="art">' +
        '<img src="' + c.pic + '" alt="" referrerpolicy="no-referrer">' +
        (c.level > 0 ? '<span class="lvl">L' + c.level + "</span>" : "") +
        (dupeCount[c.player] > 1 ? '<span class="dup">\u00d7' + dupeCount[c.player] + "</span>" : "") +
        (c.inSeason ? '<span class="season"><s></s>IN SEASON</span>' : "") +
      "</span>" +
      '<span class="nm"><b>' + esc(c.name) + "</b>" +
        "<span>" + esc(c.club) + " \u00b7 <b>" + Math.round(c.average) + "</b></span></span>" +
    "</article>"
  );
}

document.querySelectorAll("[data-pos]").forEach((b) => b.addEventListener("click", () => {
  pos = b.dataset.pos;
  document.querySelectorAll("[data-pos]").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
  draw();
}));
document.querySelectorAll("[data-rarity]").forEach((b) => b.addEventListener("click", () => {
  rarity = b.dataset.rarity;
  document.querySelectorAll("[data-rarity]").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
  draw();
}));

$("#sealedSum").innerHTML = "Sealed \u00b7 " + DATA.leftOut.length +
  '<span class="chev" aria-hidden="true">\u203a</span>';
$("#sealed").innerHTML = DATA.leftOut
  .map((c) => '<span><span class="foil ' + c.rarity + '"></span><b>' + esc(c.name) + "</b> " + esc(c.why) + "</span>")
  .join("");

draw();
</script>
