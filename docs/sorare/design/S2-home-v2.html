      <div class="pl-a">${ring(p.pAny, 'any reward')}<div class="ring-side"><span><b>${p.lineups.length}</b> lineups</span><span><b>${p.cardsUsed}</b> of ${DATA.cards.usable} cards</span><span><b>${p.returns.toFixed(1)}</b> rewards expected</span></div></div>
      <div class="pl-b"><div class="pair"><div><span class="lbl">${ESS(13)}Essence</span><b>≈<span data-to="${p.essence}" data-sep="1">${n0(p.essence)}</span></b><small>expected</small></div><div><span class="lbl">${CASH(13)}Cash</span><b>≈$${p.cash.toFixed(2)}</b><small>expected</small></div></div>
        <div class="alloc-bar" role="img" aria-label="Where your cards go">${mix(p)}</div><div class="others">${others}</div></div>
      <div><div class="sub-h"><span>Plan 1 · the best</span><span>xScore · chance</span></div><ul class="lurows">${rows}</ul></div></div>`;
    return `<section class="tile plan link" style="--i:0" aria-labelledby="t-plan"><header class="t-head"><h2 id="t-plan"><a class="t-link" data-go="play" data-gw="15">Play</a></h2><span class="t-meta">GW15 · your plan</span><span class="state-chip good">5 plans ready</span>${CHEV}</header>${body}</section>`;
  }

  function lastTile() {
    const p = DATA.gw15.plans[0];
    const rows = p.lineups.map((lu) => {
      const a = lu.actual, lo = Math.min(lu.lo, a.total, lu.need, a.need || 1e9) - 25, hi = Math.max(lu.hi, a.total, lu.need, a.need || 0) + 25;
      const at = (v) => ((v - lo) / (hi - lo)) * 100;
      const need = a.need || lu.need;
      const res = a.cash ? `${CASH(12)}${a.cash}` : a.essence > 0 ? `${ESS(12)}${n0(a.essence)}` : a.card ? 'card' : '—';
      return `<div class="pva-row"><span class="nm">${esc(lu.comp)}</span><div class="rv" role="img" aria-label="${esc(lu.comp)}: predicted ${lu.x} (${lu.lo} to ${lu.hi}), scored ${a.total}, ${need} needed for a reward"><span class="rail"></span><span class="band" style="left:${at(lu.lo)}%;width:${at(lu.hi) - at(lu.lo)}%"></span><span class="need" style="left:${at(need)}%"></span><span class="x" style="left:${at(lu.x)}%"></span><span class="act" style="left:${at(a.total)}%"></span></div><span class="res ${res === '—' ? 'none' : ''}">${res}</span></div>`;
    }).join('');
    const inside = p.lineups.filter((lu) => lu.actual.total >= lu.lo && lu.actual.total <= lu.hi).length;
    const body = `<div class="t-hero"><div class="who"><b>${inside} of ${p.lineups.length} inside the range</b><span>Plan 1 · expected ≈${n0(p.essence)} essence</span></div><div class="val"><b data-to="${p.actual.essence}" data-sep="1">${n0(p.actual.essence)}</b><span>essence won</span></div></div>
      <div class="pva">${rows}</div>
      <div class="rv-key"><span><i style="box-shadow:inset 0 0 0 2px var(--ink)"></i>predicted</span><span><i style="background:var(--accent)"></i>scored</span><span><i style="width:2px;border-radius:1px;background:var(--ink)"></i>needed</span></div>`;
    return `<section class="tile last link" style="--i:1" aria-labelledby="t-last"><header class="t-head"><h2 id="t-last"><a class="t-link" data-go="play" data-gw="15" data-after="1">Last gameweek</a></h2><span class="t-meta">GW15 · predicted vs actual</span>${CHEV}</header>${body}</section>`;
  }

  /* LaLiga tiles (as built in S2) */
  const L = DATA.laliga;
  const crest = (code, cls = 'crest') => img(L.crests[code], '', cls);
  const lgTile = (cls, i, title, meta, body, id) => `<section class="tile ${cls} link" style="--i:${i}" aria-labelledby="${id}"><header class="t-head"><h2 id="${id}"><a class="t-link">${title}</a></h2>${meta ? `<span class="t-meta">${meta}</span>` : ''}${CHEV}</header>${body}</section>`;
  function fixturesTile(g) {
    let day = null, r = 0, html = '<div class="fx-list">';
    for (const m of g.fixtures) {
      const d = wdm(m.utc);
      if (d !== day) { html += `<div class="fx-day">${d}</div>`; day = d; }
      if (m.status === 'finished') {
        const [h, a] = m.score;
        html += `<div class="fx"><span class="t">FT</span><span class="teams">${crest(m.home)}${m.home}<span class="sc">${h}–${a}</span>${m.away}${crest(m.away)}</span><span class="odds"><em><b>${pct(m.chance)}</b></em></span></div>`;
      } else {
        const [ph, pd, pa] = m.p; const fav = ph >= pa ? [m.home, ph] : [m.away, pa];
        html += `<div class="fx" style="--r:${r++}"><span class="t">${m.time}</span><span class="teams">${crest(m.home)}${m.home}<i>v</i>${m.away}${crest(m.away)}</span><span class="odds"><span class="bar3" role="img" aria-label="${esc(L.names[m.home])} win ${pct(ph)}, draw ${pct(pd)}, ${esc(L.names[m.away])} win ${pct(pa)}"><i class="h" style="flex:${ph}"></i><i class="d" style="flex:${pd}"></i><i class="a" style="flex:${pa}"></i></span><em>${m.home === fav[0] ? m.home : m.away} <b>${pct(fav[1])}</b></em></span></div>`;
      }
    }
    return lgTile('fixtures', 3, 'Fixtures', `${g.fixtures.length} matches`, html + '</div>', 't-fx');
  }
  function difficultyTile(g, gw) {
    const rows = g.ladder, top = rows[0], bottom = rows[rows.length - 1];
    const cols = [0, 1, 2, 3, 4].map((k) => gw + k);
    let m = `<div class="mosaic" role="img" aria-label="Every club's next five games coloured by difficulty, easiest run first: ${esc(top.name)} ${top.xp} expected points, ${esc(bottom.name)} ${bottom.xp}">`;
    m += `<div class="m-row hd"><span></span>${cols.map((c) => `<span>${c}</span>`).join('')}<span></span></div>`;
    rows.forEach((row, i) => {
      const cls = i === 0 ? ' top' : i === rows.length - 1 ? ' bottom' : '';
      m += `<div class="m-row${cls}" style="--r:${i}"><span class="code">${row.code}</span>${row.cells.map((c) => !c ? '<i class="none"></i>' : c.r ? '<i class="pl"></i>' : `<i class="f${c.b}"></i>`).join('')}<span class="xp">${row.xp.toFixed(1)}</span></div>`;
    });
    m += '</div>';
    const hero = `<div class="t-hero">${crest(top.code, 'crest lg')}<div class="who"><b>${esc(top.name)}</b><span>easiest run</span></div><div class="val"><b data-to="${top.xp.toFixed(1)}">${top.xp.toFixed(1)}</b><span>expected points</span></div></div>`;
    const foot = `<div class="t-foot">Hardest ${crest(bottom.code)} ${esc(bottom.name)}<b class="push">${bottom.xp.toFixed(1)}</b></div>`;
    return lgTile('diff', 4, 'Difficulty', `GW${cols[0]}–GW${cols[4]}`, hero + m + foot, 't-diff');
  }
  function tableTile() {
    const P = L.predicted, S = L.standings;
    const title = Object.entries(P).map(([c, v]) => [c, parseFloat(v.first) || 0]).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const down = Object.entries(P).map(([c, v]) => [c, parseFloat(v.down) || 0]).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const [lead] = title;
    const tones = ['var(--good)', 'var(--good-2)', '#cfe9da'];
    const hero = `<div class="t-hero">${crest(lead[0], 'crest lg')}<div class="who"><b>${esc(L.names[lead[0]])}</b><span>to win the league</span></div><div class="val"><b data-to="${lead[1]}">${lead[1]}</b><span>% chance</span></div></div>`;
    const race = `<div class="race" role="img" aria-label="Chance of winning the league: ${title.map(([c, v]) => `${esc(L.names[c])} ${v}%`).join(', ')}">${title.map(([, v], i) => `<i style="flex:${v};background:${tones[i]}"></i>`).join('')}</div><div class="race-key">${title.map(([c, v], i) => `<span><i style="background:${tones[i]}"></i>${c} ${v}%</span>`).join('')}</div>`;
    const top = `<ol class="mini">${S.slice(0, 4).map((s) => `<li><span class="pos">${s.pos}</span>${crest(s.code)}<span class="nm">${esc(s.name)}</span><span class="form" role="img" aria-label="Last five: ${s.form}">${[...s.form].map((x) => `<i class="${x}"></i>`).join('')}</span><span class="pts">${s.pts}</span></li>`).join('')}</ol>`;
    const rel = `<div class="sub-h" style="margin-bottom:-6px"><span>Relegation</span><span>chance</span></div><ol class="mini down">${down.map(([c, v]) => `<li>${crest(c)}<span class="nm">${esc(L.names[c])}</span><span class="m"><i style="width:${v}%"></i></span><span class="pc">${v}%</span></li>`).join('')}</ol>`;
    return lgTile('tbl', 5, 'Table', 'after GW7', hero + race + top + rel, 't-tbl');
  }

  function myCards() {
    const c = DATA.cards, pos = ['GK', 'DEF', 'MID', 'FWD'];
    const byPos = pos.map((k) => (c.byPos.limited[k] || 0) + (c.byPos.rare[k] || 0));
    const cols = ['#1d1d1f', '#5e5e63', '#aeaeb2', '#d1d1d6'];
    const sealed = c.excluded.filter((x) => x.why === 'sealed').length;
    const other = c.excluded.length - sealed;
    return `<section class="tile mycards link" style="--i:6" aria-labelledby="t-cards">
      <div><header class="t-head"><h2 id="t-cards"><a class="t-link">My cards</a></h2>${CHEV}</header><div class="kv"><b data-to="${c.usable}">${c.usable}</b><span>you can play · of ${c.total}</span></div></div>
      <div><span class="lbl">By rarity</span><div class="rar"><span><span class="foil limited" aria-hidden="true"></span>${c.byRarity.limited}<span class="sr"> Limited</span></span><span><span class="foil rare" aria-hidden="true"></span>${c.byRarity.rare}<span class="sr"> Rare</span></span></div><span class="lbl"><b style="color:var(--ink)">${c.inSeason}</b> in-season</span></div>
      <div><span class="lbl">By position</span><div class="posline" role="img" aria-label="${pos.map((k, i) => `${k} ${byPos[i]}`).join(', ')}">${byPos.map((v, i) => `<i style="flex:${v};background:${cols[i]}"></i>`).join('')}</div><div class="poskey">${pos.map((k, i) => `<span>${k} <b>${byPos[i]}</b></span>`).join('')}</div></div>
      <div><div class="warn"><span class="foil rare" aria-hidden="true"></span><div><b>No Rare goalkeeper</b><br><span>So Rare competitions stay locked; your ${c.byRarity.rare} Rares play in Limited ones.</span></div></div><span class="lbl">${sealed} sealed${other ? ` · ${other} for sale or in an offer` : ''} · left out</span></div>
    </section>`;
  }

  function renderHome() {
    const lgw = state.lgw;
    const g = L.gws[lgw];
    const gws = Object.keys(L.gws).map(Number);
    const first = g.fixtures[0].utc, last = g.fixtures[g.fixtures.length - 1].utc;
    const lgDates = `${+at(first).day}–${dm(last)}`;
    $('#app').innerHTML = homeHead() + `<div class="bento" data-lg="${state.lg}">` + (state.moment === 'ready' ? planTile() : nextTile() + lastTile()) +
      `<div class="sec"><h2>LaLiga</h2><span class="meta">GW${lgw} · ${lgDates} · ${g.fixtures.length} matches</span><span class="push mini-sw" role="group" aria-label="LaLiga gameweek"><button type="button" id="lgPrev" aria-label="Previous gameweek" ${lgw <= Math.min(...gws) ? 'disabled' : ''}>${LEFT}</button><span>GW${lgw}</span><button type="button" id="lgNext" aria-label="Next gameweek" ${lgw >= Math.max(...gws) ? 'disabled' : ''}>${CHEV2}</button></span></div>` +
      `<div class="lg-tabs"><div class="mode" role="group" aria-label="LaLiga view" id="lgTabs"><span class="knob" aria-hidden="true"></span><button type="button" data-lg="fx" aria-pressed="${state.lg === 'fx'}">Fixtures</button><button type="button" data-lg="diff" aria-pressed="${state.lg === 'diff'}">Difficulty</button><button type="button" data-lg="tbl" aria-pressed="${state.lg === 'tbl'}">Table</button></div></div>` +
      fixturesTile(g) + difficultyTile(g, lgw) + tableTile() +
      `<div class="sec"><h2><span class="foil limited stack" aria-hidden="true"></span>Sorare</h2><span class="meta">yares</span></div>` + myCards() + '</div>';
    $('#lgPrev').addEventListener('click', () => { state.lgw -= 1; renderHome(); });
    $('#lgNext').addEventListener('click', () => { state.lgw += 1; renderHome(); });
    $$('#lgTabs button').forEach((b) => b.addEventListener('click', () => { state.lg = b.dataset.lg; $('.bento').dataset.lg = state.lg; $$('#lgTabs button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); placeKnob($('#lgTabs')); }));
    placeKnob($('#lgTabs'));
    animate();
  }

  /* ======================================================= PLAY */
  function playHead() {
    const t = DATA.timeline.find((x) => x.id === state.gw);
    const played = t.status === 'done';
    const locked = new Date(t.lock) <= NOW;
    const eyebrow = t.laliga ? 'Sorare · LaLiga returns' : state.gw === '15' ? 'Sorare · LaLiga GW7' : 'Sorare · international break';
    const right = played ? `<div class="mode" role="group" aria-label="Show" id="modeSw"><span class="knob" aria-hidden="true"></span><button type="button" data-a="0" aria-pressed="${!state.after}">Before the lock</button><button type="button" data-a="1" aria-pressed="${state.after}">After the games</button></div>` : '';
    return `<header class="head play-head"><div><p class="eyebrow"><span class="foil limited sm" aria-hidden="true"></span>${eyebrow}</p><h1>Gameweek ${state.gw}</h1><p class="sub"><span>${wd(t.start)} ${t.dates}</span><span class="dot"></span><span>${locked ? 'locked' : 'locks'} ${wd(t.lock)} ${hm(t.lock)}</span>${played ? '<span class="dot"></span><span>played</span>' : t.status === 'live' ? '<span class="dot"></span><span>live</span>' : ''}</p></div>${right}</header>`;
  }
  function playTimeline() {
    const items = DATA.timeline.map((t) => {
      const dot = t.status === 'done' ? 'done' : t.status === 'live' ? 'live' : t.id === '17' ? 'next' : 'later';
      let extra = '';
      if (t.id === '15') extra = `<em>${ESS(11)}${n0(t.won)}</em>`;
      else if (t.laliga) extra = '<span class="tl-tag">LaLiga</span>';
      else if (t.playing !== undefined) extra = `<em>${t.playing}</em> play`;
      return `<button type="button" class="tl-item" data-gw="${t.id}" aria-pressed="${t.id === state.gw}"><span class="tl-top"><span class="tl-dot ${dot}"></span>GW${t.id}</span><span class="tl-date">${t.dates}${extra ? ' · ' + extra : ''}</span></button>`;
    }).join('');
    return `<div class="timeline"><button class="tl-arrow" type="button" id="tlPrev" aria-label="Previous gameweek">${LEFT}</button><div class="tl-track" id="track" role="group" aria-label="Gameweek"><span class="tl-knob" id="knob" aria-hidden="true"></span>${items}</div><button class="tl-arrow" type="button" id="tlNext" aria-label="Next gameweek">${CHEV2}</button></div>`;
  }

  const groupOrder = ['In-season', 'Classic', 'Room'];
  function mix(plan) {
    const by = {};
    plan.lineups.forEach((lu) => { by[lu.group] = (by[lu.group] || 0) + lu.starters.length + lu.subs.length; });
    return groupOrder.filter((g) => by[g]).map((g) => `<i style="flex:${by[g]};background:${GROUP_COL[g]}"></i>`).join('') + `<i style="flex:${DATA.cards.usable - plan.cardsUsed};background:#e2e2e7"></i>`;
  }
  function planSwitch() {
    const P = DATA.gw15.plans;
    return `<div class="plans" role="group" aria-label="Plan" id="plans"><span class="knob" aria-hidden="true"></span>${P.map((p, i) => {
      const v = state.after ? `<b>${p.actual.essence ? n0(p.actual.essence) : '0'}</b> won` : `<b>${pct(p.pAny)}</b> · ≈${n0(p.essence)}`;
      return `<button type="button" data-p="${i}" aria-pressed="${i === state.plan}"><span class="p1">Plan ${i + 1}${i === 0 ? '<span class="best">best</span>' : ''}</span><span class="p2">${v}</span><span class="mix" aria-hidden="true">${mix(p)}</span></button>`;
    }).join('')}</div>`;
  }

  function planHero(p) {
    const lus = p.lineups;
    const counts = {};
    lus.forEach((lu) => { counts[lu.comp] = (counts[lu.comp] || 0) + 1; });
    const title = `${lus.length} lineups`;
    const byGroup = {};
    lus.forEach((lu) => { byGroup[lu.group] = (byGroup[lu.group] || 0) + lu.starters.length + lu.subs.length; });
    const key = Object.entries(counts).map(([c, n]) => { const lu = lus.find((x) => x.comp === c); return `<li><i style="background:${GROUP_COL[lu.group]}"></i><b>${esc(c)}${n > 1 ? ` ×${n}` : ''}</b><span>${lus.filter((x) => x.comp === c).reduce((s, x) => s + x.starters.length + x.subs.length, 0)} cards</span></li>`; }).join('') +
      `<li><i style="background:#e2e2e7"></i><b style="font-weight:500;color:var(--ink-2)">Not used</b><span>${DATA.cards.usable - p.cardsUsed} cards</span></li>`;
    const a = p.actual;
    const pair = state.after
      ? `<div class="pair"><div class="won"><span class="lbl">${ESS(13)}Essence won</span><b data-to="${a.essence}" data-sep="1">${n0(a.essence)}</b><small>expected ≈${n0(p.essence)}</small></div><div class="won"><span class="lbl">${CASH(13)}Cash won</span><b>$${a.cash}</b><small>expected ≈$${p.cash.toFixed(2)}</small></div></div>`
      : `<div class="pair"><div><span class="lbl">${ESS(13)}Essence</span><b>≈<span data-to="${p.essence}" data-sep="1">${n0(p.essence)}</span></b><small>expected</small></div><div><span class="lbl">${CASH(13)}Cash</span><b>≈$${p.cash.toFixed(2)}</b><small>expected · never converted</small></div></div>`;
    const paid = a.paid;
    const ringP = state.after ? paid / lus.length : p.pAny;
    const ringLbl = state.after ? 'lineups paid' : 'any reward';
    const side = state.after
      ? `<span><b>${paid} of ${lus.length}</b> lineups paid</span><span><b>${lus.filter((lu) => lu.actual.total >= lu.lo && lu.actual.total <= lu.hi).length} of ${lus.length}</b> inside the range</span>`
      : `<span><b>${p.returns.toFixed(1)}</b> rewards expected</span><span><b>${p.cardsUsed}</b> of ${DATA.cards.usable} cards used</span>`;
    return `<section class="hero" aria-live="polite">
      <div class="hero-id"><p class="eyebrow" style="margin:0">Plan ${state.plan + 1} of ${DATA.gw15.plans.length}</p><div class="hero-name"><span class="foil limited lg stack" aria-hidden="true"></span><h2>${title}</h2></div>
        <div class="hero-ring">${ring(ringP, ringLbl)}<div class="ring-side">${side}</div></div></div>
      <div class="hero-num">${pair}<div class="actions"><button class="btn primary tip" type="button" aria-disabled="true" data-tip="Saves every lineup through your sorare.com tab (extension)">Apply plan</button><button class="btn soft" type="button" id="cmp">Compare plans</button></div></div>
      <div class="alloc"><span class="sub-h"><span>Where your cards go</span><span>${p.cardsUsed} / ${DATA.cards.usable}</span></span><div class="alloc-bar" role="img" aria-label="Cards per competition">${mix(p)}</div><ul class="alloc-key">${key}</ul></div>
    </section>`;
  }

  function miniCards(lu) {
    const st = lu.starters.map((c) => {
      const out = state.after && c.actual == null;
      const sc = state.after ? (c.actual == null ? `<span class="sc dnp">DNP</span>` : `<span class="sc" style="background:${c.actual >= 70 ? '#2b8a3e' : c.actual >= 55 ? '#37b24d' : c.actual >= 40 ? '#e0b000' : c.actual >= 25 ? '#fd7e14' : '#fa5252'}">${Math.round(c.actual)}</span>`) : '';
      return `<span class="mc${c.captain ? ' captain' : ''}${out ? ' out' : ''}" title="${esc(c.name)}${c.captain ? ' · captain' : ''}${c.inSeason ? ' · in-season' : ''}"><span class="art">${img(c.pic, c.name)}</span>${c.captain ? '<i class="c">C</i>' : ''}${c.inSeason ? '<i class="isd"></i>' : ''}${sc}</span>`;
    }).join('');
    const subs = lu.subs.map((c) => {
      const inn = state.after && c.cameIn;
      const sc = inn ? `<span class="sc" style="background:var(--accent)">${Math.round(c.actual)}</span>` : '';
      return `<span class="mc sub${inn ? ' in' : ''}" title="Sub · ${esc(c.name)}${c.inSeason ? ' · in-season' : ''}"><span class="art">${img(c.pic, c.name)}</span>${c.inSeason ? '<i class="isd"></i>' : ''}${sc}</span>`;
    }).join('');
    return `<div class="lu-cards" aria-hidden="true">${st}${subs ? `<span class="div"></span><span class="sl">Subs</span>${subs}` : ''}</div>`;
  }
  function rangeBar(lu) {
    const a = lu.actual;
    const lo = Math.min(lu.lo, lu.need, state.after ? a.total : 1e9, state.after && a.need ? a.need : 1e9) - 20;
    const hi = Math.max(lu.hi, lu.need, state.after ? a.total : 0, state.after && a.need ? a.need : 0) + 20;
    const at = (v) => ((v - lo) / (hi - lo)) * 100;
    const need = lu.group === 'Room' ? `${lu.need} for 3rd` : `${lu.need} needed`;
    return `<div class="range" role="img" aria-label="xScore ${lu.x}, bad week ${lu.lo}, good week ${lu.hi}; ${need}${state.after ? `; scored ${a.total}` : ''}"><span class="rail"></span><span class="band" style="left:${at(lu.lo)}%;width:${at(lu.hi) - at(lu.lo)}%"></span>${state.after && a.need ? `<span class="need act" style="left:${at(a.need)}%"><span>${a.need} needed</span></span>` : `<span class="need" style="left:${at(lu.need)}%"><span>${need}</span></span>`}<span class="dot" style="left:${at(lu.x)}%"></span>${state.after ? `<span class="act" style="left:${at(a.total)}%"></span>` : `<span class="ends"><span>${lu.lo}</span><span>${lu.hi}</span></span>`}</div>`;
  }
  function rewardChips(lu) {
    if (state.after) {
      const a = lu.actual;
      if (a.cash) return `<span class="rw won">${CASH()}$${a.cash}</span>`;
      if (a.essence > 0) return `<span class="rw won">${ESS()}${n0(a.essence)}</span>`;
      if (a.card) return '<span class="rw won">Card</span>';
      return `<span class="rw none">No reward</span>`;
    }
    const chips = [];
    if (lu.eEss) chips.push(`<span class="rw ${lu.eEss < 0 ? 'neg' : ''}">${ESS()}≈${n0(lu.eEss)}${lu.fee ? ' <small>net</small>' : ''}</span>`);
    if (lu.eCash >= 0.01) chips.push(`<span class="rw">${CASH()}≈$${lu.eCash.toFixed(2)}</span>`);
    if (lu.pCard >= 0.01) chips.push(`<span class="rw">Card <small>${pct(lu.pCard)}</small></span>`);
    return chips.join('');
  }
  function payNote(lu) {
    if (lu.group === 'Room') return `Top 3 of 10 · ${lu.fee} to enter`;
    const paid = lu.tiers.filter((t) => t.cash || t.essence || t.card);
    const last = paid[paid.length - 1];
    return `Top ${n0(last.hi)} of ≈${n0(lu.entries)} pays`;
  }
  function luCard(lu, i) {
    const p = state.after ? null : lu.pReturn;
    const fmt = lu.group === 'Room' ? `5 · ${lu.cap ? 'cap ' + lu.cap : 'no cap'}` : `${lu.size} + ${lu.subSlots} subs${lu.minInSeason ? ' · 4 in-season' : ''}`;
    const main = state.after
      ? `<div class="kv2"><b>${lu.actual.total}</b><span>scored · xScore ${lu.x}</span></div><div class="kv2 ${lu.actual.essence > 0 || lu.actual.cash ? 'good' : ''}"><b>${lu.actual.cash ? '$' + lu.actual.cash : lu.actual.essence > 0 ? n0(lu.actual.essence) : '0'}</b><span>${lu.actual.cash ? 'cash' : 'essence'} won</span></div>`
      : `<div class="kv2"><b>${lu.x}</b><span>xScore</span></div><div class="kv2"><b>${pct(p)}</b><span>reward chance</span></div>`;
    return `<button type="button" class="lu" data-l="${i}" style="--i:${i}"><span class="edge" aria-hidden="true"></span>
      <div class="lu-top"><span class="nm">${esc(lu.comp)}</span><span class="grp ${lu.group}">${lu.group}</span><span class="fmt">${fmt}</span>${CHEV}</div>
      <div class="lu-main">${main}${rangeBar(lu)}</div>
      ${state.after ? '' : `<div class="meter ${tone(p)}" role="img" aria-label="${pct(p)} chance of a reward"><i style="width:${Math.round(p * 100)}%"></i></div>`}
      ${miniCards(lu)}
      <div class="lu-foot">${rewardChips(lu)}<span class="note2">${payNote(lu)}</span></div></button>`;
  }

  function extras() {
    const g = DATA.gw15;
    const nw = g.notWorth.map((x) => `<li><span class="foil limited sm" aria-hidden="true"></span><b>${esc(x.name)}</b><em class="neg">${x.eEss > 0 ? '+' : ''}${n0(x.eEss)} essence expected</em></li>`).join('');
    const bl = g.blocked.map((x) => `<li><span class="foil ${x.rarity} sm" aria-hidden="true"></span><b>${esc(x.name)}</b><em>${esc(x.why)}</em></li>`).join('');
    const rules = [
      ['2', '<b>Two subs, only in lineups that have them.</b> One goalkeeper, one outfield player (in-season, All Star, Champion, U23). Rooms of 10 have none.'],
      ['↺', '<b>A sub only covers a player who doesn’t play.</b> Goalkeeper for goalkeeper; outfield for the same position, or any outfield player in the Extra slot. A late cameo counts as playing.'],
      ['4', '<b>In-season lineups keep 4 in-season cards.</b> A Classic sub can’t come in if that leaves 3, so Sofix only picks in-season subs there.'],
      ['−', '<b>A sub costs the lineup bonuses.</b> When one comes in, the lineup loses its multi-club (+2%) and average-cap (+4%) bonuses, and a sub never gets the captain’s.'],
      ['1', '<b>Each card once per gameweek.</b> Sealed cards, cards for sale or in an offer are left out.'],
      ['$', '<b>Cash and essence side by side.</b> Plans are ranked on both, each against the best one this gameweek; one is never turned into the other.'],
    ].map(([ic, t]) => `<li><span class="ic">${ic}</span><span>${t}</span></li>`).join('');
    return `<details class="fold"><summary>Also open, not worth it <span>· ${g.notWorth.length}</span>${CHEV2}</summary><ul>${nw}</ul></details>
      <details class="fold"><summary>Not playable <span>· ${g.blocked.length}</span>${CHEV2}</summary><ul>${bl}</ul></details>
      <details class="fold" open><summary>How subs and plans work${CHEV2}</summary><ul class="rules-list">${rules}</ul></details>`;
  }

  function gwState(id) {
    if (id === '17') {
      const g = DATA.gw17, proj = until(g.projectionsAt);
      const faces = g.players.map((p) => `<div class="face"><span class="av">${img(p.avatar, p.name)}${p.inSeason ? '<i class="is"></i>' : ''}${p.cards > 1 ? `<i class="n2">×${p.cards}</i>` : ''}</span><b>${esc(p.name.split(' ').slice(-1)[0])}</b><span>${vsLabel(p)}</span></div>`).join('');
      const opts = g.playable.map((o) => `<li><span class="foil limited sm" aria-hidden="true"></span><span class="nm">${esc(o.name)}<small>${o.group === 'Room' ? 'Room of 10' : `${o.size} + ${o.subs} subs`}${o.cap ? ` · cap ${o.cap}` : ''}</small></span><span class="fee ${o.fee ? '' : 'free'}">${o.fee ? `${ESS(12)}${o.fee}` : 'Free'}</span><span class="mx">${o.max}<small>×</small></span></li>`).join('');
      return `<section class="gw-state"><div style="display:flex;flex-direction:column;gap:16px"><div><h2>Plans ${wd(g.projectionsAt)} ${hm(g.projectionsAt)}</h2><p>Sorare publishes its projections for GW17 then. Sofix builds your 5 full-gameweek plans from them, and their reward chances once GW16, the first break week under this season’s rules, has scores.</p></div>
        <div class="big"><b>${g.players.reduce((s, p) => s + p.cards, 0)}</b><span>of your cards play · ${proj.d} d ${proj.h} h to the projections</span></div><div class="faces" tabindex="0" role="group" aria-label="Your players with a game">${faces}</div></div>
        <div><div class="sub-h"><span>You can play</span><span>lineups</span></div><ul class="opts">${opts}</ul>${g.blocked.filter((b) => b.rarity === 'limited').map((b) => `<div class="t-foot" style="margin-top:8px">${esc(b.name)} · ${esc(b.why.toLowerCase())}</div>`).join('')}</div></section>`;
    }
    if (id === '16') return `<section class="gw-state"><div><h2>None of your cards play</h2><p>GW16 is Nations League games only, and none of your players has one. It locked today at 16:00.</p></div><div></div></section>`;
    if (id === '21') {
      const g = DATA.gw21;
      const opts = g.playable.map((o) => `<li><span class="foil limited sm" aria-hidden="true"></span><span class="nm">${esc(o.name)}<small>${o.group === 'Room' ? 'Room of 10' : `${o.size} + ${o.subs} subs`}</small></span><span class="fee ${o.fee ? '' : 'free'}">${o.fee ? `${ESS(12)}${o.fee}` : 'Free'}</span><span class="mx">${o.group === 'Room' ? '' : `≤${o.max}`}</span></li>`).join('');
      return `<section class="gw-state"><div><h2>LaLiga is back</h2><p>All ${DATA.cards.usable} of your cards have a game. Sorare publishes the rewards a few days before; your plans follow as soon as the projections do.</p></div><div><div class="sub-h"><span>You’ll be able to play</span><span>lineups</span></div><ul class="opts">${opts}</ul></div></section>`;
    }
    const t = DATA.timeline.find((x) => x.id === id);
    return `<section class="gw-state"><div><h2>Break week</h2><p>GW${id} (${t.dates}) opens later. Its plan shows here once Sorare publishes projections.</p></div><div></div></section>`;
  }

  function renderPlay() {
    let html = playHead() + playTimeline();
    if (state.gw === '15') {
      const p = DATA.gw15.plans[state.plan];
      html += planSwitch() + planHero(p);
      html += `<div class="sec-head"><h3>Lineups</h3><span>${state.after ? 'what each scored and won' : 'tap one for the cards, subs and rewards'}</span></div><div class="lus">${p.lineups.map(luCard).join('')}</div>`;
      html += extras();
    } else {
      html += gwState(state.gw);
    }
    $('#app').innerHTML = html;
    wirePlay();
    animate();
  }

  function placeKnob(group) {
    if (!group) return;
    const knob = $('.knob', group), on = $('[aria-pressed="true"]', group);
    if (!knob || !on) return;
    knob.style.width = `${on.offsetWidth}px`;
    knob.style.transform = `translateX(${on.offsetLeft - (group.id === 'plans' ? 5 : 4)}px)`;
  }
  function placeTl() {
    const item = $(`.tl-item[data-gw="${state.gw}"]`), knob = $('#knob');
    if (!item) return;
    knob.style.width = `${item.offsetWidth}px`;
    knob.style.transform = `translateX(${item.offsetLeft - 5}px)`;
    const tr = $('#track');
    tr.scrollTo({ left: item.offsetLeft - tr.clientWidth / 2 + item.offsetWidth / 2, behavior: REDUCED ? 'auto' : 'smooth' });
    const ids = DATA.timeline.map((t) => t.id);
    $('#tlPrev').disabled = state.gw === ids[0];
    $('#tlNext').disabled = state.gw === ids[ids.length - 1];
  }
  function wirePlay() {
    $$('.tl-item').forEach((b) => b.addEventListener('click', () => { state.gw = b.dataset.gw; renderPlay(); }));
    const ids = DATA.timeline.map((t) => t.id);
    $('#tlPrev').addEventListener('click', () => { const i = ids.indexOf(state.gw); if (i > 0) { state.gw = ids[i - 1]; renderPlay(); } });
    $('#tlNext').addEventListener('click', () => { const i = ids.indexOf(state.gw); if (i < ids.length - 1) { state.gw = ids[i + 1]; renderPlay(); } });
    placeTl();
    const ms = $('#modeSw');
    if (ms) { $$('button', ms).forEach((b) => b.addEventListener('click', () => { state.after = b.dataset.a === '1'; renderPlay(); })); placeKnob(ms); }
    const pl = $('#plans');
    if (pl) {
      $$('button', pl).forEach((b) => b.addEventListener('click', () => { state.plan = +b.dataset.p; renderPlay(); }));
      placeKnob(pl);
      $('#cmp')?.addEventListener('click', () => pl.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'center' }));
    }
    $$('.lu').forEach((b) => b.addEventListener('click', () => openSheet(DATA.gw15.plans[state.plan].lineups[+b.dataset.l], b)));
  }

  /* ---------- lineup sheet ---------- */
  let lastFocus = null;
  function ribCls(v) { return v == null ? 's0' : v >= 70 ? 's9' : v >= 55 ? 's7' : v >= 40 ? 's5' : v >= 25 ? 's3' : 's1'; }
  function openSheet(lu, from) {
    lastFocus = from;
    const a = lu.actual;
    const p = lu.pReturn;
    const cards = lu.starters.map((c, i) => {
      const fx = c.fixture || {};
      const val = state.after ? c.actual : c.x;
      const out = state.after && c.actual == null;
      const sub = c.subbedBy ? lu.subs.find((s) => s.slug === c.subbedBy) : null;
      return `<div class="pc${out ? ' out' : ''}" style="--i:${i}"><div class="art">${img(c.pic, c.name)}${c.captain ? '<span class="cap">C</span>' : ''}<span class="rib ${ribCls(val)}">${val == null ? 'DNP' : Math.round(val)}</span></div>
        <div class="who"><b>${esc(c.name)}</b><span class="fxl">${fx.oppCrest ? img(fx.oppCrest) : ''}${fx.opp ? `${fx.venue === 'H' ? 'v' : '@'} ${esc(fx.opp)}` : ''}${fx.kickoff ? ` · ${wd(fx.kickoff)} ${hm(fx.kickoff)}` : ''}${fx.bucket ? `<i class="fdr" style="background:${fdrCol[fx.bucket]}"></i>` : ''}</span></div>
        <div class="nums"><span>plays <b>${pct(c.p)}</b></span><span>×<b>${(c.mult + (c.captain ? lu.captainBonus : 0)).toFixed(2)}</b></span></div>
        <div class="nums"><span>${c.inSeason ? '<span class="tagis">IN-SEASON</span>' : '<span class="tagcl">CLASSIC</span>'}</span><span>${state.after ? (fx.result ? `FT ${fx.result}` : '') : `if plays <b>${Math.round(c.mu)}</b>`}</span></div>
        ${sub && state.after ? `<div class="nums" style="color:var(--accent)"><span>↺ ${esc(sub.name)} came in</span></div>` : ''}</div>`;
    }).join('');
    const subs = lu.subs.length ? `<div class="subs"><span class="lbl">Subs</span>${lu.subs.map((s) => `<div class="subc${state.after && s.cameIn ? ' in' : ''}">${img(s.avatar, s.name)}<div><b>${esc(s.name)}</b><span>${s.slot === 'GK' ? 'goalkeeper' : 'outfield'} · ${s.inSeason ? '<span class="tagis">IN-SEASON</span>' : '<span class="tagcl">CLASSIC</span>'}${state.after ? (s.cameIn ? ` · came in · ${Math.round(s.actual)}` : ' · stayed out') : ` · plays ${pct(s.p)}`}</span></div></div>`).join('')}</div>` : '';
    const ins = lu.starters.filter((c) => c.inSeason).length;
    const clubs = {};
    lu.starters.forEach((c) => { clubs[c.club] = (clubs[c.club] || 0) + 1; });
    const maxClub = Math.max(...Object.values(clubs));
    const checks = [];
    if (lu.minInSeason) checks.push(`<span>${ins} of ${lu.size} in-season (4 needed)</span>`);
    if (lu.cap) checks.push(`<span>Average total ${lu.l10} ≤ ${lu.cap}</span>`);
    if (lu.group !== 'Room') {
      checks.push(`<span class="${maxClub <= 2 ? '' : 'off'}">Max 2 per club ${maxClub <= 2 ? '· +2%' : ''}</span>`);
      const capB = lu.size === 5 ? 260 : 370;
      checks.push(`<span class="${lu.l10 <= capB ? '' : 'off'}">Average total ${lu.l10} ${lu.l10 <= capB ? '≤' : '>'} ${capB} ${lu.l10 <= capB ? '· +4%' : ''}</span>`);
    }
    checks.push(`<span>Captain +${Math.round(lu.captainBonus * 100)}%</span>`);
    if (lu.subs.length) checks.push(`<span>${lu.subs.every((s) => s.inSeason) || !lu.minInSeason ? 'Subs ready' : 'Classic sub'}</span>`);
    if (state.after && a.bonusLost) checks.push('<span class="off">A sub came in: lineup bonuses dropped</span>');
    const ladder = lu.group === 'Room'
      ? `<table>${lu.tiers.map((t) => `<tr><td>${t.label}</td><td>${ESS(12)} ${n0(t.essence)}</td><td>${pct(t.p)}</td></tr>`).join('')}<tr><td>Entry</td><td>${ESS(12)} −${lu.fee}</td><td></td></tr></table>`
      : `<table>${lu.tiers.filter((t) => t.p >= 0.001 || t.hi >= lu.tiers[lu.tiers.length - 1].hi).map((t) => `<tr class="${state.after && ((a.cash && a.cash === t.cash) || (a.essence > 0 && a.essence === t.essence)) ? 'hit' : ''}"><td>${t.lo === t.hi ? `#${t.lo}` : `#${n0(t.lo)}–${n0(t.hi)}`}</td><td>${t.cash ? `${CASH(12)} $${n0(t.cash)}` : t.essence ? `${ESS(12)} ${n0(t.essence)}` : 'Card'}</td><td>${pct(t.p)}</td></tr>`).join('')}</table>`;
    const sum = state.after
      ? `<div class="sh-sum">${ring(lu.actual.essence > 0 || lu.actual.cash ? 1 : 0, 'paid')}<div style="display:flex;flex-direction:column;gap:12px"><div class="big"><b>${a.total}</b><span>scored · xScore ${lu.x} (${lu.lo}–${lu.hi}) · ${a.need ? `${a.need} was needed` : ''}</span></div>${rangeBar(lu)}</div><div class="rewards">${rewardChips(lu)}</div></div>`
      : `<div class="sh-sum">${ring(p, 'reward chance')}<div style="display:flex;flex-direction:column;gap:12px"><div class="big"><b>${lu.x}</b><span>xScore · ${lu.lo}–${lu.hi} from a bad to a good week</span></div>${rangeBar(lu)}</div><div class="rewards" style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">${rewardChips(lu)}<button class="btn primary tip" type="button" aria-disabled="true" data-tip="Saves this lineup through your sorare.com tab">Apply</button></div></div>`;
    $('#sheet').innerHTML = `<div class="sh-head"><span class="foil limited" aria-hidden="true"></span><h2 id="shTitle">${esc(lu.comp)}</h2><span class="grp ${lu.group}">${lu.group}</span><span class="t-meta">${payNote(lu)}</span><button class="x" type="button" id="shClose" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m3 3 8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
      <div class="sh-body">${sum}<div class="cards" style="--n:${lu.starters.length}">${cards}</div>${subs}<div class="checks">${checks.join('')}</div>
      <details class="ladder"${lu.group === 'Room' ? ' open' : ''}><summary>Rewards <span>· chance of each</span>${CHEV2}</summary>${ladder}</details></div>`;
    const scrim = $('#scrim');
    scrim.classList.add('open'); scrim.setAttribute('aria-hidden', 'false');
    $('#shClose').addEventListener('click', closeSheet);
    $('#shClose').focus();
    animate($('#sheet'));
  }
  function closeSheet() {
    const scrim = $('#scrim');
    scrim.classList.remove('open'); scrim.setAttribute('aria-hidden', 'true');
    lastFocus?.focus();
  }
  $('#scrim').addEventListener('click', (e) => { if (e.target.id === 'scrim') closeSheet(); });
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#scrim').classList.contains('open')) closeSheet();
    if (state.view === 'play' && !$('#scrim').classList.contains('open') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && document.activeElement?.classList.contains('tl-item')) {
      const ids = DATA.timeline.map((t) => t.id); const i = ids.indexOf(state.gw) + (e.key === 'ArrowLeft' ? -1 : 1);
      if (i >= 0 && i < ids.length) { state.gw = ids[i]; renderPlay(); $(`.tl-item[data-gw="${state.gw}"]`)?.focus(); }
    }
  });

  /* ======================================================= routing + preview */
  function go(view, opts = {}) {
    state.view = view;
    if (opts.gw) state.gw = opts.gw;
    if (opts.after !== undefined) state.after = opts.after;
    $$('[data-go]').forEach((a) => { if (a.closest('.links, .tabbar')) a.toggleAttribute('aria-current', a.dataset.go === view); if (a.getAttribute('aria-current') === '') a.setAttribute('aria-current', 'page'); });
    $$('#pvView button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === view)));
    document.title = view === 'play' ? `GW${state.gw} · Play · Sofix` : 'Sofix';
    view === 'play' ? renderPlay() : renderHome();
    scrollTo({ top: 0 });
    if (frameMode === 'phone') syncFrame();
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-go]');
    if (!a) return;
    e.preventDefault();
    go(a.dataset.go, { gw: a.dataset.gw, after: a.dataset.after ? true : undefined });
  });
  let frameMode = 'pc';
  function syncFrame() {
    $('#phoneFrame').src = `${location.pathname}?embed=1&view=${state.view}&gw=${state.gw}&moment=${state.moment}`;
  }
  $$('#pvView button').forEach((b) => b.addEventListener('click', () => go(b.dataset.v)));
  $$('#pvMoment button').forEach((b) => b.addEventListener('click', () => {
    state.moment = b.dataset.m;
    $$('#pvMoment button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    go('home');
  }));
  $$('#pvFrame button').forEach((b) => b.addEventListener('click', () => {
    frameMode = b.dataset.f;
    $$('#pvFrame button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    $('#stage').hidden = frameMode !== 'phone';
    if (frameMode === 'phone') syncFrame();
  }));
  addEventListener('resize', () => { if (state.view === 'play') { placeTl(); placeKnob($('#plans')); placeKnob($('#modeSw')); } else placeKnob($('#lgTabs')); });

  $('#note').innerHTML = `<p>Design preview · S2 reopened (22 Sep 2026). Real data only, read from Sorare’s public API with the existing key: your ${DATA.cards.total} cards (yares), every competition’s rules (subs included), rewards, entry fees, past reward cut-offs, ${'sampled'} rooms of 10, and your players’ scores this season. LaLiga tiles: Sofix’s own published board.</p>
    <p>GW15 is replayed as Sofix would have planned it before its lock (18 Sep, 16:00), with only what was known then: each player’s last five games for his chance of playing and his score. That quick forecast misses by ${DATA.gw15.spread} points a player; the live app uses Sorare’s own projections and starting chances, published two days before each lock. Reward chances compare the lineup with the scores that paid in the last comparable gameweek (GW13) and with ${'real'} rooms of 10 from GW13–14.</p>`;
  go(state.view);
})();
</script>
</body>
</html>
