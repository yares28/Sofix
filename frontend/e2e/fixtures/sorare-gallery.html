<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gallery • Sorare</title>
<style>
/* A stand-in for your Sorare gallery (/football/my-club/<you>/cards/limited, measured 21 Oct 2026): a toolbar row with the sort
   on the right and "All / Reveal" on the left, then cards, each with a price row and a "Bought 2 days ago" row under it. */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: #0e0e0e; color: #fff; font: 14px/1.4 -apple-system, "Segoe UI", sans-serif; }
h1 { margin: 0 0 12px; font-size: 20px; }
.toolbar { display: flex; flex-direction: row-reverse; justify-content: space-between; align-items: center; height: 32px; margin-bottom: 16px; }
.toolbar button { height: 32px; padding: 0 12px; border: 1px solid #333; border-radius: 8px; background: #1c1c1f; color: #fff; }
.chips { display: flex; gap: 6px; }
.grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.slot { width: 163px; display: flex; flex-direction: column; gap: 6px; }
.card { position: relative; overflow: hidden; border-radius: 8px; background: #000; }
.card img { display: block; width: 100%; height: auto; aspect-ratio: 320 / 452; object-fit: cover; }
.col { display: flex; flex-direction: column; }
.price { font-weight: 650; }
.ago { display: flex; color: #b6b6bf; font-size: 12px; }
</style>
</head>
<body>
<main>
<h1>Gallery</h1>
<div class="toolbar" id="toolbar">
  <div><button type="button">New</button></div>
  <div class="chips"><button type="button">All</button><button type="button">Reveal</button></div>
</div>
<div class="grid" id="grid">
  <div class="slot" id="g-simon">
    <div class="card"><img alt="Unai Simón - limited" src="https://assets.sorare.com/card/11111111-aaaa-4aaa-8aaa-000000000001/picture/tinified-aaa1.png"></div>
    <div class="col"><div class="price">€3.02 0.0014 ETH</div><div class="ago"><div>Bought 2 days ago</div></div></div>
  </div>
  <div class="slot" id="g-cubarsi">
    <div class="card"><img alt="Pau Cubarsí - rare" src="https://assets.sorare.com/card/11111111-aaaa-4aaa-8aaa-000000000002/picture/tinified-aaa2.png"></div>
    <div class="col"><div class="ago"><div>Crafted 5 days ago</div></div></div>
  </div>
  <div class="slot" id="g-havertz">
    <div class="card"><img alt="Kai Havertz - limited" src="https://assets.sorare.com/card/11111111-aaaa-4aaa-8aaa-000000000008/picture/tinified-aaa8.png"></div>
    <div class="col"><div class="price">€7.35 0.0031 ETH</div><div class="ago"><div>Bought 22 days ago</div></div></div>
  </div>
</div>
</main>
<script>
setTimeout(function () {
  fetch("https://api.sorare.com/graphql", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ operationName: "LineupQuery", query: "query LineupQuery { cards { slug } }" }),
  }).then(function (r) { return r.json(); }).then(function () {
    // Drawn after the answer, as Sorare does: a picture no answer names, so only his name is known (another card of his was in the
    // answer), and the card's own link says which card it is.
    document.getElementById("grid").insertAdjacentHTML("beforeend", '<div class="slot" id="g-messi">'
      + '<a class="card" href="/football/my-club/yares/cards/limited?card=lionel-messi-2026-limited-77"><img alt="Lionel Messi - limited" src="https://assets.sorare.com/card/11111111-aaaa-4aaa-8aaa-000000000009/picture/tinified-aaa9.png"></a>'
      + '<div class="col"><div class="price">€5.00 0.0021 ETH</div><div class="ago"><div>Bought 9 days ago</div></div></div></div>');
    document.body.dataset.answered = "yes";
  });
}, 250);
</script>
</body>
</html>
